<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Pen: Block & Save – 2-Player Puzzle</title>
<meta name="description" content="Farm Pen: Block & Save: A cozy, turn-based/simultaneous 2-player grid puzzle game. Push wooden crates to guide wandering chicks into your pen on one shared keyboard!">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #2e4a32 0%, #1c3322 60%, #0d1c12 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Arial Rounded MT Bold", "Segoe UI Black", "Trebuchet MS", system-ui, sans-serif;
  }
  canvas {
    display: block;
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 0 3px rgba(255,255,255,0.15);
    background: #1b2f21;
    cursor: default;
  }
  h1 { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<main>
  <h1>Farm Pen: Block & Save</h1>
  <canvas id="game" aria-label="Farm Pen: Block & Save canvas game"></canvas>
</main>
<script>
'use strict';

/* ==========================================================================
   CONSTANTS & CONFIGURATION
   ========================================================================== */
const W = 1280, H = 720;
const FONT = '"Arial Rounded MT Bold", "Segoe UI Black", "Trebuchet MS", system-ui, sans-serif';
const GRID_N = 10;
const TOTAL_CHICKS = 6;
const CRATE_COUNT = 9;

// Colors
const COL = {
  bg: '#1c3322',
  tableBorder: '#3d2514',
  boardWood: '#cfa976',
  tileGrass1: '#7bc859',
  tileGrass2: '#72be50',
  gridLine: '#5ea340',
  crateWood: '#9e5d2b',
  crateDark: '#5c3315',
  crateTop: '#b8743b',
  crateCross: '#4a260d',
  p1: {
    main: '#3b82f6',
    dark: '#1d4ed8',
    light: '#bfdbfe',
    penBg: '#dbeafe',
    penStraw: '#fde047',
    name: 'Blue Farmer'
  },
  p2: {
    main: '#ec4899',
    dark: '#be185d',
    light: '#fbcfe8',
    penBg: '#fce7f3',
    penStraw: '#fde047',
    name: 'Pink Farmer'
  },
  chick: {
    body: '#facc15',
    dark: '#ca8a04',
    light: '#fef08a',
    beak: '#f97316'
  }
};

/* ==========================================================================
   BOARD GEOMETRY (STATIC 10x10 GRID)
   ========================================================================== */
const BOARD = {
  cx: 640,
  cy: 395,
  tileSize: 54,
  get totalW() { return GRID_N * this.tileSize; },
  get totalH() { return GRID_N * this.tileSize; },
  get x0() { return this.cx - this.totalW / 2; },
  get y0() { return this.cy - this.totalH / 2; }
};

function tilePos(r, c) {
  return {
    x: BOARD.x0 + c * BOARD.tileSize + BOARD.tileSize / 2,
    y: BOARD.y0 + r * BOARD.tileSize + BOARD.tileSize / 2
  };
}

/* ==========================================================================
   AUDIO SYNTHESIZER (WEB AUDIO API - ZERO EXTERNAL ASSETS)
   ========================================================================== */
let AC = null, MG = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MG = AC.createGain();
      MG.gain.value = 0.5;
      const comp = AC.createDynamicsCompressor();
      MG.connect(comp);
      comp.connect(AC.destination);
    } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function osc(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MG);
  o.start(t); o.stop(t + dur + 0.05);
}

function noise(dur, vol, ftype, f0, f1, delay = 0) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = ftype;
  const t = a.currentTime + delay;
  f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG);
  s.start(t); s.stop(t + dur + 0.05);
}

const SFX = {
  step() {
    osc('triangle', 180, 90, 0.08, 0.25);
    noise(0.05, 0.15, 'lowpass', 600, 200);
  },
  push() {
    // Deep wooden thud
    osc('triangle', 220, 60, 0.14, 0.45);
    noise(0.1, 0.4, 'lowpass', 1200, 300);
  },
  peep(isRescue = false) {
    if (isRescue) {
      // Cheerful double chirp
      osc('sine', 1200, 1800, 0.12, 0.35);
      osc('triangle', 1500, 2200, 0.15, 0.3, 0.08);
      osc('sine', 2000, 2600, 0.18, 0.25, 0.16);
    } else {
      osc('sine', 950, 1350, 0.09, 0.15);
    }
  },
  fanfare() {
    const notes = [
      [392, 0.0, 0.2],
      [523, 0.12, 0.2],
      [659, 0.24, 0.22],
      [784, 0.38, 0.5],
      [1046, 0.55, 0.8]
    ];
    notes.forEach(([f, del, dur]) => {
      osc('triangle', f, null, dur, 0.25, del);
      osc('sine', f * 2, null, dur, 0.12, del);
    });
  },
  restart() {
    osc('sine', 440, 660, 0.1, 0.2);
  }
};

/* ==========================================================================
   CANVAS & RESIZE
   ========================================================================== */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let scale = 1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  scale = s * dpr;
}
addEventListener('resize', resize);

/* ==========================================================================
   DRAWING UTILITIES
   ========================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function circle(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0, r), 0, TAU);
}

function drawHeart(x, y, s, col = '#ef4444') {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(-9, -8, -15, 3, 0, 15);
  ctx.bezierCurveTo(15, 3, 9, -8, 0, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ==========================================================================
   GAME STATE & ENTITIES
   ========================================================================== */
let time = 0;
let gameOver = false;
let scores = [0, 0]; // [P1 Blue, P2 Pink]

// Players: P1 (Blue) starts at (2, 2); P2 (Pink) starts at (7, 7)
let players = [
  { id: 0, r: 2, c: 2, animX: 0, animY: 0, facing: 1, moveCooldown: 0 },
  { id: 1, r: 7, c: 7, animX: 0, animY: 0, facing: -1, moveCooldown: 0 }
];

// Wooden Crates
let crates = [];

// Cute Chicks
let chicks = [];

// Particles
let particles = [];
function addP(o) {
  if (particles.length > 350) particles.shift();
  particles.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 1, max: 1, size: 5, color: '#fff', rot: 0, vr: 0, type: 'dot' }, o));
}
function burst(x, y, col, n = 16, sp = 120, size = 6, type = 'dot') {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = Math.random() * sp;
    addP({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4,
      max: 0.9,
      size: Math.random() * size + 2,
      color: typeof col === 'function' ? col() : col,
      type
    });
  }
}

// Pen Definitions
// Blue Pen: Top-Left (r: 0..1, c: 0..1)
function isP1Pen(r, c) { return r <= 1 && c <= 1; }
// Pink Pen: Bottom-Right (r: 8..9, c: 8..9)
function isP2Pen(r, c) { return r >= 8 && c >= 8; }
function isAnyPen(r, c) { return isP1Pen(r, c) || isP2Pen(r, c); }

/* ==========================================================================
   INITIALIZATION & LEVEL GENERATION
   ========================================================================== */
function initGame() {
  gameOver = false;
  scores = [0, 0];
  particles = [];

  // Reset players
  players = [
    { id: 0, r: 2, c: 2, animX: 0, animY: 0, facing: 1, moveCooldown: 0 },
    { id: 1, r: 7, c: 7, animX: 0, animY: 0, facing: -1, moveCooldown: 0 }
  ];

  // Spawn 9 wooden crates in open playfield (not inside pens, not overlapping players)
  crates = [];
  const occupied = new Set();
  occupied.add('2,2'); occupied.add('7,7');
  for (let r = 0; r <= 1; r++) for (let c = 0; c <= 1; c++) occupied.add(`${r},${c}`);
  for (let r = 8; r <= 9; r++) for (let c = 8; c <= 9; c++) occupied.add(`${r},${c}`);

  // Handcrafted good crate placements for tactical funnels, randomized slightly
  const candidatePool = [
    [2, 3], [3, 2], [2, 5], [5, 2],
    [4, 4], [5, 5], [4, 6], [6, 4],
    [6, 7], [7, 6], [4, 3], [5, 7],
    [3, 5], [6, 3], [3, 7], [7, 3]
  ].sort(() => Math.random() - 0.5);

  for (const [cr, cc] of candidatePool) {
    if (crates.length >= CRATE_COUNT) break;
    const key = `${cr},${cc}`;
    if (!occupied.has(key)) {
      crates.push({ r: cr, c: cc, animX: 0, animY: 0 });
      occupied.add(key);
    }
  }

  // Spawn 6 cute chicks in the central area (r: 3..6, c: 3..6)
  chicks = [];
  const chickPool = [
    [3, 3], [3, 6], [4, 5], [5, 4], [6, 3], [6, 6],
    [4, 2], [2, 4], [5, 7], [7, 5]
  ].sort(() => Math.random() - 0.5);

  for (const [chr, chc] of chickPool) {
    if (chicks.length >= TOTAL_CHICKS) break;
    const key = `${chr},${chc}`;
    if (!occupied.has(key)) {
      chicks.push({
        id: chicks.length,
        r: chr,
        c: chc,
        animX: 0,
        animY: 0,
        penned: null, // null | 0 (Blue) | 1 (Pink)
        penSlot: null,
        hopTimer: 0.8 + Math.random() * 1.5,
        facing: Math.random() < 0.5 ? -1 : 1,
        peepTimer: 2.0 + Math.random() * 4.0
      });
      occupied.add(key);
    }
  }

  SFX.restart();
}

/* ==========================================================================
   INPUT HANDLING (SIMULTANEOUS SPLIT-KEYBOARD)
   ========================================================================== */
const KeyState = new Set();
const KeyPressed = new Set();

addEventListener('keydown', e => {
  audio();
  const codes = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
  if (codes.includes(e.code)) e.preventDefault();

  if (!e.repeat) KeyPressed.add(e.code);
  KeyState.add(e.code);

  if (e.code === 'Space') {
    initGame();
  }
}, { passive: false });

addEventListener('keyup', e => {
  KeyState.delete(e.code);
});
addEventListener('blur', () => { KeyState.clear(); KeyPressed.clear(); });

/* ==========================================================================
   GRID LOGIC & PUSHING MECHANICS
   ========================================================================== */
function getCrateAt(r, c) {
  return crates.find(cr => cr.r === r && cr.c === c) || null;
}

function getChickAt(r, c) {
  return chicks.find(ch => ch.r === r && ch.c === c) || null;
}

function getPlayerAt(r, c) {
  return players.find(p => p.r === r && p.c === c) || null;
}

/**
 * Attempt to move a player in direction (dr, dc)
 * Handles Sokoban crate pushing!
 */
function tryMovePlayer(p, dr, dc) {
  if (gameOver) return false;
  const nr = p.r + dr, nc = p.c + dc;

  // Board boundary check
  if (nr < 0 || nr >= GRID_N || nc < 0 || nc >= GRID_N) return false;

  // Cannot walk into opponent player
  const otherP = players[1 - p.id];
  if (otherP.r === nr && otherP.c === nc) return false;

  // Face movement direction
  if (dc !== 0) p.facing = dc > 0 ? 1 : -1;

  // Check if target tile has a crate
  const crate = getCrateAt(nr, nc);
  if (crate) {
    // Attempt to PUSH the crate!
    const behindR = nr + dr, behindC = nc + dc;

    // Check if behind space is valid for crate
    if (behindR < 0 || behindR >= GRID_N || behindC < 0 || behindC >= GRID_N) return false;

    // Cannot push crates inside pens
    if (isAnyPen(behindR, behindC)) return false;

    // Cannot push into another crate
    if (getCrateAt(behindR, behindC)) return false;

    // Cannot push into any player
    if (getPlayerAt(behindR, behindC)) return false;

    // Cannot push into any chick
    if (getChickAt(behindR, behindC)) return false;

    // PUSH SUCCESS!
    const oldCratePos = tilePos(crate.r, crate.c);
    const newCratePos = tilePos(behindR, behindC);
    crate.r = behindR;
    crate.c = behindC;
    crate.animX = oldCratePos.x - newCratePos.x;
    crate.animY = oldCratePos.y - newCratePos.y;

    // Player steps forward into crate's previous tile
    const oldPPos = tilePos(p.r, p.c);
    const newPPos = tilePos(nr, nc);
    p.r = nr;
    p.c = nc;
    p.animX = oldPPos.x - newPPos.x;
    p.animY = oldPPos.y - newPPos.y;

    SFX.push();
    burst(newCratePos.x, newCratePos.y, COL.crateWood, 10, 80, 5);
    return true;
  }

  // Normal step onto empty tile or pen
  // Cannot walk into an unpenned chick (step around chicks)
  const chick = getChickAt(nr, nc);
  if (chick && chick.penned === null) return false;

  const oldPos = tilePos(p.r, p.c);
  const newPos = tilePos(nr, nc);
  p.r = nr;
  p.c = nc;
  p.animX = oldPos.x - newPos.x;
  p.animY = oldPos.y - newPos.y;

  SFX.step();
  return true;
}

/* ==========================================================================
   CHICK WANDERING AI & PENNING
   ========================================================================== */
function assignPenSlot(chick, penOwner) {
  // Slots inside 2x2 pen:
  // P1 Pen: (0,0), (0,1), (1,0), (1,1)
  // P2 Pen: (8,8), (8,9), (9,8), (9,9)
  const rBase = penOwner === 0 ? 0 : 8;
  const cBase = penOwner === 0 ? 0 : 8;
  const countInPen = chicks.filter(c => c.penned === penOwner).length;
  const slotIdx = countInPen % 4;

  const rOffset = Math.floor(slotIdx / 2);
  const cOffset = slotIdx % 2;
  return { r: rBase + rOffset, c: cBase + cOffset };
}

function updateChicks(dt) {
  for (const ch of chicks) {
    if (ch.penned !== null) continue; // Safely resting in pen

    ch.hopTimer -= dt;
    ch.peepTimer -= dt;

    if (ch.peepTimer <= 0) {
      ch.peepTimer = 3.5 + Math.random() * 5.0;
      SFX.peep(false);
    }

    if (ch.hopTimer <= 0) {
      ch.hopTimer = 1.8 + Math.random() * 0.8;

      // Directions: Up, Down, Left, Right
      const dirs = [
        { dr: -1, dc: 0 },
        { dr: 1, dc: 0 },
        { dr: 0, dc: -1 },
        { dr: 0, dc: 1 }
      ].sort(() => Math.random() - 0.5);

      for (const d of dirs) {
        const nr = ch.r + d.dr, nc = ch.c + d.dc;

        // Bounds check
        if (nr < 0 || nr >= GRID_N || nc < 0 || nc >= GRID_N) continue;

        // Blocked by crates
        if (getCrateAt(nr, nc)) continue;

        // Blocked by players
        if (getPlayerAt(nr, nc)) continue;

        // Blocked by another unpenned chick
        const otherChick = getChickAt(nr, nc);
        if (otherChick && otherChick.penned === null) continue;

        // Valid move!
        const oldPos = tilePos(ch.r, ch.c);
        const newPos = tilePos(nr, nc);
        ch.r = nr;
        ch.c = nc;
        ch.animX = oldPos.x - newPos.x;
        ch.animY = oldPos.y - newPos.y;
        if (d.dc !== 0) ch.facing = d.dc > 0 ? 1 : -1;

        // Check if chick stepped into Player 1's Pen!
        if (isP1Pen(nr, nc)) {
          ch.penned = 0;
          scores[0]++;
          ch.penSlot = assignPenSlot(ch, 0);
          SFX.peep(true);
          burst(newPos.x, newPos.y, '#ef4444', 16, 120, 7, 'heart');
          burst(newPos.x, newPos.y, COL.p1.main, 12, 100, 5);
        }
        // Check if chick stepped into Player 2's Pen!
        else if (isP2Pen(nr, nc)) {
          ch.penned = 1;
          scores[1]++;
          ch.penSlot = assignPenSlot(ch, 1);
          SFX.peep(true);
          burst(newPos.x, newPos.y, '#ef4444', 16, 120, 7, 'heart');
          burst(newPos.x, newPos.y, COL.p2.main, 12, 100, 5);
        }

        break;
      }
    }
  }

  // Check Win Condition (All 6 chicks penned!)
  if (!gameOver && scores[0] + scores[1] === TOTAL_CHICKS) {
    gameOver = true;
    SFX.fanfare();
    const winX = scores[0] >= scores[1] ? BOARD.x0 + 60 : BOARD.x0 + BOARD.totalW - 60;
    const winY = scores[0] >= scores[1] ? BOARD.y0 + 60 : BOARD.y0 + BOARD.totalH - 60;
    burst(winX, winY, '#ffd700', 36, 180, 8);
    burst(W / 2, H / 2, '#ffffff', 28, 200, 7);
  }
}

/* ==========================================================================
   UPDATE LOOP
   ========================================================================== */
function update(dt) {
  time += dt;

  // Player 1 Input (W, A, S, D)
  const p1 = players[0];
  p1.moveCooldown = Math.max(0, p1.moveCooldown - dt);
  if (p1.moveCooldown <= 0) {
    let dr = 0, dc = 0;
    if (KeyState.has('KeyW')) dr--;
    else if (KeyState.has('KeyS')) dr++;
    else if (KeyState.has('KeyA')) dc--;
    else if (KeyState.has('KeyD')) dc++;

    if (dr !== 0 || dc !== 0) {
      if (tryMovePlayer(p1, dr, dc)) {
        p1.moveCooldown = 0.16;
      }
    }
  }

  // Player 2 Input (Arrow Keys)
  const p2 = players[1];
  p2.moveCooldown = Math.max(0, p2.moveCooldown - dt);
  if (p2.moveCooldown <= 0) {
    let dr = 0, dc = 0;
    if (KeyState.has('ArrowUp')) dr--;
    else if (KeyState.has('ArrowDown')) dr++;
    else if (KeyState.has('ArrowLeft')) dc--;
    else if (KeyState.has('ArrowRight')) dc++;

    if (dr !== 0 || dc !== 0) {
      if (tryMovePlayer(p2, dr, dc)) {
        p2.moveCooldown = 0.16;
      }
    }
  }

  // Update wandering chicks
  updateChicks(dt);

  // Smooth entity interpolation
  for (const p of players) {
    p.animX = lerp(p.animX, 0, 0.28);
    p.animY = lerp(p.animY, 0, 0.28);
  }
  for (const cr of crates) {
    cr.animX = lerp(cr.animX, 0, 0.28);
    cr.animY = lerp(cr.animY, 0, 0.28);
  }
  for (const ch of chicks) {
    ch.animX = lerp(ch.animX, 0, 0.28);
    ch.animY = lerp(ch.animY, 0, 0.28);
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    if (pt.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vx *= 0.93;
    pt.vy *= 0.93;
  }

  KeyPressed.clear();
}

/* ==========================================================================
   RENDER PIPELINE (ANTI-MOTION SICKNESS: 100% STATIC CAMERA & BOARD)
   ========================================================================== */

function drawEnvironment() {
  // Rich cozy farm tabletop / ground
  const bg = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 720);
  bg.addColorStop(0, '#2e4a32');
  bg.addColorStop(0.65, '#1e3624');
  bg.addColorStop(1, '#0e1d13');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Wooden Board Frame Shadow & Border
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 36;
  ctx.shadowOffsetY = 16;
  rr(ctx, BOARD.x0 - 20, BOARD.y0 - 20, BOARD.totalW + 40, BOARD.totalH + 40, 22);
  ctx.fillStyle = '#3a2010';
  ctx.fill();
  ctx.restore();

  // Wooden Frame
  const wg = ctx.createLinearGradient(BOARD.x0 - 20, 0, BOARD.x0 + BOARD.totalW + 20, 0);
  wg.addColorStop(0, '#5a3418');
  wg.addColorStop(0.5, '#754622');
  wg.addColorStop(1, '#4e2d14');
  ctx.fillStyle = wg;
  rr(ctx, BOARD.x0 - 20, BOARD.y0 - 20, BOARD.totalW + 40, BOARD.totalH + 40, 22);
  ctx.fill();
  ctx.strokeStyle = '#2d1808';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 4 Corner Brass Inlays
  const corners = [
    [BOARD.x0 - 10, BOARD.y0 - 10],
    [BOARD.x0 + BOARD.totalW + 10, BOARD.y0 - 10],
    [BOARD.x0 - 10, BOARD.y0 + BOARD.totalH + 10],
    [BOARD.x0 + BOARD.totalW + 10, BOARD.y0 + BOARD.totalH + 10]
  ];
  corners.forEach(([cx, cy]) => {
    ctx.fillStyle = '#ffd54f';
    circle(cx, cy, 6); ctx.fill();
    ctx.strokeStyle = '#b28900'; ctx.lineWidth = 1.5; ctx.stroke();
  });
}

function drawBoardGrid() {
  const ts = BOARD.tileSize;

  // 1. Draw 10x10 Tiles
  for (let r = 0; r < GRID_N; r++) {
    for (let c = 0; c < GRID_N; c++) {
      const x = BOARD.x0 + c * ts;
      const y = BOARD.y0 + r * ts;

      // Alternating subtle checkerboard lawn
      ctx.fillStyle = (r + c) % 2 === 0 ? COL.tileGrass1 : COL.tileGrass2;
      ctx.fillRect(x, y, ts, ts);

      // Fine grid lines
      ctx.strokeStyle = COL.gridLine;
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, ts, ts);
    }
  }

  // 2. Player 1 Pen (Blue, Top-Left 2x2: r: 0..1, c: 0..1)
  const p1PenX = BOARD.x0, p1PenY = BOARD.y0;
  const penSize = 2 * ts;
  rr(ctx, p1PenX + 2, p1PenY + 2, penSize - 4, penSize - 4, 12);
  ctx.fillStyle = 'rgba(59, 130, 246, 0.22)';
  ctx.fill();
  ctx.strokeStyle = COL.p1.main;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Straw bedding texture in P1 Pen
  ctx.fillStyle = 'rgba(253, 224, 71, 0.35)';
  for (let i = 0; i < 6; i++) {
    const sx = p1PenX + 18 + (i % 3) * 30;
    const sy = p1PenY + 22 + Math.floor(i / 3) * 36;
    rr(ctx, sx, sy, 22, 10, 3);
    ctx.fill();
  }

  // 3. Player 2 Pen (Pink, Bottom-Right 2x2: r: 8..9, c: 8..9)
  const p2PenX = BOARD.x0 + 8 * ts, p2PenY = BOARD.y0 + 8 * ts;
  rr(ctx, p2PenX + 2, p2PenY + 2, penSize - 4, penSize - 4, 12);
  ctx.fillStyle = 'rgba(236, 72, 153, 0.22)';
  ctx.fill();
  ctx.strokeStyle = COL.p2.main;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Straw bedding texture in P2 Pen
  ctx.fillStyle = 'rgba(253, 224, 71, 0.35)';
  for (let i = 0; i < 6; i++) {
    const sx = p2PenX + 18 + (i % 3) * 30;
    const sy = p2PenY + 22 + Math.floor(i / 3) * 36;
    rr(ctx, sx, sy, 22, 10, 3);
    ctx.fill();
  }

  // Pen Corner Badges
  drawHeart(p1PenX + 22, p1PenY + 22, 0.9, COL.p1.main);
  drawHeart(p2PenX + penSize - 22, p2PenY + penSize - 22, 0.9, COL.p2.main);
}

/* ==========================================================================
   SPRITE DRAWING: CRATES, CHICKS, FARMERS
   ========================================================================== */

function drawCrate(cr) {
  const tp = tilePos(cr.r, cr.c);
  const x = tp.x + cr.animX;
  const y = tp.y + cr.animY;
  const s = BOARD.tileSize * 0.88;

  ctx.save();
  ctx.translate(x, y);

  // Cast shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
  rr(ctx, -s / 2 + 2, -s / 2 + 5, s, s, 6);
  ctx.fill();

  // Crate main body
  const cg = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
  cg.addColorStop(0, COL.crateTop);
  cg.addColorStop(0.7, COL.crateWood);
  cg.addColorStop(1, COL.crateDark);
  ctx.fillStyle = cg;
  rr(ctx, -s / 2, -s / 2, s, s, 6);
  ctx.fill();

  // Crate border
  ctx.strokeStyle = '#381c08';
  ctx.lineWidth = 2;
  rr(ctx, -s / 2, -s / 2, s, s, 6);
  ctx.stroke();

  // 'X' Crossbeam
  ctx.strokeStyle = COL.crateCross;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-s * 0.32, -s * 0.32); ctx.lineTo(s * 0.32, s * 0.32);
  ctx.moveTo(s * 0.32, -s * 0.32); ctx.lineTo(-s * 0.32, s * 0.32);
  ctx.stroke();

  // Corner rivets
  ctx.fillStyle = '#ffd54f';
  [
    [-s * 0.36, -s * 0.36], [s * 0.36, -s * 0.36],
    [-s * 0.36, s * 0.36], [s * 0.36, s * 0.36]
  ].forEach(([rx, ry]) => {
    circle(rx, ry, 2); ctx.fill();
  });

  ctx.restore();
}

function drawCuteChick(ch) {
  const tp = tilePos(ch.r, ch.c);
  const x = tp.x + ch.animX;
  const y = tp.y + ch.animY;
  const r = BOARD.tileSize * 0.32;

  // Gentle hopping bounce
  const hop = Math.abs(ch.animX) + Math.abs(ch.animY);
  const hopY = Math.sin(clamp(hop / 40, 0, 1) * Math.PI) * 12;

  ctx.save();
  ctx.translate(x, y - hopY);
  if (ch.facing < 0) ctx.scale(-1, 1);

  // Soft shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.75 + hopY * 0.5, r * 0.85, r * 0.35, 0, 0, TAU);
  ctx.fill();

  // Fluffy Yellow Body
  const bg = ctx.createRadialGradient(-2, -2, 2, 0, 0, r);
  bg.addColorStop(0, COL.chick.light);
  bg.addColorStop(0.65, COL.chick.body);
  bg.addColorStop(1, COL.chick.dark);
  ctx.fillStyle = bg;
  circle(0, 0, r); ctx.fill();
  ctx.strokeStyle = COL.chick.dark; ctx.lineWidth = 1.8; ctx.stroke();

  // Tiny Wing
  ctx.fillStyle = '#fde047';
  ctx.beginPath();
  ctx.ellipse(-r * 0.25, 0, r * 0.45, r * 0.3, -0.2, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = COL.chick.dark; ctx.lineWidth = 1.2; ctx.stroke();

  // Expressive Big Eye
  ctx.fillStyle = '#ffffff';
  circle(r * 0.3, -r * 0.15, 4.5); ctx.fill();
  ctx.fillStyle = '#1e293b';
  circle(r * 0.35, -r * 0.15, 2.8); ctx.fill();
  ctx.fillStyle = '#ffffff';
  circle(r * 0.28, -r * 0.22, 1.2); ctx.fill();

  // Orange Beak
  ctx.fillStyle = COL.chick.beak;
  ctx.beginPath();
  ctx.moveTo(r * 0.65, -r * 0.1);
  ctx.lineTo(r + 4, 0);
  ctx.lineTo(r * 0.65, r * 0.1);
  ctx.closePath();
  ctx.fill();

  // Penned Heart Indicator
  if (ch.penned !== null) {
    const heartCol = ch.penned === 0 ? COL.p1.main : COL.p2.main;
    drawHeart(0, -r - 10, 0.65, heartCol);
  }

  ctx.restore();
}

function drawFarmerSprite(x, y, playerIdx, facing = 1, hopY = 0, s = 1) {
  const r = BOARD.tileSize * 0.4 * s;
  const col = playerIdx === 0 ? COL.p1 : COL.p2;

  ctx.save();
  ctx.translate(x, y - hopY);
  if (facing < 0) ctx.scale(-1, 1);

  // Soft shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.85 + hopY * 0.5, r * 0.95, r * 0.38, 0, 0, TAU);
  ctx.fill();

  // Farmer Dungarees / Overalls Body
  const og = ctx.createRadialGradient(-2, 2, 2, 0, 2, r);
  og.addColorStop(0, col.light);
  og.addColorStop(0.65, col.main);
  og.addColorStop(1, col.dark);
  ctx.fillStyle = og;
  circle(0, 4 * s, r * 0.85); ctx.fill();
  ctx.strokeStyle = col.dark; ctx.lineWidth = 2 * s; ctx.stroke();

  // Overall straps
  ctx.fillStyle = '#ffffff';
  rr(ctx, -r * 0.45, -2 * s, r * 0.22, r * 0.6, 2 * s); ctx.fill();
  rr(ctx, r * 0.22, -2 * s, r * 0.22, r * 0.6, 2 * s); ctx.fill();

  // Head
  ctx.fillStyle = '#ffdfba'; // Soft peach skin
  circle(0, -r * 0.35, r * 0.62); ctx.fill();
  ctx.strokeStyle = '#d4a373'; ctx.lineWidth = 1.5 * s; ctx.stroke();

  // Rosy cheeks
  ctx.fillStyle = 'rgba(255, 120, 140, 0.55)';
  circle(-r * 0.32, -r * 0.25, 3.5 * s); ctx.fill();
  circle(r * 0.32, -r * 0.25, 3.5 * s); ctx.fill();

  // Big happy eyes
  ctx.fillStyle = '#1e293b';
  circle(-r * 0.16, -r * 0.35, 3.2 * s); ctx.fill();
  circle(r * 0.16, -r * 0.35, 3.2 * s); ctx.fill();
  ctx.fillStyle = '#ffffff';
  circle(-r * 0.2, -r * 0.39, 1.2 * s); ctx.fill();
  circle(r * 0.12, -r * 0.39, 1.2 * s); ctx.fill();

  // Cute smile
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5 * s; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, -r * 0.25, 4 * s, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Straw Hat
  ctx.fillStyle = '#fde047';
  ctx.beginPath();
  ctx.ellipse(0, -r * 0.72, r * 0.95, r * 0.32, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2 * s; ctx.stroke();

  // Hat Crown
  ctx.fillStyle = '#eab308';
  rr(ctx, -r * 0.45, -r * 1.15, r * 0.9, r * 0.48, 6 * s); ctx.fill();
  ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 1.5 * s; ctx.stroke();

  // Hat colored ribbon
  ctx.fillStyle = col.main;
  rr(ctx, -r * 0.45, -r * 0.82, r * 0.9, 5 * s, 2 * s); ctx.fill();

  ctx.restore();
}

function drawFarmer(p) {
  const tp = tilePos(p.r, p.c);
  const x = tp.x + p.animX;
  const y = tp.y + p.animY;
  const step = Math.abs(p.animX) + Math.abs(p.animY);
  const stepY = Math.sin(clamp(step / 40, 0, 1) * Math.PI) * 10;
  drawFarmerSprite(x, y, p.id, p.facing, stepY, 1);
}

/* ==========================================================================
   SIDE PANELS & INTERACTIVE CONTROLS
   ========================================================================== */
function drawKeyButton(x, y, w, h, label, isDown, col) {
  const d = isDown ? 3 : 0;
  // Shadow
  rr(ctx, x - w / 2, y - h / 2 + 4, w, h, 8);
  ctx.fillStyle = '#0f172a';
  ctx.fill();

  // Keycap
  rr(ctx, x - w / 2, y - h / 2 + d, w, h, 8);
  ctx.fillStyle = isDown ? col.main : '#ffffff';
  ctx.fill();
  ctx.strokeStyle = isDown ? '#ffffff' : '#cbd5e1';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Label
  ctx.font = `900 ${Math.round(Math.min(w, h) * 0.48)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = isDown ? '#ffffff' : '#1e293b';
  ctx.fillText(label, x, y + d + 1);
}

function drawPlayerPanel(playerIdx) {
  const isP1 = playerIdx === 0;
  const col = isP1 ? COL.p1 : COL.p2;
  const panelX = isP1 ? 170 : 1110;
  const w = 270, h = 560;
  const x0 = panelX - w / 2, y0 = 95;

  ctx.save();

  // Background card plate
  rr(ctx, x0, y0, w, h, 20);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.fill();
  ctx.strokeStyle = col.main;
  ctx.lineWidth = 3.5;
  ctx.stroke();

  // Large Cute Farmer Portrait
  const avatarY = y0 + 75;
  drawFarmerSprite(panelX, avatarY, playerIdx, isP1 ? 1 : -1, 0, 1.25);

  // Player Name & Score
  ctx.font = `900 20px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = col.dark;
  ctx.fillText(col.name, panelX, y0 + 138);

  // Score Badge
  const scoreY = y0 + 172;
  rr(ctx, panelX - 70, scoreY - 18, 140, 36, 18);
  ctx.fillStyle = col.light;
  ctx.fill();
  ctx.strokeStyle = col.main;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = `900 16px ${FONT}`;
  ctx.fillStyle = col.dark;
  ctx.fillText(`🐣 RESCUED: ${scores[playerIdx]}`, panelX, scoreY + 1);

  // Divider
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x0 + 20, y0 + 208); ctx.lineTo(x0 + w - 20, y0 + 208);
  ctx.stroke();

  // Goal & Strategy Visual (Zero English Barrier)
  const diagY = y0 + 265;
  // Crate -> Push -> Chick -> Pen icon flow
  ctx.save();
  ctx.translate(panelX - 70, diagY);
  rr(ctx, -16, -16, 32, 32, 5);
  ctx.fillStyle = COL.crateWood; ctx.fill();
  ctx.strokeStyle = COL.crateCross; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-11, -11); ctx.lineTo(11, 11);
  ctx.moveTo(11, -11); ctx.lineTo(-11, 11);
  ctx.stroke();
  ctx.restore();

  // Arrow 1
  ctx.fillStyle = '#64748b';
  ctx.font = `900 18px ${FONT}`;
  ctx.fillText('➔', panelX - 30, diagY);

  // Chick Mini
  ctx.save();
  ctx.translate(panelX + 10, diagY);
  circle(0, 0, 14); ctx.fillStyle = COL.chick.body; ctx.fill();
  ctx.strokeStyle = COL.chick.dark; ctx.lineWidth = 1.5; ctx.stroke();
  circle(4, -2, 3); ctx.fillStyle = '#000'; ctx.fill();
  circle(3, -3, 1); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = COL.chick.beak;
  ctx.beginPath(); ctx.moveTo(9, -2); ctx.lineTo(14, 0); ctx.lineTo(9, 2); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Arrow 2
  ctx.fillStyle = '#64748b';
  ctx.fillText('➔', panelX + 48, diagY);

  // Pen Icon
  drawHeart(panelX + 80, diagY, 0.9, col.main);

  // Divider
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x0 + 20, y0 + 315); ctx.lineTo(x0 + w - 20, y0 + 315);
  ctx.stroke();

  // KEYBOARD CONTROLS CLUSTER (Interactive real-time pressing!)
  ctx.font = `900 14px ${FONT}`;
  ctx.fillStyle = '#334155';
  ctx.fillText('KEYBOARD CONTROLS', panelX, y0 + 342);

  const padY = y0 + 420;
  if (isP1) {
    // WASD Cluster
    drawKeyButton(panelX, padY - 42, 54, 46, 'W', KeyState.has('KeyW'), col);
    drawKeyButton(panelX - 58, padY + 12, 54, 46, 'A', KeyState.has('KeyA'), col);
    drawKeyButton(panelX, padY + 12, 54, 46, 'S', KeyState.has('KeyS'), col);
    drawKeyButton(panelX + 58, padY + 12, 54, 46, 'D', KeyState.has('KeyD'), col);
  } else {
    // Arrow Keys Cluster
    drawKeyButton(panelX, padY - 42, 54, 46, '▲', KeyState.has('ArrowUp'), col);
    drawKeyButton(panelX - 58, padY + 12, 54, 46, '◀', KeyState.has('ArrowLeft'), col);
    drawKeyButton(panelX, padY + 12, 54, 46, '▼', KeyState.has('ArrowDown'), col);
    drawKeyButton(panelX + 58, padY + 12, 54, 46, '▶', KeyState.has('ArrowRight'), col);
  }

  // Footer status indicator
  const penStatusY = y0 + 515;
  ctx.font = `800 12px ${FONT}`;
  ctx.fillStyle = col.dark;
  const penLocText = isP1 ? '📍 PEN: TOP-LEFT CORNER' : '📍 PEN: BOTTOM-RIGHT CORNER';
  ctx.fillText(penLocText, panelX, penStatusY);

  ctx.restore();
}

/* ==========================================================================
   TOP CHICK STATUS TRACKER & BOTTOM BAR (STATIC & CLEAN)
   ========================================================================== */
function drawTopHUD() {
  const cx = W / 2;

  // Title Banner
  ctx.save();
  ctx.font = `900 24px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('FARM PEN: BLOCK & SAVE', cx, 30);

  // 6 Chick Rescue Badges Tracker
  const badgeW = 380, badgeH = 44, by = 64;
  rr(ctx, cx - badgeW / 2, by - badgeH / 2, badgeW, badgeH, 22);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Draw 6 Chick slots
  for (let k = 0; k < TOTAL_CHICKS; k++) {
    const slotX = cx - 130 + k * 52;
    const slotY = by;
    const ch = chicks[k];

    ctx.save();
    if (!ch || ch.penned === null) {
      // Roaming chick: golden badge
      circle(slotX, slotY, 15);
      ctx.fillStyle = 'rgba(250, 204, 21, 0.25)';
      ctx.fill();
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#facc15';
      circle(slotX, slotY, 7);
      ctx.fill();
    } else if (ch.penned === 0) {
      // Rescued by Blue Farmer!
      circle(slotX, slotY, 16);
      ctx.fillStyle = COL.p1.main;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      drawHeart(slotX, slotY - 1, 0.6, '#ffffff');
    } else if (ch.penned === 1) {
      // Rescued by Pink Farmer!
      circle(slotX, slotY, 16);
      ctx.fillStyle = COL.p2.main;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      drawHeart(slotX, slotY - 1, 0.6, '#ffffff');
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawBottomBar() {
  const cx = W / 2, cy = 694;

  ctx.save();
  ctx.font = `700 13px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.fillText('⌨️ P1: W A S D • P2: ARROWS • SPACE: NEW BOARD LAYOUT', cx, cy);
  ctx.restore();
}

function drawVictoryScreen() {
  if (!gameOver) return;
  const cx = W / 2;

  ctx.save();
  // Translucent backdrop
  ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
  ctx.fillRect(0, 0, W, H);

  // Victory Card
  const cw = 460, ch = 250;
  rr(ctx, cx - cw / 2, H / 2 - ch / 2, cw, ch, 24);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  let winCol = '#ffd54f';
  let winText = 'IT’S A TIE! BOTH SAVED 3 CHICKS! 🐣';
  if (scores[0] > scores[1]) {
    winCol = COL.p1.main;
    winText = '👑 BLUE FARMER WINS! 👑';
  } else if (scores[1] > scores[0]) {
    winCol = COL.p2.main;
    winText = '👑 PINK FARMER WINS! 👑';
  }

  ctx.strokeStyle = winCol;
  ctx.lineWidth = 5;
  ctx.stroke();

  // Winner Icon
  if (scores[0] !== scores[1]) {
    const winId = scores[0] > scores[1] ? 0 : 1;
    drawFarmerSprite(cx, H / 2 - 45, winId, 1, 0, 1.4);
  }

  // Winner Text
  ctx.font = `900 24px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = winCol;
  ctx.fillText(winText, cx, H / 2 + 25);

  ctx.font = `700 14px ${FONT}`;
  ctx.fillStyle = '#475569';
  ctx.fillText(`Final Count: Blue ${scores[0]} - Pink ${scores[1]}`, cx, H / 2 + 55);

  // Prompt button
  const startY = H / 2 + 92;
  rr(ctx, cx - 120, startY - 20, 240, 42, 21);
  ctx.fillStyle = '#22c55e';
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.font = `900 15px ${FONT}`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('⚡ PRESS SPACE: PLAY AGAIN', cx, startY);

  ctx.restore();
}

function drawParticles() {
  for (const pt of particles) {
    const alpha = clamp(pt.life / pt.max, 0, 1);
    ctx.globalAlpha = alpha;
    if (pt.type === 'heart') {
      drawHeart(pt.x, pt.y, pt.size * 0.14 * alpha, pt.color);
    } else {
      ctx.fillStyle = pt.color;
      circle(pt.x, pt.y, pt.size * alpha);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ==========================================================================
   RENDER PIPELINE
   ========================================================================== */
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 1. Tabletop & Board Frame
  drawEnvironment();

  // 2. 10x10 Lawn Grid & Pens
  drawBoardGrid();

  // 3. Wooden Crates
  for (const cr of crates) drawCrate(cr);

  // 4. Chicks
  for (const ch of chicks) drawCuteChick(ch);

  // 5. Farmers (Players)
  for (const p of players) drawFarmer(p);

  // 6. Particles
  drawParticles();

  // 7. Side Panels (P1 & P2 Controls & Info)
  drawPlayerPanel(0);
  drawPlayerPanel(1);

  // 8. Top HUD Chick Tracker & Bottom Help
  drawTopHUD();
  drawBottomBar();

  // 9. Victory Modal
  drawVictoryScreen();
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

// Start game
resize();
initGame();
requestAnimationFrame(loop);

</script>

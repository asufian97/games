<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Frenzy Arena – 2 Player Physics Color Battle</title>
<meta name="description" content="Color Frenzy Arena: a fast-paced 2-player physics color battle. Kick, tackle, mix colors and sink balls into your cat bowl. One keyboard, zero text needed.">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#2a1a5e 0%,#120a2e 60%,#07041a 100%);}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;border-radius:18px;box-shadow:0 0 70px rgba(150,90,255,.35),0 0 0 2px rgba(255,255,255,.06);cursor:pointer;}
  h1{position:absolute;left:-9999px;top:0;}
</style>
</head>
<body>
<main>
  <h1>Color Frenzy Arena</h1>
  <canvas id="game" aria-label="Color Frenzy Arena game"></canvas>
</main>
<script>
'use strict';
/* ================= CONSTANTS ================= */
const W = 1280, H = 720;
const A = { x1: 40, y1: 130, x2: 1240, y2: 700 };
const CX = 640, CY = 415;
const FONT = '"Arial Rounded MT Bold","Segoe UI Black","Trebuchet MS",system-ui,sans-serif';
const COL = { R: '#ff3d5a', B: '#2e8bff', Y: '#ffd331', P: '#a855f7', G: '#22d36b', O: '#ff8a1f' };
const MIX = { R: ['R'], B: ['B'], Y: ['Y'], P: ['R', 'B'], G: ['B', 'Y'], O: ['R', 'Y'] };
const TEAM = [
  { main: '#46a6ff', dark: '#1c56c9', light: '#c8e8ff', glow: 'rgba(70,166,255,' },
  { main: '#ff9b2f', dark: '#c9520b', light: '#ffe3bf', glow: 'rgba(255,155,47,' }
];
const CTRL = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], act: ['Space'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], act: ['Enter', 'NumpadEnter', 'ShiftRight'] }
];
const GAME_KEYS = new Set(CTRL.flatMap(c => [...c.up, ...c.down, ...c.left, ...c.right, ...c.act]));
const BUMPERS = [{ x: 640, y: 285, r: 36, flash: 0 }, { x: 640, y: 545, r: 36, flash: 0 }];
const ICE = [{ x: 640, y: 415, rx: 95, ry: 48 }, { x: 400, y: 625, rx: 120, ry: 44 }, { x: 880, y: 205, rx: 120, ry: 44 }];
const PIPES = [
  { x: 330, y: A.y1, d: 1, puff: 0 }, { x: 950, y: A.y1, d: 1, puff: 0 },
  { x: 330, y: A.y2, d: -1, puff: 0 }, { x: 950, y: A.y2, d: -1, puff: 0 }
];
const WIN_SCORE = 5, MAX_BALLS = 7, PLAYER_SPEED = 340;

/* ================= UTILS ================= */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const shadeCache = {};
function shade(h, amt) {
  const k = h + amt; if (shadeCache[k]) return shadeCache[k];
  const [r, g, b] = hexToRgb(h); const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return shadeCache[k] = `rgb(${Math.round(r + (t - r) * p)},${Math.round(g + (t - g) * p)},${Math.round(b + (t - b) * p)})`;
}
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function inIce(x, y) { for (const i of ICE) { const dx = (x - i.x) / i.rx, dy = (y - i.y) / i.ry; if (dx * dx + dy * dy < 1) return true; } return false; }
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

/* ================= CANVAS ================= */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let scale = 1, floor = null;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  scale = s * dpr; buildFloor();
}
addEventListener('resize', resize);

/* ================= AUDIO ================= */
let AC = null, MG = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MG = AC.createGain(); MG.gain.value = 0.5;
      const comp = AC.createDynamicsCompressor(); MG.connect(comp); comp.connect(AC.destination);
    } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function osc(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f0, f1, delay = 0, q = 1) {
  const a = audio(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = a.currentTime + delay, s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t); s.stop(t + dur + 0.05);
}
function brass(f, t0, dur, vol) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + t0, g = a.createGain(), flt = a.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.setValueAtTime(500, t); flt.frequency.linearRampToValueAtTime(3200, t + 0.06); flt.frequency.linearRampToValueAtTime(1500, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.setValueAtTime(vol, t + dur - 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [0, -8, 8].forEach(dt => { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt; o.connect(flt); o.start(t); o.stop(t + dur + 0.05); });
  flt.connect(g); g.connect(MG);
}
const lastS = {};
function can(n, gap) { const t = performance.now() / 1000; if (lastS[n] && t - lastS[n] < gap) return false; lastS[n] = t; return true; }
const SFX = {
  boing() {
    if (!can('boing', 0.07)) return; const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(640, t + 0.08); o.frequency.exponentialRampToValueAtTime(250, t + 0.34);
    lfo.frequency.value = 26; lg.gain.value = 45; lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.42, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(MG); o.start(t); lfo.start(t); o.stop(t + 0.42); lfo.stop(t + 0.42);
  },
  bonk(v) { if (!can('bonk', 0.05)) return; osc('triangle', 200 + v * 0.15, 100, 0.09, Math.min(0.22, v / 2200)); },
  click() { if (!can('click', 0.04)) return; osc('sine', 1400, 700, 0.04, 0.1); },
  thud() { if (!can('thud', 0.08)) return; noise(0.22, 0.7, 'lowpass', 900, 120); osc('sine', 130, 40, 0.26, 0.6); },
  kick(c) { noise(0.08, 0.4, 'highpass', 2200, 800); osc('square', 180 + c * 240, 70, 0.1, 0.16); if (c > 0.55) noise(0.35, 0.22, 'bandpass', 500, 3500, 0, 2); },
  pick() { if (!can('pick', 0.05)) return; osc('triangle', 520, 1000, 0.09, 0.2); },
  steal() { osc('square', 950, 300, 0.12, 0.1); osc('triangle', 400, 1300, 0.14, 0.16, 0.05); },
  buzzer() { osc('sawtooth', 150, 140, 0.22, 0.22); osc('square', 153, 147, 0.22, 0.1); osc('sawtooth', 108, 96, 0.42, 0.24, 0.24); osc('square', 111, 97, 0.42, 0.1, 0.24); },
  freeze() { for (let i = 0; i < 8; i++) osc('sine', rand(1800, 3800), null, 0.28, 0.07, 0.3 + i * 0.045); noise(0.6, 0.12, 'highpass', 5000, 9000, 0.3); },
  thaw() { osc('sine', 1600, 400, 0.18, 0.12); noise(0.2, 0.15, 'highpass', 3000, 1000); },
  partial() { osc('triangle', 660, null, 0.12, 0.22); osc('triangle', 990, null, 0.2, 0.22, 0.08); },
  score() { [523, 659, 784, 1047].forEach((f, i) => { osc('triangle', f, null, 0.24, 0.24, i * 0.075); osc('square', f, null, 0.16, 0.05, i * 0.075); }); },
  fanfare() {
    const n = [[392, 0, 0.14], [523, 0.15, 0.14], [659, 0.3, 0.14], [784, 0.45, 0.32], [659, 0.8, 0.14], [784, 0.95, 1.1]];
    n.forEach(([f, t, d]) => brass(f, t, d, 0.13));
    brass(523, 0.95, 1.1, 0.09); brass(659, 0.95, 1.1, 0.08); brass(262, 0.95, 1.1, 0.08);
    [0, 0.45, 0.95].forEach(t => { noise(0.5, 0.5, 'lowpass', 300, 60, t); osc('sine', 90, 50, 0.5, 0.4, t); });
  },
  beep(hi) { osc('square', hi ? 1046 : 523, null, hi ? 0.45 : 0.16, 0.16); if (hi) osc('square', 1568, null, 0.45, 0.08); },
  whoosh() { if (!can('whoosh', 0.1)) return; noise(0.18, 0.18, 'bandpass', 400, 2200, 0, 1.5); },
  spawn() { if (!can('spawn', 0.12)) return; osc('sine', 260, 720, 0.13, 0.1); noise(0.16, 0.08, 'lowpass', 1500, 300); },
  boom() { if (!can('boom', 0.12)) return; noise(0.7, 0.35, 'lowpass', 1400, 80); for (let i = 0; i < 5; i++) noise(0.05, 0.08, 'highpass', 4000, 6000, 0.15 + i * 0.06); },
  ready() { osc('triangle', 660, 1320, 0.15, 0.2); osc('triangle', 990, null, 0.2, 0.15, 0.1); }
};

/* ================= INPUT ================= */
const keys = {};
addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code) || e.code === 'Escape') e.preventDefault();
  keys[e.code] = true; audio();
  if (e.code === 'Escape' && state !== 'menu') { state = 'menu'; stateT = 0; ready = [false, false]; menuGo = 0; }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('pointerdown', () => {
  audio();
  if (state === 'menu') startMatch();
  else if (state === 'win' && stateT > 2.5) startMatch();
});

/* ================= STATE ================= */
let state = 'menu', stateT = 0, time = 0;
let P = [], balls = [], bowls = [], target = null, targetT = 0, spawnT = 0;
let shake = 0, flash = 0, flashCol = '#ffffff', winner = -1, tackleCD = 0;
let ready = [false, false], menuGo = 0, prevAct = [true, true], lastBeep = -1, rocketT = 0;
const scorePop = [0, 0];
const parts = [], rockets = [];

function makePlayer(i) {
  return { id: i, x: i ? 1010 : 270, y: CY, vx: 0, vy: 0, r: 26, fx: i ? -1 : 1, fy: 0, ha: i ? Math.PI : 0,
    carry: null, charge: 0, charging: false, stun: 0, score: 0, hitFlash: 0 };
}
function makeBowl(i) { return { owner: i, x: i ? 1165 : 115, y: CY, r: 54, contents: [], frozen: 0, flash: 0, flashCol: '#fff', shake: 0, wrong: 0 }; }

function resetMatch() {
  P = [makePlayer(0), makePlayer(1)]; balls = []; bowls = [makeBowl(0), makeBowl(1)];
  parts.length = 0; rockets.length = 0; target = null; winner = -1; shake = 0; flash = 0;
  pickTarget();
  for (let i = 0; i < 4; i++) spawnBall(PIPES[i]);
  spawnT = 1.5;
}
function startMatch() { resetMatch(); state = 'count'; stateT = 0; lastBeep = -1; ready = [false, false]; menuGo = 0; prevAct = [true, true]; }

function pickTarget() {
  const ks = Object.keys(MIX); let c;
  do { c = pick(ks); } while (target && c === target.c);
  target = { c, needs: MIX[c] }; targetT = 0;
  bowls.forEach(b => b.contents = []);
}
function chooseColor() {
  const needs = target.needs;
  const missing = needs.filter(c => !balls.some(b => b.c === c && !b.dead));
  if (missing.length && Math.random() < 0.8) return pick(missing);
  if (Math.random() < 0.4) return pick(needs);
  return pick(['R', 'B', 'Y']);
}
function spawnBall(pipe, color) {
  pipe = pipe || pick(PIPES);
  pipe.puff = 1;
  balls.push({ x: pipe.x, y: pipe.y + pipe.d * 20, vx: rand(-170, 170), vy: pipe.d * rand(320, 520), r: 16, c: color || chooseColor(),
    holder: null, lastTouch: -1, ng: [0, 0], stealCD: 0, hot: false, spin: rand(0, TAU), born: time, dead: false });
  for (let i = 0; i < 8; i++) addP({ x: pipe.x + rand(-14, 14), y: pipe.y + pipe.d * 12, vx: rand(-60, 60), vy: pipe.d * rand(40, 140), life: 0.5, size: rand(5, 10), color: 'rgba(220,230,255,0.6)', type: 'dot', drag: 3 });
  SFX.spawn();
}
function removeBall(b) { b.dead = true; if (b.holder) { b.holder.carry = null; b.holder = null; } }

/* ================= PARTICLES ================= */
function addP(o) {
  if (parts.length > 1100) parts.shift();
  const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 1, size: 4, color: '#fff', g: 0, drag: 2, type: 'dot', rot: 0, vr: 0, grow: 0, add: false }, o);
  p.max = p.life; parts.push(p);
}
function burst(x, y, color, n, sp, size, life, type = 'dot', extra = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(sp * 0.3, sp);
    addP(Object.assign({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.6, life), size: rand(size * 0.5, size), color, type, rot: rand(0, TAU), vr: rand(-8, 8) }, extra));
  }
}
function iceBurst(x, y) { burst(x, y, '#d8f6ff', 26, 300, 6, 0.8, 'spark'); burst(x, y, '#9ee7ff', 14, 160, 8, 0.9, 'star'); }

/* ================= PHYSICS HELPERS ================= */
function walls(o, rest) {
  let hit = 0;
  if (o.x - o.r < A.x1) { o.x = A.x1 + o.r; if (o.vx < 0) { hit = Math.max(hit, -o.vx); o.vx = -o.vx * rest; } }
  if (o.x + o.r > A.x2) { o.x = A.x2 - o.r; if (o.vx > 0) { hit = Math.max(hit, o.vx); o.vx = -o.vx * rest; } }
  if (o.y - o.r < A.y1) { o.y = A.y1 + o.r; if (o.vy < 0) { hit = Math.max(hit, -o.vy); o.vy = -o.vy * rest; } }
  if (o.y + o.r > A.y2) { o.y = A.y2 - o.r; if (o.vy > 0) { hit = Math.max(hit, o.vy); o.vy = -o.vy * rest; } }
  return hit;
}
function hitStatic(o, sx, sy, sr, rest) {
  const dx = o.x - sx, dy = o.y - sy, d = Math.hypot(dx, dy), min = sr + o.r;
  if (d < min && d > 1e-4) {
    const nx = dx / d, ny = dy / d; o.x = sx + nx * min; o.y = sy + ny * min;
    const vn = o.vx * nx + o.vy * ny;
    if (vn < 0) { o.vx -= (1 + rest) * vn * nx; o.vy -= (1 + rest) * vn * ny; }
    return { nx, ny, vn };
  }
  return null;
}
function hitDynamic(a, b, ma, mb, rest) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
  if (d >= min || d < 1e-4) return -1;
  const nx = dx / d, ny = dy / d, ov = min - d, tm = ma + mb;
  a.x -= nx * ov * (mb / tm); a.y -= ny * ov * (mb / tm); b.x += nx * ov * (ma / tm); b.y += ny * ov * (ma / tm);
  const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (rv > 0) {
    const j = (1 + rest) * rv / (1 / ma + 1 / mb);
    a.vx -= j / ma * nx; a.vy -= j / ma * ny; b.vx += j / mb * nx; b.vy += j / mb * ny;
  }
  return rv;
}

/* ================= GAMEPLAY ================= */
function grab(p, b) {
  b.holder = p; p.carry = b; b.lastTouch = p.id; b.stealCD = 0.6; b.hot = false;
  p.ha = Math.atan2(b.y - p.y, b.x - p.x);
  SFX.pick(); burst(b.x, b.y, COL[b.c], 6, 120, 4, 0.3);
}
function dropBall(p, dir) {
  const b = p.carry; if (!b) return;
  p.carry = null; b.holder = null;
  const s = Math.random() < 0.5 ? -1 : 1;
  b.vx = -dir.y * s * 420 + dir.x * 140; b.vy = dir.x * s * 420 + dir.y * 140;
  b.ng[p.id] = 0.7; b.hot = false;
  burst(b.x, b.y, COL[b.c], 10, 200, 5, 0.4);
}
function doKick(p) {
  const ch = p.charge, power = 360 + 880 * ch;
  if (p.carry) {
    const b = p.carry; p.carry = null; b.holder = null;
    const d = p.r + b.r + 2; b.x = p.x + p.fx * d; b.y = p.y + p.fy * d;
    b.vx = p.fx * power + p.vx * 0.3; b.vy = p.fy * power + p.vy * 0.3;
    b.lastTouch = p.id; b.ng[p.id] = 0.3; b.hot = power > 640;
    p.vx -= p.fx * 120 * ch; p.vy -= p.fy * 120 * ch;
    SFX.kick(ch); burst(b.x, b.y, '#ffffff', 6 + ch * 10, 200 + ch * 200, 4, 0.3, 'spark');
    if (ch > 0.7) shake = Math.max(shake, 4);
    return;
  }
  let best = null, bd = 1e9;
  for (const b of balls) {
    if (b.dead || b.holder) continue;
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
    if (d < p.r + b.r + 32) { const dot = (dx * p.fx + dy * p.fy) / (d || 1); if (dot > -0.2 && d < bd) { best = b; bd = d; } }
  }
  if (best) {
    best.vx = p.fx * power * 0.95; best.vy = p.fy * power * 0.95; best.lastTouch = p.id; best.ng[p.id] = 0.3; best.hot = power > 640;
    SFX.kick(ch); burst(best.x, best.y, '#ffffff', 8, 260, 4, 0.3, 'spark');
    return;
  }
  const o = P[1 - p.id], dx = o.x - p.x, dy = o.y - p.y, d = Math.hypot(dx, dy);
  if (d < p.r + o.r + 26 && (dx * p.fx + dy * p.fy) / (d || 1) > 0.3) {
    o.vx += p.fx * (320 + 520 * ch); o.vy += p.fy * (320 + 520 * ch); o.stun = 0.35 + 0.45 * ch; o.hitFlash = 1;
    if (o.carry) dropBall(o, { x: p.fx, y: p.fy });
    SFX.thud(); shake = Math.max(shake, 6 + ch * 6);
    burst((p.x + o.x) / 2, (p.y + o.y) / 2, '#ffffff', 14, 300, 5, 0.4, 'spark');
    burst((p.x + o.x) / 2, (p.y + o.y) / 2, '#ffe066', 5, 120, 9, 0.6, 'star');
    return;
  }
  SFX.whoosh();
  addP({ x: p.x + p.fx * (p.r + 18), y: p.y + p.fy * (p.r + 18), type: 'ring', size: 6, grow: 26, life: 0.25, color: 'rgba(255,255,255,0.8)' });
}

function sink(b, bowl) {
  removeBall(b);
  const col = COL[b.c];
  burst(bowl.x, bowl.y, col, 20, 280, 6, 0.6);
  addP({ type: 'ring', x: bowl.x, y: bowl.y, size: bowl.r, grow: 70, color: col, life: 0.5 });
  const need = target.needs.filter(c => !bowl.contents.includes(c));
  if (need.includes(b.c)) {
    bowl.contents.push(b.c);
    if (bowl.contents.length >= target.needs.length) scorePoint(bowl.owner, bowl);
    else { SFX.partial(); bowl.flash = 0.7; bowl.flashCol = col; }
  } else {
    SFX.buzzer(); bowl.contents = []; bowl.shake = 0.5; bowl.wrong = 1;
    addP({ type: 'cross', x: bowl.x, y: bowl.y - 90, vy: -40, drag: 1, size: 26, life: 1.1, color: '#ff3355' });
    shake = Math.max(shake, 5);
    if (b.lastTouch >= 0 && b.lastTouch !== bowl.owner) { bowl.frozen = 3; SFX.freeze(); iceBurst(bowl.x, bowl.y); }
  }
}
function scorePoint(owner, bowl) {
  const p = P[owner]; p.score++; scorePop[owner] = 1;
  const c = COL[target.c];
  bowl.flash = 1; bowl.flashCol = c; flash = 0.35; flashCol = c; shake = Math.max(shake, 10);
  burst(bowl.x, bowl.y, c, 40, 520, 8, 1.0);
  burst(bowl.x, bowl.y, '#ffe066', 14, 360, 12, 1.1, 'star');
  addP({ type: 'txt', txt: '+1', x: bowl.x, y: bowl.y - 80, vy: -70, drag: 1, size: 54, life: 1.2, color: TEAM[owner].main });

/* ================= UPDATE ================= */
function stepPlayer(p, dt, playing) {
  let ix = 0, iy = 0; const c = CTRL[p.id];
  if (playing && p.stun <= 0) {
    if (c.up.some(k => keys[k])) iy--; if (c.down.some(k => keys[k])) iy++;
    if (c.left.some(k => keys[k])) ix--; if (c.right.some(k => keys[k])) ix++;
  }
  const l = Math.hypot(ix, iy);
  if (l > 0) { ix /= l; iy /= l; p.fx = ix; p.fy = iy; }
  const ice = inIce(p.x, p.y);
  let max = PLAYER_SPEED; if (p.carry) max *= 0.86; if (p.charging) max *= 0.7;
  const k = p.stun > 0 ? 2.5 : ice ? 1.3 : 11;
  p.vx += (ix * max - p.vx) * Math.min(1, k * dt); p.vy += (iy * max - p.vy) * Math.min(1, k * dt);
  p.x += p.vx * dt; p.y += p.vy * dt;
  walls(p, 0.4);
  for (const bm of BUMPERS) {
    const r = hitStatic(p, bm.x, bm.y, bm.r, 0.9);
    if (r && r.vn < -40) { p.vx += r.nx * 260; p.vy += r.ny * 260; p.stun = Math.max(p.stun, 0.15); bm.flash = 1; SFX.boing(); burst(bm.x + r.nx * bm.r, bm.y + r.ny * bm.r, '#ff7ad9', 8, 220, 4, 0.4, 'spark'); }
  }
  for (const bw of bowls) hitStatic(p, bw.x, bw.y, bw.r, 0.3);
  const ta = Math.atan2(p.fy, p.fx); let da = ta - p.ha;
  while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
  p.ha += da * Math.min(1, dt * 18);
}
function playersCollide() {
  const a = P[0], b = P[1];
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
  if (d >= min || d < 1e-4) return;
  const nx = dx / d, ny = dy / d, ov = (min - d) / 2;
  a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
  const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (rv <= 0) return;
  const aApp = a.vx * nx + a.vy * ny, bApp = -(b.vx * nx + b.vy * ny);
  const j = 1.7 * rv / 2;
  a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny;
  if (rv > 220 && tackleCD <= 0 && state === 'play') {
    const victim = aApp >= bApp ? b : a, s = victim === b ? 1 : -1;
    const dir = { x: nx * s, y: ny * s };
    victim.vx += dir.x * 280; victim.vy += dir.y * 280; victim.stun = 0.45; victim.hitFlash = 1;
    if (victim.carry) dropBall(victim, dir);
    SFX.thud(); shake = Math.max(shake, 8); tackleCD = 0.3;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    burst(mx, my, '#ffffff', 16, 320, 5, 0.4, 'spark'); burst(mx, my, '#ffe066', 6, 140, 10, 0.7, 'star');
  }
}
function updateHeld(b) {

  b.x = clamp(b.x, A.x1 + b.r, A.x2 - b.r); b.y = clamp(b.y, A.y1 + b.r, A.y2 - b.r);
  b.spin += Math.hypot(p.vx, p.vy) * 0.008;
  for (const bm of BUMPERS) {
    const dx = b.x - bm.x, dy = b.y - bm.y, dd = Math.hypot(dx, dy);
    if (dd < bm.r + b.r) {

      bm.flash = 1; SFX.boing(); burst(b.x, b.y, '#ff7ad9', 10, 240, 4, 0.4, 'spark'); return;
    }

}
function stepBall(b, dt) {
  const f = Math.exp(-(inIce(b.x, b.y) ? 0.3 : 1.05) * dt);

    const r = hitStatic(b, bm.x, bm.y, bm.r, 1.0);
    if (r && r.vn < -10) {
      b.vx += r.nx * 330; b.vy += r.ny * 330;
      const sp = Math.hypot(b.vx, b.vy); if (sp > 1400) { b.vx *= 1400 / sp; b.vy *= 1400 / sp; }
      bm.flash = 1; SFX.boing(); shake = Math.max(shake, 3);
      burst(bm.x + r.nx * bm.r, bm.y + r.ny * bm.r, '#ff7ad9', 10, 260, 4, 0.4, 'spark');
    }
  }
  for (const bw of bowls) {
    if (bw.frozen > 0) { const r = hitStatic(b, bw.x, bw.y, bw.r, 0.7); if (r && r.vn < -100) SFX.click(); }
    else if (Math.hypot(b.x - bw.x, b.y - bw.y) < bw.r - b.r * 0.4) { sink(b, bw); return; }
  }

}
function step(dt) {
  const playing = state === 'play';
  for (const p of P) stepPlayer(p, dt, playing);

  for (const b of balls) if (!b.dead && !b.holder) stepBall(b, dt);

  for (let i = 0; i < balls.length; i++) {
    const a = balls[i]; if (a.dead) continue;
    for (let j = i + 1; j < balls.length; j++) {
      const c = balls[j]; if (c.dead) continue;
      if (a.holder && c.holder) continue;
      if (a.holder) { hitStatic(c, a.x, a.y, a.r, 0.6); continue; }
      if (c.holder) { hitStatic(a, c.x, c.y, c.r, 0.6); continue; }
      const rv = hitDynamic(a, c, 1, 1, 0.9);
      if (rv > 220) SFX.click();
      if (rv > 0 && (a.hot || c.hot)) { if (a.lastTouch >= 0 && c.lastTouch < 0) c.lastTouch = a.lastTouch; }
    }
  }
  // ball-player
  for (const b of balls) {
    if (b.dead || b.holder) continue;
    for (const p of P) {
      const d = Math.hypot(b.x - p.x, b.y - p.y);
      if (d >= p.r + b.r) continue;
      const rv = Math.hypot(b.vx - p.vx, b.vy - p.vy);
      if (playing && !p.carry && p.stun <= 0 && b.ng[p.id] <= 0 && rv < 700) { grab(p, b); break; }
      if (b.hot && b.lastTouch >= 0 && b.lastTouch !== p.id && rv > 600 && p.stun <= 0) {
        p.stun = 0.5; p.hitFlash = 1;
        if (p.carry) dropBall(p, { x: b.vx / rv, y: b.vy / rv });
        SFX.thud(); shake = Math.max(shake, 7); burst(b.x, b.y, '#fff', 12, 300, 4, 0.4, 'spark'); burst(p.x, p.y - 30, '#ffe066', 4, 100, 9, 0.6, 'star');
      }
      hitDynamic(p, b, 6, 1, 0.6);
      b.lastTouch = p.id;
    }
  }
  balls = balls.filter(b => !b.dead);
}

function handleInput(dt) {
  for (let i = 0; i < 2; i++) {
    const held = CTRL[i].act.some(k => keys[k]);
    const pressed = held && !prevAct[i];
    if (state === 'menu') {
      if (pressed && !ready[i]) {
        ready[i] = true; SFX.ready();
        burst(i ? 1050 : 230, 595, TEAM[i].main, 26, 300, 7, 0.8); burst(i ? 1050 : 230, 595, '#ffe066', 8, 200, 10, 0.9, 'star');
      }
    } else if (state === 'play') {
      const p = P[i];
      if (pressed) { p.charging = true; p.charge = 0; }
      if (held && p.charging) p.charge = Math.min(1, p.charge + dt / 0.75);
      if (!held && prevAct[i] && p.charging) { doKick(p); p.charging = false; p.charge = 0; }
    } else if (state === 'win' && stateT > 2.5 && pressed) { startMatch(); return; }
    prevAct[i] = held;
  }
}

function update(dt) {
  time += dt; stateT += dt; targetT += dt;
  handleInput(dt);
  if (state === 'menu') {
    if (ready[0] && ready[1]) { menuGo += dt; if (menuGo > 0.7) startMatch(); }
    if (Math.random() < dt * 6) addP({ x: rand(0, W), y: H + 10, vy: rand(-60, -120), vx: rand(-15, 15), life: rand(4, 7), size: rand(3, 8), color: rgba(pick(Object.values(COL)), 0.5), drag: 0, add: true });
  } else {
    const n = 3; for (let i = 0; i < n; i++) step(dt / n);
    tackleCD -= dt;
    for (const p of P) { p.stun = Math.max(0, p.stun - dt); p.hitFlash = Math.max(0, p.hitFlash - dt * 4); }
    for (const b of balls) { b.ng[0] -= dt; b.ng[1] -= dt; b.stealCD -= dt; }
    for (const bw of bowls) {
      if (bw.frozen > 0) { bw.frozen -= dt; if (bw.frozen <= 0) { bw.frozen = 0; SFX.thaw(); iceBurst(bw.x, bw.y); } }
      bw.flash = Math.max(0, bw.flash - dt * 1.5); bw.shake = Math.max(0, bw.shake - dt); bw.wrong = Math.max(0, bw.wrong - dt * 1.2);
    }
    for (const bm of BUMPERS) bm.flash = Math.max(0, bm.flash - dt * 4);
    for (const pp of PIPES) pp.puff = Math.max(0, pp.puff - dt * 3);
    if (state === 'play') {
      spawnT -= dt;
      const missing = target.needs.some(c => !balls.some(b => b.c === c));
      if (spawnT <= 0 || (missing && spawnT < 0.8 && balls.length < MAX_BALLS)) {
        if (balls.length >= MAX_BALLS && missing) {
          const junk = balls.find(b => !b.holder && !target.needs.includes(b.c));
          if (junk) { burst(junk.x, junk.y, COL[junk.c], 14, 200, 6, 0.5); addP({ type: 'ring', x: junk.x, y: junk.y, size: 10, grow: 30, life: 0.3, color: '#fff' }); removeBall(junk); balls = balls.filter(b => !b.dead); }
        }
        if (balls.length < MAX_BALLS) spawnBall();
        spawnT = rand(1.1, 2.3);
      }
    }
    if (state === 'count') {
      const num = Math.floor(stateT / 0.75);
      if (num !== lastBeep && num < 3) { lastBeep = num; SFX.beep(false); }
      if (stateT >= 2.25) { state = 'play'; stateT = 0; SFX.beep(true); for (const p of P) p.charging = false; }
    }
    if (state === 'win') {
      rocketT -= dt;
      if (rocketT <= 0) { rockets.push({ x: rand(180, 1100), y: H + 10, vx: rand(-60, 60), vy: rand(-950, -720), c: pick(Object.values(COL)), fuse: rand(0.7, 1.1) }); rocketT = rand(0.22, 0.55); }
      for (let i = 0; i < 3; i++) addP({ type: 'confetti', x: rand(0, W), y: -10, vx: rand(-40, 40), vy: rand(80, 200), g: 40, drag: 0.4, life: rand(3, 5), size: rand(8, 14), color: pick(Object.values(COL)), rot: rand(0, TAU), vr: rand(-6, 6) });
    }
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.vy += 500 * dt; r.x += r.vx * dt; r.y += r.vy * dt; r.fuse -= dt;
    addP({ x: r.x, y: r.y, vx: rand(-20, 20), vy: rand(20, 60), life: 0.4, size: 3, color: '#ffe9a8', add: true });
    if (r.fuse <= 0 || r.vy > -60) {
      burst(r.x, r.y, r.c, 70, 420, 5, 1.4, 'dot', { g: 160, drag: 1.4, add: true });
      burst(r.x, r.y, '#ffffff', 24, 300, 3, 0.9, 'spark', { g: 120, drag: 1.5 });
      SFX.boom(); rockets.splice(i, 1);
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt * 1.2);
  scorePop[0] = Math.max(0, scorePop[0] - dt * 1.5); scorePop[1] = Math.max(0, scorePop[1] - dt * 1.5);
}

  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
resetMatch();
requestAnimationFrame(frame);
</script>

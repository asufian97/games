<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumo Bouncy Battle – 2 Player Ice Ring Showdown</title>
<meta name="description" content="Sumo Bouncy Battle: a fast 2-player sumo party game on one keyboard. Push, dash-tackle and bounce your rival off the icy ring into the water. No text needed.">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#1d6f8f 0%,#0d3d5c 55%,#06213a 100%);}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;border-radius:22px;box-shadow:0 20px 70px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.08);cursor:pointer;}
  h1{position:absolute;left:-9999px;top:0;}
</style>
</head>
<body>
<main>
  <h1>Sumo Bouncy Battle</h1>
  <canvas id="game" aria-label="Sumo Bouncy Battle game"></canvas>
</main>
<script>
'use strict';
/* ====================== CONSTANTS ====================== */
const W = 1280, H = 720;
const C = { x: 640, y: 410 };
const R0 = 285, RMIN = 70;
const SHRINK_START = 10, SHRINK_END = 30;
const WIN_SCORE = 5;
const FONT = '"Arial Rounded MT Bold","Segoe UI Black","Trebuchet MS",system-ui,sans-serif';
const PHYS = {
  acc: 480, damp: 1.75,             // heavy + slightly slippery ice
  dashSpeed: 800, dashTime: 0.2, dashCD: 1.25,
  missTime: 1.0, missKeep: 0.5, missDamp: 0.9,
  hitKnock: 660, hitStun: 0.45, stunDamp: 1.15, vulnMult: 1.45,
  bounce: 0.9, pushBase: 360, pushBonus: 760
};
const TEAM = [
  { main: '#72b9ff', dark: '#1d3a78', light: '#e1f0ff', belt: '#2a4fc0', glow: 'rgba(114,185,255,' },
  { main: '#ff9fca', dark: '#c4447d', light: '#ffe6f1', belt: '#e0407f', glow: 'rgba(255,130,190,' }
];
const CTRL = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], dash: ['Space', 'KeyE'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], dash: ['Enter', 'NumpadEnter', 'ShiftRight'] }
];
const GAME_KEYS = new Set(CTRL.flatMap(c => [...c.up, ...c.down, ...c.left, ...c.right, ...c.dash]));
const CONFETTI = ['#ff6fa8', '#72b9ff', '#ffd84d', '#7be08f', '#b48cff', '#ff9a4d'];

/* ====================== UTILS ====================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ====================== CANVAS ====================== */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let scale = 1, waterBg = null;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  scale = s * dpr; buildWater();
}
addEventListener('resize', resize);

/* ====================== INPUT ENGINE ======================
   - "down" = live key state map (any number of simultaneous keys)
   - "pressed" = edge-triggered queue, filled on keydown and only cleared
     after the game consumed it, so even ultra-quick taps between frames
     are never lost. Dash presses are also buffered per player.        */
const Input = {
  down: new Set(), pressed: new Set(),
  isDown(codes) { for (const c of codes) if (this.down.has(c)) return true; return false; },
  wasPressed(codes) { for (const c of codes) if (this.pressed.has(c)) return true; return false; },
  endFrame() { this.pressed.clear(); },
  reset() { this.down.clear(); this.pressed.clear(); }
};
addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code) || e.code === 'Escape') e.preventDefault();
  if (!e.repeat) Input.pressed.add(e.code);
  Input.down.add(e.code);
  audio();
  if (e.code === 'Escape' && state !== 'menu') goMenu();
}, { passive: false });
addEventListener('keyup', e => { Input.down.delete(e.code); });
addEventListener('blur', () => Input.reset());
document.addEventListener('visibilitychange', () => Input.reset());
cv.addEventListener('pointerdown', () => {
  audio();
  if (state === 'menu') startMatch();
  else if (state === 'win' && stateT > 2.5) startMatch();
});

/* ====================== AUDIO ====================== */
let AC = null, MG = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MG = AC.createGain(); MG.gain.value = 0.5;
      const comp = AC.createDynamicsCompressor(); MG.connect(comp); comp.connect(AC.destination);
    } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function osc(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f0, f1, delay = 0, q = 1) {
  const a = audio(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = a.currentTime + delay, s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t); s.stop(t + dur + 0.05);
}
const lastS = {};
function can(n, gap) { const t = performance.now() / 1000; if (lastS[n] && t - lastS[n] < gap) return false; lastS[n] = t; return true; }
const SFX = {
  boing(power = 1) {
    if (!can('boing', 0.08)) return; const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    const base = 90 + Math.random() * 30;
    o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * 4.2, t + 0.07); o.frequency.exponentialRampToValueAtTime(base * 1.6, t + 0.4);
    lfo.frequency.value = 22; lg.gain.value = 50; lfo.connect(lg); lg.connect(o.frequency);
    const v = clamp(0.25 + power * 0.25, 0.2, 0.55);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(MG); o.start(t); lfo.start(t); o.stop(t + 0.47); lfo.stop(t + 0.47);
    osc('sine', 70, 40, 0.18, 0.35 * power);
  },
  whoosh() { noise(0.32, 0.45, 'bandpass', 300, 3200, 0, 1.4); osc('sawtooth', 120, 420, 0.18, 0.06); },
  smash() { if (!can('smash', 0.1)) return; noise(0.3, 0.8, 'lowpass', 1800, 100); osc('sine', 150, 38, 0.35, 0.7); osc('square', 600, 200, 0.08, 0.12); setTimeout(() => SFX.boing(1.2), 40); },
  clash() { noise(0.25, 0.6, 'bandpass', 1200, 300, 0, 3); osc('triangle', 900, 300, 0.2, 0.2); },
  grunt() { if (!can('grunt', 0.35)) return; osc('sawtooth', 110, 90, 0.12, 0.06); noise(0.1, 0.12, 'lowpass', 500, 200); },
  pop() { osc('sine', 900, 140, 0.16, 0.5); noise(0.5, 0.45, 'lowpass', 2400, 200, 0.04); for (let i = 0; i < 6; i++) osc('sine', rand(500, 1200), rand(1300, 2200), 0.07, 0.12, 0.12 + i * 0.06); },
  slip() { osc('sine', 1200, 300, 0.4, 0.1); osc('sine', 1260, 320, 0.4, 0.06); },
  beep(hi) { osc('triangle', hi ? 880 : 520, null, hi ? 0.4 : 0.16, 0.25); if (hi) osc('triangle', 1320, null, 0.4, 0.12); },
  ready() { osc('triangle', 520, 1040, 0.14, 0.22); osc('triangle', 1040, null, 0.18, 0.15, 0.1); },
  point() { [660, 880, 1100].forEach((f, i) => osc('triangle', f, null, 0.18, 0.22, i * 0.08)); },
  crumble() { if (!can('crumble', 0.5)) return; noise(0.25, 0.12, 'highpass', 2500, 900); },
  tune() {
    // silly triumphant tune: bouncy square melody + slide whistle + kazoo-ish bass
    const N = { C5: 523, D5: 587, E5: 659, F5: 698, G5: 784, A5: 880, C6: 1047, G4: 392, C4: 262, F4: 349 };
    const mel = [['G4', 0, .12], ['C5', .14, .12], ['E5', .28, .12], ['G5', .42, .24], ['E5', .7, .12], ['G5', .84, .5],
      ['A5', 1.45, .12], ['G5', 1.6, .12], ['F5', 1.75, .12], ['E5', 1.9, .12], ['D5', 2.05, .12], ['C6', 2.25, .7]];
    mel.forEach(([n, t, d]) => { osc('square', N[n], null, d, 0.09, t); osc('triangle', N[n] * 2, null, d, 0.05, t); });
    [['C4', 0], ['G4', .42], ['C4', .84], ['F4', 1.45], ['G4', 1.9], ['C4', 2.25]].forEach(([n, t]) => osc('sawtooth', N[n] / 2, null, 0.3, 0.08, t));
    osc('sine', 500, 1800, 0.45, 0.15, 1.05); // slide whistle up
    osc('sine', 1800, 400, 0.3, 0.1, 3.0);    // and down
    [0, .42, .84, 1.45, 2.25].forEach(t => noise(0.12, 0.25, 'lowpass', 400, 80, t));
  }
};

/* ====================== STATE ====================== */
let state = 'menu', stateT = 0, time = 0, roundT = 0, arenaR = R0;
let P = [], parts = [], ripples = [];
let shake = 0, hitStop = 0, slowmo = 0, flash = 0, flashCol = '#fff';
let scores = [0, 0], roundWinner = -1, winner = -1, lastBeep = -1;
let ready = [false, false], menuGo = 0;
const bulbPop = [0, 0];

function makePlayer(i) {
  const s = i ? 1 : -1;
  return {
    id: i, x: C.x + s * 130, y: C.y, vx: 0, vy: 0, r: 36, m: 1,
    fx: -s, fy: 0, ix: 0, iy: 0,
    st: 'normal', t: 0, dashCD: 0.4, dashDir: { x: -s, y: 0 }, buf: 0,
    sq: 0, sqv: 0, pushPow: 0, hitFlash: 0, fallT: 0, dead: false, armPush: 0
  };
}
function resetRound() {
  P = [makePlayer(0), makePlayer(1)];
  roundT = 0; arenaR = R0; roundWinner = -1; ripples = [];
  state = 'count'; stateT = 0; lastBeep = -1;
}
function startMatch() { scores = [0, 0]; winner = -1; parts = []; ready = [false, false]; menuGo = 0; Input.pressed.clear(); resetRound(); }
function goMenu() { state = 'menu'; stateT = 0; ready = [false, false]; menuGo = 0; parts = []; }

/* ====================== PARTICLES ====================== */
function addP(o) {
  if (parts.length > 1200) parts.shift();
  const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 1, size: 4, color: '#fff', g: 0, drag: 2, type: 'dot', rot: 0, vr: 0, grow: 0 }, o);
  p.max = p.life; parts.push(p);
}
function burst(x, y, color, n, sp, size, life, type = 'dot', extra = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(sp * 0.25, sp);
    addP(Object.assign({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.6, life), size: rand(size * 0.5, size), color: typeof color === 'function' ? color() : color, type, rot: rand(0, TAU), vr: rand(-8, 8) }, extra));
  }
}
function bubbles(x, y, n) {
  for (let i = 0; i < n; i++) addP({ type: 'bubble', x: x + rand(-30, 30), y: y + rand(-20, 20), vx: rand(-90, 90), vy: rand(-260, -60), g: 120, drag: 1.5, life: rand(0.7, 1.6), size: rand(4, 13), color: '#e8fbff' });
}

/* ====================== GAME LOGIC ====================== */
function readInput(p) {
  const c = CTRL[p.id]; let x = 0, y = 0;
  if (Input.isDown(c.up)) y--; if (Input.isDown(c.down)) y++;
  if (Input.isDown(c.left)) x--; if (Input.isDown(c.right)) x++;
  const l = Math.hypot(x, y); if (l) { x /= l; y /= l; }
  return { x, y };
}
function startDash(p) {
  p.st = 'dash'; p.t = PHYS.dashTime; p.dashCD = PHYS.dashCD; p.buf = 0;
  p.dashDir = { x: p.fx, y: p.fy };
  p.vx = p.fx * PHYS.dashSpeed + p.vx * 0.15; p.vy = p.fy * PHYS.dashSpeed + p.vy * 0.15;
  p.sqv -= 6; // stretch
  SFX.whoosh();
  for (let i = 0; i < 10; i++) addP({ type: 'line', x: p.x - p.fx * 30 + rand(-20, 20) * p.fy, y: p.y - p.fy * 30 + rand(-20, 20) * p.fx, vx: -p.fx * rand(100, 250), vy: -p.fy * rand(100, 250), life: 0.3, size: rand(14, 28), color: '#ffffff', drag: 3 });
}
function dashHit(att, vic, nx, ny) {
  const mult = vic.st === 'miss' ? PHYS.vulnMult : 1;
  vic.vx = nx * PHYS.hitKnock * mult + vic.vx * 0.2; vic.vy = ny * PHYS.hitKnock * mult + vic.vy * 0.2;
  vic.st = 'stun'; vic.t = PHYS.hitStun; vic.hitFlash = 1; vic.sqv += 9;
  att.st = 'normal'; att.t = 0; att.vx = att.vx * 0.12 - nx * 60; att.vy = att.vy * 0.12 - ny * 60; att.sqv += 5;
  hitStop = 0.09; shake = Math.max(shake, 16); flash = 0.25; flashCol = TEAM[att.id].main;
  const mx = (att.x + vic.x) / 2, my = (att.y + vic.y) / 2;
  burst(mx, my, '#ffffff', 22, 520, 6, 0.5, 'spark');
  burst(mx, my, '#ffe066', 10, 260, 14, 0.8, 'star');
  addP({ type: 'ring', x: mx, y: my, size: 20, grow: 120, life: 0.4, color: '#ffffff' });
  addP({ type: 'impact', x: mx, y: my, size: 60, life: 0.25, color: '#fff7a8' });
  SFX.smash();
}
function stepPlayer(p, dt, playing) {
  if (p.dead) return;
  if (p.st === 'fall') {
    p.fallT += dt; const f = Math.exp(-3 * dt); p.vx *= f; p.vy *= f; p.x += p.vx * dt; p.y += p.vy * dt;
    if (Math.random() < dt * 25) bubbles(p.x, p.y, 1);
    if (p.fallT > 1.2) p.dead = true;
    return;
  }
  const inp = playing ? readInput(p) : { x: 0, y: 0 };
  p.ix = inp.x; p.iy = inp.y;
  if (inp.x || inp.y) { if (p.st === 'normal') { p.fx = inp.x; p.fy = inp.y; } }
  let ctrl = 1, damp = PHYS.damp;
  if (p.st === 'dash') { ctrl = 0; damp = 0; p.t -= dt; if (p.t <= 0) { p.st = 'miss'; p.t = PHYS.missTime; p.vx *= PHYS.missKeep; p.vy *= PHYS.missKeep; SFX.slip(); } }
  else if (p.st === 'miss') { ctrl = 0; damp = PHYS.missDamp; p.t -= dt; if (p.t <= 0) p.st = 'normal'; }
  else if (p.st === 'stun') { ctrl = 0.2; damp = PHYS.stunDamp; p.t -= dt; if (p.t <= 0) p.st = 'normal'; }
  if (ctrl === 0 || p.st === 'stun') { p.ix *= ctrl; p.iy *= ctrl; }
  p.vx += inp.x * PHYS.acc * ctrl * dt; p.vy += inp.y * PHYS.acc * ctrl * dt;
  const f = Math.exp(-damp * dt); p.vx *= f; p.vy *= f;
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.dashCD = Math.max(0, p.dashCD - dt);
  // ring-out check
  if (Math.hypot(p.x - C.x, p.y - C.y) > arenaR) {
    p.st = 'fall'; p.fallT = 0;
    shake = Math.max(shake, 10);
    SFX.pop(); bubbles(p.x, p.y, 40);
    burst(p.x, p.y, '#bff4ff', 26, 380, 7, 0.9, 'dot', { g: 500, drag: 1 });
    for (let k = 0; k < 3; k++) ripples.push({ x: p.x, y: p.y, t: -k * 0.15 });
    return 'fell';
  }
}
function playersInteract(dt) {
  const a = P[0], b = P[1];
  if (a.st === 'fall' || b.st === 'fall' || a.dead || b.dead) return;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001, nx = dx / d, ny = dy / d;
  const min = a.r + b.r;
  // dash connection (slightly generous radius)
  if (d < min + 8) {
    const ad = a.st === 'dash', bd = b.st === 'dash';
    if (ad && bd) {
      a.vx = -nx * 520; a.vy = -ny * 520; b.vx = nx * 520; b.vy = ny * 520;
      a.st = b.st = 'stun'; a.t = b.t = 0.3; a.sqv += 7; b.sqv += 7;
      hitStop = 0.07; shake = Math.max(shake, 12); SFX.clash();
      burst((a.x + b.x) / 2, (a.y + b.y) / 2, '#fff', 24, 450, 6, 0.4, 'spark');
      addP({ type: 'ring', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, size: 15, grow: 100, life: 0.35, color: '#ffe066' });
      return;
    }
    if (ad) { dashHit(a, b, nx, ny); return; }
    if (bd) { dashHit(b, a, -nx, -ny); return; }
  }
  if (d >= min + 3) { a.pushPow = Math.max(0, a.pushPow - dt * 2); b.pushPow = Math.max(0, b.pushPow - dt * 2); a.armPush = Math.max(0, a.armPush - dt * 4); b.armPush = Math.max(0, b.armPush - dt * 4); return; }
  // positional separation
  if (d < min) {
    const ov = (min - d) / 2; a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
    // momentum-based elastic bounce
    const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (rv > 0) {
      const j = (1 + PHYS.bounce) * rv / (1 / a.m + 1 / b.m);
      a.vx -= j / a.m * nx; a.vy -= j / a.m * ny; b.vx += j / b.m * nx; b.vy += j / b.m * ny;
      if (rv > 110) {
        const pw = clamp(rv / 400, 0.3, 1.4);
        SFX.boing(pw); a.sqv += rv / 60; b.sqv += rv / 60; shake = Math.max(shake, rv / 60);
        burst((a.x + b.x) / 2, (a.y + b.y) / 2, '#ffffff', 8 + rv / 40, 200 + rv * 0.5, 4, 0.4, 'spark');
        addP({ type: 'ring', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, size: 10, grow: 50 + rv / 6, life: 0.3, color: 'rgba(255,255,255,0.9)' });
      }
    }
  }
  // tug-of-war: compare how hard each player is pushing into the other
  const pa = Math.max(0, a.ix * nx + a.iy * ny), pb = Math.max(0, -(b.ix * nx + b.iy * ny));
  a.armPush = Math.min(1, a.armPush + (pa > 0.3 ? dt * 6 : -dt * 4)); b.armPush = Math.min(1, b.armPush + (pb > 0.3 ? dt * 6 : -dt * 4));
  a.armPush = Math.max(0, a.armPush); b.armPush = Math.max(0, b.armPush);
  const diff = pa - pb;
  if (diff > 0.15) { a.pushPow = Math.min(1, a.pushPow + dt * 0.8); b.pushPow = Math.max(0, b.pushPow - dt * 2); }
  else if (diff < -0.15) { b.pushPow = Math.min(1, b.pushPow + dt * 0.8); a.pushPow = Math.max(0, a.pushPow - dt * 2); }
  else { a.pushPow = Math.max(0, a.pushPow - dt); b.pushPow = Math.max(0, b.pushPow - dt); }
  const win = diff > 0 ? a : b, lose = diff > 0 ? b : a, s = diff > 0 ? 1 : -1;
  const force = Math.abs(diff) * (PHYS.pushBase + PHYS.pushBonus * win.pushPow);
  if (Math.abs(diff) > 0.05) {
    lose.vx += nx * s * force * dt; lose.vy += ny * s * force * dt;
    win.vx += nx * s * force * dt * 0.55; win.vy += ny * s * force * dt * 0.55;
  }
  if ((pa > 0.3 || pb > 0.3) && Math.random() < dt * 30) {
    const cx = a.x + nx * a.r, cy = a.y + ny * a.r;
    const col = Math.abs(diff) < 0.15 ? '#ffffff' : TEAM[win.id].main;
    addP({ type: 'spark', x: cx, y: cy, vx: -ny * rand(-200, 200) + rand(-40, 40), vy: nx * rand(-200, 200) + rand(-40, 40), life: 0.3, size: 3, color: col });
    if (pa > 0.3 && pb > 0.3) SFX.grunt();
  }
}
function step(dt) {
  const playing = state === 'play';
  const fell = [];
  for (const p of P) {

function update(dt) {

      if (u < 0.42) { ctx.fillStyle = '#fff7a8'; starPath(ax + 5, ay, 40, 14, 8, time * 3); ctx.fill(); }
      if (f >= 1) { const w = (u - 0.7) / 0.3; pAlpha = Math.max(0, 1 - w * 3); ctx.strokeStyle = `rgba(255,255,255,${1 - w})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(ax + AR + 30, ay + 15, 20 + w * 50, 8 + w * 22, 0, 0, TAU); ctx.stroke();
        for (let k = 0; k < 6; k++) { ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; circle(ax + AR + 30 + Math.sin(k * 2.3) * 22, ay - w * 80 - k * 8, 4 + k % 3 * 2); ctx.stroke(); } }
    }
  } else { // dash miss -> dizzy slide
    by = ay;
    if (u < 0.25) { bx = ax - 90; pxp = ax + 30; pyp = ay; }
    else if (u < 0.4) { const f = (u - 0.25) / 0.15; bx = lerp(ax - 90, ax + 10, f); bFace = 'dash'; pxp = ax + 30; pyp = lerp(ay, ay - 85, f); }
    else { const f = clamp((u - 0.4) / 0.45, 0, 1); bx = lerp(ax + 10, ax + AR - 30, 1 - Math.pow(1 - f, 2)); pxp = ax + 30; pyp = ay - 85; bFace = 'dizzy'; pFace = 'happy'; bRot = Math.sin(time * 22) * 0.3;
      const on = Math.floor(time * 12) % 2; ctx.strokeStyle = on ? '#ff4d6d' : '#fff'; ctx.lineWidth = 4; ctx.setLineDash([8, 6]); circle(bx, by, 40); ctx.stroke(); ctx.setLineDash([]);
      for (let k = 0; k < 3; k++) { const a = time * 8 + k * TAU / 3; ctx.fillStyle = '#9ee3ff'; starPath(bx + Math.cos(a) * 22, by - 44 + Math.sin(a) * 6, 6, 2.5); ctx.fill(); } }
  }
  ctx.save(); ctx.globalAlpha = bAlpha; drawSumo(0, bx, by, 30, { fx: 1, fy: 0.2, face: bFace, sq: bSq, rot: bRot, push: bFace === 'dash' ? 1 : 0 }); ctx.restore();
  ctx.save(); ctx.globalAlpha = pAlpha; drawSumo(1, pxp, pyp, 30, { fx: -1, fy: 0.2, face: pFace, sq: pSq }); ctx.restore();
  // phase dots
  for (let k = 0; k < 3; k++) { ctx.fillStyle = k === ph ? '#5a5480' : 'rgba(90,84,128,0.25)'; circle(CX0 - 20 + k * 20, 556, 6); ctx.fill(); }
  // goal: 5 bulbs -> trophy
  for (let k = 0; k < 5; k++) drawBulb(CX0 - 170 + k * 44, 618, 0.9, Math.floor(time * 2.5) % 6 > k, '#ff9fca');
  ctx.fillStyle = '#5a5480'; ctx.beginPath(); ctx.moveTo(CX0 + 60, 606); ctx.lineTo(CX0 + 84, 618); ctx.lineTo(CX0 + 60, 630); ctx.closePath(); ctx.fill();
  drawTrophy(CX0 + 140, 624 + Math.sin(time * 3) * 3, 0.6);
}
function drawMenu() {
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(0, 0, W, H);
  drawParticles();
  drawTitle();
  drawPlayerPanel(230, 0); drawPlayerPanel(1050, 1);
  drawCenterDemo();
  if (ready[0] && ready[1]) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, menuGo * 1.3)})`; ctx.fillRect(0, 0, W, H); }
}
function drawCountdown() {
  if (state === 'count') {
    const num = 3 - Math.floor(stateT / 0.6), u = (stateT % 0.6) / 0.6;
    const s = 0.4 + easeOutBack(Math.min(1, u * 2.5)) * 0.8;
    ctx.save(); ctx.translate(C.x, C.y); ctx.scale(s, s); ctx.globalAlpha = 1 - Math.max(0, u - 0.7) * 3;
    ctx.fillStyle = ['#7be08f', '#ffd84d', '#ff6fa8'][num - 1] || '#fff'; circle(0, 0, 70); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.stroke();
    ctx.font = `900 96px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(num, 0, 6);
    ctx.restore(); ctx.globalAlpha = 1;
  } else if (state === 'play' && stateT < 0.7) {
    const u = stateT / 0.7, s = 0.5 + easeOutBack(Math.min(1, u * 2)) * 0.8;
    ctx.save(); ctx.translate(C.x, C.y); ctx.scale(s, s); ctx.globalAlpha = 1 - Math.max(0, u - 0.5) * 2;
    ctx.fillStyle = '#fff7a8'; starPath(0, 0, 110, 55, 10, time); ctx.fill();
    ctx.fillStyle = TEAM[0].main; circle(-36, 0, 36); ctx.fill(); ctx.fillStyle = TEAM[1].main; circle(36, 0, 36); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; circle(-36, 0, 36); ctx.stroke(); circle(36, 0, 36); ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
  }
}
function drawRoundEnd() {
  if (stateT < 0.6) return;
  const u = Math.min(1, (stateT - 0.6) / 0.4), s = easeOutBack(u);
  ctx.save(); ctx.translate(C.x, C.y - 20); ctx.scale(s, s);
  if (roundWinner >= 0) {
    ctx.save(); ctx.rotate(time); ctx.fillStyle = TEAM[roundWinner].glow + '0.35)'; for (let k = 0; k < 10; k++) { ctx.rotate(TAU / 10); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-25, -160); ctx.lineTo(25, -160); ctx.closePath(); ctx.fill(); } ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; circle(0, 0, 80); ctx.fill(); ctx.strokeStyle = TEAM[roundWinner].main; ctx.lineWidth = 8; ctx.stroke();
    drawSumo(roundWinner, 0, 6 - Math.abs(Math.sin(time * 8)) * 8, 46, { face: 'happy', fy: 0.3, sq: Math.sin(time * 16) * 0.06 });
    drawBulb(62, -58, 1.1, true, TEAM[roundWinner].main);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; circle(0, 0, 80); ctx.fill(); ctx.strokeStyle = '#9a93c4'; ctx.lineWidth = 8; ctx.stroke();
    drawSumo(0, -26, 4, 30, { face: 'panic', fx: 0.5 }); drawSumo(1, 26, 4, 30, { face: 'panic', fx: -0.5 });
  }
  ctx.restore();
}
function drawWin() {
  const winId = (winner === 0 || winner === 1) ? winner : (scores[0] >= scores[1] ? 0 : 1);
  const t = TEAM[winId];
  ctx.fillStyle = `rgba(255,255,255,${Math.min(0.55, stateT * 0.8)})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(C.x, 380); ctx.rotate(time * 0.4);
  for (let k = 0; k < 16; k++) { ctx.rotate(TAU / 16); ctx.fillStyle = k % 2 ? t.glow + '0.3)' : 'rgba(255,220,80,0.25)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-70, -800); ctx.lineTo(70, -800); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  const enter = easeOutBack(Math.min(1, stateT * 1.4)), b = Math.abs(Math.sin(time * 5));
  ctx.save(); ctx.translate(C.x, 400); ctx.scale(enter, enter);
  ctx.fillStyle = 'rgba(30,70,110,0.25)'; ctx.beginPath(); ctx.ellipse(0, 105, 100 - b * 25, 20, 0, 0, TAU); ctx.fill();
  drawSumo(winId, 0, -b * 40, 100, { face: 'happy', fy: 0.3, fx: Math.sin(time * 3) * 0.5, sq: (1 - b) * 0.12 - 0.04, push: 0.5 + 0.5 * Math.sin(time * 10), rot: Math.sin(time * 5) * 0.08 });
  drawCrown(0, -b * 40 - 140, 1.7);
  drawTrophy(-220, 40 + Math.sin(time * 3) * 8, 1.2); drawTrophy(220, 40 + Math.sin(time * 3 + 1) * 8, 1.2);
  ctx.restore();
  // loser bobbing in the water
  const l = 1 - winId, lx = winId === 0 ? 1130 : 150, ly = 600 + Math.sin(time * 2) * 6;
  ctx.save(); ctx.beginPath(); ctx.rect(lx - 80, 0, 160, ly + 6); ctx.clip();
  drawSumo(l, lx, ly + 12, 40, { face: 'dizzy', fy: 0.3, rot: Math.sin(time * 2) * 0.2 }); ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(lx, ly + 8, 60 + Math.sin(time * 3) * 4, 12, 0, 0, TAU); ctx.stroke();
  if (Math.random() < 0.1) bubbles(lx, ly, 1);
  for (let k = 0; k < WIN_SCORE; k++) drawBulb(C.x - 140 + k * 70, 600, 1.4, true, t.main);
  drawParticles();
  if (stateT > 2.5) {
    const tap = Math.floor(time * 2.5) % 2 === 0, a = Math.min(1, (stateT - 2.5) * 2);
    ctx.globalAlpha = a;
    rr(ctx, C.x - 170, 640, 340, 66, 33); ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill(); ctx.strokeStyle = t.main; ctx.lineWidth = 4; ctx.stroke();
    drawKey(C.x - 100, 670, 90, 36, '', tap, TEAM[0].main);
    drawKey(C.x + 100, 670, 56, 36, '⏎', !tap, TEAM[1].main);
    ctx.save(); ctx.translate(C.x, 672); ctx.rotate(time * 3);
    ctx.strokeStyle = '#3fd27a'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, 18, 0.3, TAU - 0.6); ctx.stroke();
    ctx.fillStyle = '#3fd27a'; ctx.beginPath(); ctx.moveTo(20, -13); ctx.lineTo(28, 5); ctx.lineTo(8, 0); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

/* ====================== RENDER LOOP ====================== */
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawWater();
  if (state !== 'menu') {
    drawArena();
    const order = [...P].sort((a, b) => a.y - b.y);
    for (const p of order) if (!(state === 'win' && p.id !== winner)) drawPlayer(p);
    if (state !== 'win') drawParticles();
  }
  ctx.restore();
  if (state !== 'menu') drawHUD();
  if (flash > 0) { ctx.fillStyle = rgba(flashCol, flash * 0.4); ctx.fillRect(0, 0, W, H); }
  if (state === 'menu') drawMenu();
  if (state === 'count' || state === 'play') drawCountdown();
  if (state === 'roundEnd') drawRoundEnd();
  if (state === 'win') drawWin();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
P = [makePlayer(0), makePlayer(1)];
requestAnimationFrame(frame);
</script>

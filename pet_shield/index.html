<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pet Shield: Bee Defense – 2 Player Arcade</title>
<meta name="description" content="Pet Shield: Bee Defense: a hilarious 2-player physics arcade game. Defend your cute puppy from angry bouncing bees using wooden shields on one shared keyboard!">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#8ae3ff 0%,#46b5ea 55%,#1d7aa8 100%);}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;border-radius:22px;box-shadow:0 18px 60px rgba(10,50,80,.35),0 0 0 3px rgba(255,255,255,.2);cursor:pointer;}
  h1{position:absolute;left:-9999px;top:0;}
</style>
</head>
<body>
<main>
  <h1>Pet Shield: Bee Defense</h1>
  <canvas id="game" aria-label="Pet Shield: Bee Defense game"></canvas>
</main>
<script>
'use strict';
/* ===================== CONSTANTS ===================== */
const W = 1280, H = 720;
const FONT = '"Arial Rounded MT Bold","Segoe UI Black","Trebuchet MS",system-ui,sans-serif';
const WIN_ROUNDS = 3;
const MAX_STINGS = 3;

// Puppies
const PUPPIES = [
  { x: 120, y: 470, r: 42, col: '#50a5ff', dark: '#1b5bb5', light: '#dcf0ff', collar: '#ff4d6d' },
  { x: 1160, y: 470, r: 42, col: '#ff7eb3', dark: '#b52b63', light: '#ffe6f1', collar: '#50a5ff' }
];

// Shields bounds
const BOUNDS = [
  { minX: 175, maxX: 615, minY: 110, maxY: 650 },
  { minX: 665, maxX: 1105, minY: 110, maxY: 650 }
];

// Controls
const CTRL = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], act: ['Space'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], act: ['Enter', 'NumpadEnter', 'ShiftRight', 'ShiftLeft'] }
];
const GAME_KEYS = new Set(CTRL.flatMap(c => [...c.up, ...c.down, ...c.left, ...c.right, ...c.act]));

/* ===================== UTILS ===================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ===================== CANVAS ===================== */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  scale = s * dpr;
}
addEventListener('resize', resize);

/* ===================== INPUT ENGINE ===================== */
const Input = {
  down: new Set(), pressed: new Set(),
  isDown(codes) { for (const c of codes) if (this.down.has(c)) return true; return false; },
  wasPressed(codes) { for (const c of codes) if (this.pressed.has(c)) return true; return false; },
  endFrame() { this.pressed.clear(); },
  reset() { this.down.clear(); this.pressed.clear(); }
};

function getCanvasPos(e) {
  const rect = cv.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height)
  };
}

addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code) || e.code === 'Escape' || e.code === 'Tab' || e.code === 'KeyM' || e.code === 'Digit1' || e.code === 'Digit2') {
    if (e.code === 'Tab') e.preventDefault();
  }
  if (!e.repeat) Input.pressed.add(e.code);
  Input.down.add(e.code);
  audio();
  if (e.code === 'Escape' && state !== 'menu') goMenu();
  if (e.code === 'Tab' || e.code === 'KeyM' || e.code === 'Digit1' || e.code === 'Digit2') {
    if (e.code === 'Digit1') setDifficulty('normal');
    else if (e.code === 'Digit2') setDifficulty('hard');
    else toggleDifficulty();
  }
}, { passive: false });
addEventListener('keyup', e => { Input.down.delete(e.code); });
addEventListener('blur', () => Input.reset());
document.addEventListener('visibilitychange', () => Input.reset());

cv.addEventListener('pointerdown', e => {
  audio();
  const p = getCanvasPos(e);
  if (state === 'menu') {
    // Check click on Difficulty Toggle (x: 470..810, y: 76..116)
    if (p.y >= 74 && p.y <= 118) {
      if (p.x >= 470 && p.x <= 636) {
        setDifficulty('normal');
        return;
      }
      if (p.x >= 644 && p.x <= 810) {
        setDifficulty('hard');
        return;
      }
    }
    // Check click on P1 Card
    if (p.x < 420) {
      ready[0] = !ready[0];
      if (ready[0]) {
        SFX.ready();
        burst(230, 615, PUPPIES[0].col, 20, 260, 6, 0.6);
      }
      return;
    }
    // Check click on P2 Card
    if (p.x > 860) {
      ready[1] = !ready[1];
      if (ready[1]) {
        SFX.ready();
        burst(1050, 615, PUPPIES[1].col, 20, 260, 6, 0.6);
      }
      return;
    }
    // Center Card or anywhere else -> Start Match!
    startMatch();
  } else if (state === 'win' && stateT > 2.0) {
    if (p.y >= 540 && p.y <= 600 && Math.abs(p.x - W / 2) < 180) {
      toggleDifficulty();
      return;
    }
    startMatch();
  } else if (state === 'play' || state === 'count') {
    // If clicking HUD difficulty badge, toggle difficulty
    if (p.y <= 65 && Math.abs(p.x - W / 2) < 95) {
      toggleDifficulty();
    }
  }
});

cv.addEventListener('pointermove', e => {
  const p = getCanvasPos(e);
  let clickable = false;
  if (state === 'menu') {
    if (p.y >= 74 && p.y <= 118 && Math.abs(p.x - W / 2) <= 175) clickable = true;
    else if (p.y >= 120 && p.y <= 680) clickable = true;
  } else if (state === 'win' && stateT > 2.0) {
    clickable = true;
  } else if (state === 'play' || state === 'count') {
    if (p.y <= 65 && Math.abs(p.x - W / 2) < 95) clickable = true;
  }
  cv.style.cursor = clickable ? 'pointer' : 'default';
});

/* ===================== AUDIO ===================== */
let AC = null, MG = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MG = AC.createGain(); MG.gain.value = 0.5;
      const comp = AC.createDynamicsCompressor(); MG.connect(comp); comp.connect(AC.destination);
    } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function osc(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f0, f1, delay = 0) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = ftype;
  const t = a.currentTime + delay;
  f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t); s.stop(t + dur + 0.05);
}
const lastS = {};
function can(n, gap) { const t = performance.now() / 1000; if (lastS[n] && t - lastS[n] < gap) return false; lastS[n] = t; return true; }

const SFX = {
  thwack(power = false) {
    if (!can('thwack', 0.05)) return;
    if (power) {
      osc('triangle', 520, 60, 0.14, 0.5);
      noise(0.12, 0.55, 'lowpass', 2200, 240);
    } else {
      osc('triangle', 380, 90, 0.09, 0.35);
      noise(0.08, 0.4, 'lowpass', 1400, 300);
    }
  },
  swing() {
    noise(0.18, 0.25, 'bandpass', 600, 2400);
  },
  squeak() {
    osc('sine', 850, 1900, 0.16, 0.4);
    osc('triangle', 1200, 2400, 0.14, 0.25, 0.05);
  },
  bark() {
    osc('triangle', 320, 160, 0.12, 0.35);
    osc('sawtooth', 420, 180, 0.1, 0.2);
    noise(0.08, 0.2, 'lowpass', 900, 200);
  },
  buzz(isHornet = false) {
    if (!can('buzz', 0.15)) return;
    if (isHornet) {
      osc('sawtooth', 230, 290, 0.2, 0.14);
      osc('triangle', 460, 580, 0.18, 0.06);
    } else {
      osc('sawtooth', 140, 160, 0.18, 0.08);
    }
  },
  mode() {
    osc('sine', 660, 880, 0.12, 0.25);
    osc('triangle', 880, 1320, 0.15, 0.2, 0.06);
  },
  chime() {
    [523, 659, 784, 1047].forEach((f, i) => {
      osc('sine', f, null, 0.3, 0.2, i * 0.08);
      osc('triangle', f * 2, null, 0.2, 0.08, i * 0.08);
    });
  },
  ready() {
    osc('triangle', 580, 1160, 0.12, 0.22);
    osc('sine', 1160, null, 0.18, 0.15, 0.08);
  },
  beep(hi) {
    osc('triangle', hi ? 980 : 490, null, hi ? 0.35 : 0.15, 0.25);
  },
  fanfare() {
    const notes = [
      [392, 0, 0.15], [523, 0.15, 0.15], [659, 0.3, 0.15],
      [784, 0.45, 0.35], [659, 0.85, 0.15], [784, 1.0, 0.8]
    ];
    notes.forEach(([f, t, d]) => {
      osc('sawtooth', f, null, d, 0.12, t);
      osc('triangle', f * 2, null, d, 0.08, t);
    });
  }
};

/* ===================== STATE ===================== */
let state = 'menu', stateT = 0, time = 0;
let difficulty = 'normal'; // 'normal' | 'hard'
let scores = [0, 0], stings = [0, 0];
let winner = -1, roundWinner = -1, lastBeep = -1;
let ready = [false, false], menuGo = 0;
let shake = 0, flash = 0, flashCol = '#fff';

let shields = [], bees = [], parts = [];
let hive = { x: 640, y: 190, r: 48, shake: 0, spawnTimer: 1.2 };
const scorePop = [0, 0];

function setDifficulty(newDiff) {
  if (difficulty === newDiff) return;
  difficulty = newDiff;
  SFX.mode();
  if (difficulty === 'hard') {
    shake = 4;
    burst(W / 2 + 85, 96, '#ff3b30', 24, 260, 6, 0.5, 'spark');
    burst(W / 2 + 85, 96, '#ff9500', 14, 200, 7, 0.4, 'star');
  } else {
    burst(W / 2 - 85, 96, '#ffd54f', 24, 240, 6, 0.5, 'star');
    burst(W / 2 - 85, 96, '#ffffff', 12, 180, 5, 0.4, 'dot');
  }
}

function toggleDifficulty() {
  setDifficulty(difficulty === 'normal' ? 'hard' : 'normal');
}

function makeShield(id) {
  const isLeft = id === 0;
  const isHard = difficulty === 'hard';
  return {
    id,
    x: isLeft ? 340 : 940,
    y: 440,
    vx: 0, vy: 0,
    w: 26, h: 84, r: 24,
    fx: isLeft ? 1 : -1, fy: 0,
    swing: 0, swingV: 0, swinging: false,
    speed: isHard ? 510 : 460
  };
}

function spawnBee() {
  const isHard = difficulty === 'hard';
  const isHornet = isHard && Math.random() < 0.38;
  const dir = Math.random() < 0.5 ? -1 : 1;
  const a = dir < 0 ? rand(Math.PI * 0.7, Math.PI * 1.3) : rand(-Math.PI * 0.3, Math.PI * 0.3);
  const sp = isHornet ? rand(270, 370) : (isHard ? rand(220, 310) : rand(180, 280));
  bees.push({
    x: hive.x, y: hive.y + 20,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    r: isHornet ? 17 : 16,
    ang: a,
    wingT: rand(0, TAU),
    born: time,
    dead: false,
    type: isHornet ? 'hornet' : 'normal',
    trailTimer: 0
  });
  hive.shake = isHornet ? 0.6 : 0.4;
  SFX.buzz(isHornet);
  const pCol = isHornet ? '#ff3b30' : '#ffd54f';
  for (let i = 0; i < (isHornet ? 10 : 6); i++) {
    addP({
      x: hive.x, y: hive.y + 20,
      vx: rand(-50, 50), vy: rand(-30, 60),
      life: 0.45, size: rand(5, 9),
      color: pCol
    });
  }
}

function resetRound() {
  const isHard = difficulty === 'hard';
  shields = [makeShield(0), makeShield(1)];
  bees = [];
  parts = [];
  stings = [0, 0];
  roundWinner = -1;
  hive.spawnTimer = isHard ? 0.6 : 1.0;
  state = 'count'; stateT = 0; lastBeep = -1;
}

function startMatch() {
  scores = [0, 0]; winner = -1;
  ready = [false, false]; menuGo = 0;
  Input.pressed.clear();
  resetRound();
}

function goMenu() {
  state = 'menu'; stateT = 0; ready = [false, false]; menuGo = 0; parts = [];
}

/* ===================== PARTICLES ===================== */
function addP(o) {
  if (parts.length > 800) parts.shift();
  const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 1, size: 4, color: '#fff', g: 0, drag: 2, type: 'dot', rot: 0, vr: 0, grow: 0 }, o);
  p.max = p.life; parts.push(p);
}
function burst(x, y, color, n, sp, size, life, type = 'dot', extra = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(sp * 0.25, sp);
    addP(Object.assign({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), size: rand(size * 0.5, size), color: typeof color === 'function' ? color() : color, type, rot: rand(0, TAU), vr: rand(-8, 8) }, extra));
  }
}

/* ===================== GAME LOGIC ===================== */
function updateShield(s, dt, playing) {
  const c = CTRL[s.id];
  let ix = 0, iy = 0;
  if (playing) {
    if (Input.isDown(c.up)) iy--;
    if (Input.isDown(c.down)) iy++;
    if (Input.isDown(c.left)) ix--;
    if (Input.isDown(c.right)) ix++;
  }
  const l = Math.hypot(ix, iy);
  if (l > 0) {
    ix /= l; iy /= l;
    s.fx = ix; s.fy = iy;
  }

  const k = 14;
  s.vx += (ix * s.speed - s.vx) * Math.min(1, k * dt);
  s.vy += (iy * s.speed - s.vy) * Math.min(1, k * dt);
  s.x += s.vx * dt;
  s.y += s.vy * dt;

  // Boundary clamping (stays on respective side of arena)
  const b = BOUNDS[s.id];
  s.x = clamp(s.x, b.minX, b.maxX);
  s.y = clamp(s.y, b.minY, b.maxY);

  // Swing mechanics
  if (playing && Input.wasPressed(c.act) && !s.swinging) {
    s.swinging = true;
    s.swing = 1;
    SFX.swing();
    const swingDirX = s.id === 0 ? 1 : -1;
    for (let i = 0; i < 8; i++) {
      addP({
        type: 'arc', x: s.x + swingDirX * 30, y: s.y + rand(-35, 35),
        vx: swingDirX * rand(120, 280), vy: rand(-60, 60),
        life: 0.25, size: rand(6, 12), color: '#ffffff'
      });
    }
  }

  if (s.swinging) {
    s.swing -= dt * 4.2;
    if (s.swing <= 0) {
      s.swing = 0;
      s.swinging = false;
    }
  }
}

function updateBee(b, dt) {
  const isHornet = b.type === 'hornet';
  const isHard = difficulty === 'hard';

  b.wingT += dt * (isHornet ? 52 : 38);

  // Steer toward the nearest puppy
  const targetPuppy = Math.hypot(b.x - PUPPIES[0].x, b.y - PUPPIES[0].y) < Math.hypot(b.x - PUPPIES[1].x, b.y - PUPPIES[1].y) ? PUPPIES[0] : PUPPIES[1];
  const tdx = targetPuppy.x - b.x, tdy = targetPuppy.y - b.y;
  const td = Math.hypot(tdx, tdy) || 1;

  // Homing acceleration based on difficulty and type
  const homingAcc = isHornet ? 340 : (isHard ? 250 : 190);
  b.vx += (tdx / td) * homingAcc * dt;
  b.vy += (tdy / td) * homingAcc * dt;

  // Hornet fiery particle trail
  if (isHornet) {
    b.trailTimer += dt;
    if (b.trailTimer > 0.045) {
      b.trailTimer = 0;
      addP({
        x: b.x - Math.cos(b.ang) * 14,
        y: b.y - Math.sin(b.ang) * 14,
        vx: rand(-20, 20), vy: rand(-20, 20),
        life: 0.28, size: rand(3, 6),
        color: pick(['#ff3b30', '#ff9500', '#ffd54f'])
      });
    }
  }

  // Speed damping / limits
  const curSp = Math.hypot(b.vx, b.vy);
  const maxSp = isHornet ? 640 : (isHard ? 540 : 480);
  if (curSp > maxSp) {
    b.vx = (b.vx / curSp) * maxSp;
    b.vy = (b.vy / curSp) * maxSp;
  }

  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.ang = Math.atan2(b.vy, b.vx);

  // Boundary bounces (top, bottom, and outside edges)
  if (b.y - b.r < 40) { b.y = 40 + b.r; b.vy = Math.abs(b.vy) * 0.85; }
  if (b.y + b.r > H - 40) { b.y = H - 40 - b.r; b.vy = -Math.abs(b.vy) * 0.85; }
  if (b.x - b.r < 20) { b.x = 20 + b.r; b.vx = Math.abs(b.vx) * 0.85; }
  if (b.x + b.r > W - 20) { b.x = W - 20 - b.r; b.vx = -Math.abs(b.vx) * 0.85; }

  // Bounce off beehive
  const hdx = b.x - hive.x, hdy = b.y - hive.y, hd = Math.hypot(hdx, hdy);
  if (hd < hive.r + b.r) {
    const nx = hdx / hd, ny = hdy / hd;
    b.x = hive.x + nx * (hive.r + b.r);
    b.y = hive.y + ny * (hive.r + b.r);
    b.vx = nx * (isHornet ? 400 : 320); b.vy = ny * (isHornet ? 400 : 320);
    hive.shake = 0.35;
  }

  // Check collision with Shields
  for (const s of shields) {
    const swingBonus = s.swinging ? s.swing * 36 : 0;
    const effX = s.x + (s.id === 0 ? swingBonus : -swingBonus);
    const effY = s.y;

    // Capsule / Ellipse distance check
    const dx = b.x - effX, dy = b.y - effY;
    const clampedY = clamp(dy, -s.h / 2 + s.r, s.h / 2 - s.r);
    const dist = Math.hypot(dx, dy - clampedY);

    if (dist < b.r + s.r) {
      // Normal of collision
      const nx = dx / (dist || 1), ny = (dy - clampedY) / (dist || 1);
      b.x = effX + nx * (b.r + s.r);
      b.y = effY + clampedY + ny * (b.r + s.r);

      // Bounce speed
      let outSp = Math.max(isHard ? 380 : 340, Math.hypot(b.vx, b.vy) * (isHard ? 1.2 : 1.15));
      if (s.swinging) {
        // SMACK! High speed launch across to opponent's territory
        outSp = isHornet ? rand(760, 960) : (isHard ? rand(660, 860) : rand(580, 780));
        const launchX = s.id === 0 ? 1 : -1;
        b.vx = launchX * outSp;
        b.vy = rand(-140, 140);
        shake = Math.max(shake, isHornet ? 10 : 7);
        SFX.thwack(isHornet || isHard);
        if (isHornet) {
          burst(b.x, b.y, '#ff3b30', 20, 360, 7, 0.45, 'spark');
          burst(b.x, b.y, '#ffd54f', 12, 260, 6, 0.4, 'star');
        } else {
          burst(b.x, b.y, '#ffffff', 14, 280, 5, 0.35, 'spark');
          burst(b.x, b.y, '#ffd54f', 8, 200, 6, 0.4);
        }
      } else {
        b.vx = nx * outSp;
        b.vy = ny * outSp;
        SFX.thwack(false);
        burst(b.x, b.y, isHornet ? '#ff7b72' : '#ffffff', 6, 160, 4, 0.25, 'spark');
      }
    }
  }

  // Check sting on puppies
  for (let i = 0; i < 2; i++) {
    const pup = PUPPIES[i];
    const pdx = b.x - pup.x, pdy = b.y - pup.y;
    const pd = Math.hypot(pdx, pdy);

    if (pd < pup.r + b.r) {
      // STING!
      b.dead = true;
      stings[i]++;
      SFX.squeak();
      SFX.bark();
      shake = Math.max(shake, isHornet ? 16 : 12);
      flash = 0.35;
      flashCol = isHornet ? '#ff1744' : '#ff4d6d';

      // Puffs & stinger stars
      burst(pup.x, pup.y, '#ffffff', 18, 260, 8, 0.5);
      burst(pup.x, pup.y, isHornet ? '#ff3b30' : '#ffd54f', 14, 240, 6, 0.6, 'star');

      if (stings[i] >= MAX_STINGS) {
        // Round Knockout!
        roundWinner = 1 - i;
        scores[roundWinner]++;
        scorePop[roundWinner] = 1;
        setTimeout(SFX.chime, 300);
        state = 'roundEnd';
        stateT = 0;
      }
      break;
    }
  }
}

function handleInput() {
  for (let i = 0; i < 2; i++) {
    const pr = Input.wasPressed(CTRL[i].act);
    if (state === 'menu') {
      if (pr && !ready[i]) {
        ready[i] = true;
        SFX.ready();
        burst(i ? 1050 : 230, 615, PUPPIES[i].col, 24, 280, 7, 0.7);
      }
    } else if (state === 'win') {
      if (pr && stateT > 2.0) {
        startMatch();
        Input.endFrame();
        return;
      }
    }
  }
}

function update(dt) {
  time += dt; stateT += dt;
  handleInput();

  if (state === 'menu') {
    if (ready[0] && ready[1]) {
      menuGo += dt;
      if (menuGo > 0.7) startMatch();
    }
    if (Math.random() < dt * 5) {
      addP({ x: rand(0, W), y: -10, vy: rand(60, 140), vx: rand(-20, 20), life: rand(4, 7), size: rand(6, 12), color: '#ffffff', g: 20 });
    }
  } else {
    const playing = state === 'play';

    // Shields update
    for (const s of shields) updateShield(s, dt, playing);

    // Beehive periodic spawn
    if (playing) {
      const isHard = difficulty === 'hard';
      const maxBees = isHard ? 8 : 5;
      hive.spawnTimer -= dt;
      if (hive.spawnTimer <= 0 && bees.length < maxBees) {
        spawnBee();
        hive.spawnTimer = isHard ? rand(1.1, 1.8) : rand(2.2, 3.2);
      }
    }
    hive.shake = Math.max(0, hive.shake - dt * 2);

    // Bees update
    for (const b of bees) updateBee(b, dt);
    bees = bees.filter(b => !b.dead);

    if (state === 'count') {
      const num = Math.floor(stateT / 0.65);
      if (num !== lastBeep && num < 3) {
        lastBeep = num;
        SFX.beep(false);
      }
      if (stateT >= 1.95) {
        state = 'play';
        stateT = 0;
        SFX.beep(true);
      }
    }

    if (state === 'roundEnd' && stateT > 2.4) {
      if (scores[0] >= WIN_ROUNDS || scores[1] >= WIN_ROUNDS) {
        winner = scores[0] >= WIN_ROUNDS ? 0 : 1;
        state = 'win';
        stateT = 0;
        SFX.fanfare();
      } else {
        resetRound();
      }
    }

    if (state === 'win') {
      for (let i = 0; i < 4; i++) {
        addP({
          type: 'bone', x: rand(0, W), y: -20,
          vx: rand(-40, 40), vy: rand(120, 260),
          g: 60, drag: 0.3, life: rand(3, 5),
          size: rand(14, 24), color: '#ffd54f',
          rot: rand(0, TAU), vr: rand(-5, 5)
        });
      }
    }
  }

  // Update particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    const f = Math.exp(-p.drag * dt);
    p.vx *= f; p.vy *= f; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
  }

  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt * 1.5);
  scorePop[0] = Math.max(0, scorePop[0] - dt * 1.2);
  scorePop[1] = Math.max(0, scorePop[1] - dt * 1.2);
  Input.endFrame();
}

/* ===================== DRAWING HELPERS ===================== */
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function starPath(x, y, R, r, n = 5, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, d = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
  }
  ctx.closePath();
}

function drawBone(x, y, s, col = '#ffe57f') {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = col;
  ctx.strokeStyle = '#c99a22';
  ctx.lineWidth = 2.5;

  rr(ctx, -18, -6, 36, 12, 4);
  ctx.fill(); ctx.stroke();

  // 4 bone nubs
  const nubs = [[-18, -6], [-18, 6], [18, -6], [18, 6]];
  nubs.forEach(([nx, ny]) => {
    circle(nx, ny, 7);
    ctx.fill(); ctx.stroke();
  });

  ctx.restore();
}

function drawHeart(x, y, s, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(-10, -8, -16, 4, 0, 16);
  ctx.bezierCurveTo(16, 4, 10, -8, 0, 4);
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = '#ff4d6d';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

/* ===================== ENVIRONMENT ===================== */
function drawBackground() {
  // Pastel sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#7ce2ff');
  sky.addColorStop(0.65, '#b8efff');
  sky.addColorStop(1, '#e3f9ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Fluffy clouds
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  const clouds = [
    [200, 90, 80], [280, 80, 95], [370, 95, 75],
    [900, 100, 85], [980, 85, 100], [1070, 105, 80]
  ];
  clouds.forEach(([cx, cy, cr]) => {
    circle(cx + Math.sin(time * 0.3 + cx) * 15, cy, cr);
    ctx.fill();
  });

  // Soft rolling hills at bottom
  ctx.fillStyle = '#8bd655';
  ctx.beginPath();
  ctx.moveTo(0, H - 90);
  ctx.quadraticCurveTo(W * 0.25, H - 140, W * 0.5, H - 95);
  ctx.quadraticCurveTo(W * 0.75, H - 60, W, H - 90);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#65be35';
  ctx.beginPath();
  ctx.moveTo(0, H - 50);
  ctx.quadraticCurveTo(W * 0.5, H - 75, W, H - 50);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Wooden pedestals for Puppies
  for (let i = 0; i < 2; i++) {
    const pup = PUPPIES[i];
    ctx.fillStyle = '#8c593b';
    rr(ctx, pup.x - 48, pup.y + pup.r - 8, 96, 68, 8);
    ctx.fill();
    ctx.strokeStyle = '#5c351f';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Wood grain highlight
    ctx.fillStyle = '#a66e4a';
    rr(ctx, pup.x - 42, pup.y + pup.r - 2, 84, 12, 4);
    ctx.fill();
  }

  // Soft dotted center divider net
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 4;
  ctx.setLineDash([12, 12]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 40);
  ctx.lineTo(W / 2, H - 50);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBeehive() {
  const isHard = difficulty === 'hard';
  const sh = hive.shake > 0 ? Math.sin(time * 45) * hive.shake * 8 : 0;
  const x = hive.x + sh, y = hive.y;

  ctx.save();
  ctx.translate(x, y);

  // Branch
  ctx.fillStyle = isHard ? '#4e2817' : '#6b4423';
  ctx.fillRect(-60, -60, 120, 16);
  ctx.strokeStyle = isHard ? '#2e1205' : '#422811';
  ctx.lineWidth = 3;
  ctx.strokeRect(-60, -60, 120, 16);

  // Hanging rope
  ctx.strokeStyle = isHard ? '#d06030' : '#d7a15c';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, -60);
  ctx.lineTo(0, -28);
  ctx.stroke();

  // Tiered beehive layers
  const hg = ctx.createLinearGradient(0, -30, 0, 40);
  if (isHard) {
    hg.addColorStop(0, '#ff8a65');
    hg.addColorStop(0.5, '#ff3d00');
    hg.addColorStop(1, '#b71c1c');
    ctx.strokeStyle = '#670000';
  } else {
    hg.addColorStop(0, '#ffe57f');
    hg.addColorStop(0.5, '#ffca28');
    hg.addColorStop(1, '#ff9800');
    ctx.strokeStyle = '#c67100';
  }
  ctx.fillStyle = hg;
  ctx.lineWidth = 3;

  // Layer ellipses
  const layers = [
    [0, -22, 28, 14],
    [0, -8, 38, 18],
    [0, 8, 44, 20],
    [0, 24, 34, 16],
    [0, 36, 20, 10]
  ];
  layers.forEach(([lx, ly, rx, ry]) => {
    ctx.beginPath();
    ctx.ellipse(lx, ly, rx, ry, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
  });

  // Hive door / hole
  ctx.fillStyle = isHard ? '#200508' : '#3e2005';
  ctx.beginPath();
  ctx.ellipse(0, 10, 12, 15, 0, 0, TAU);
  ctx.fill();

  // Drip: Honey or Magma
  ctx.fillStyle = isHard ? '#ff3d00' : '#ffb300';
  circle(0, 38 + Math.sin(time * 4) * 4, 5);
  ctx.fill();

  ctx.restore();

  // In Hard mode, smoke & embers drifting from the hive
  if (isHard && Math.random() < 0.25) {
    addP({
      x: x + rand(-16, 16),
      y: y + rand(-10, 20),
      vx: rand(-15, 15),
      vy: rand(-35, -80),
      life: 0.45,
      size: rand(3, 6),
      color: pick(['#ff3d00', '#ff9100', '#ffea00', '#555555'])
    });
  }
}

/* ===================== PUPPIES & EXPRESSIONS ===================== */
function drawPuppy(id, x, y, r, stingCount) {
  const p = PUPPIES[id];
  ctx.save();
  ctx.translate(x, y);

  // Tail wag
  const wag = Math.sin(time * 14 + id * 2) * 0.45;
  const tailDir = id === 0 ? -1 : 1;
  ctx.save();
  ctx.translate(tailDir * r * 0.75, r * 0.35);
  ctx.rotate(wag);
  ctx.fillStyle = p.col;
  ctx.strokeStyle = p.dark;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(tailDir * 12, 0, 16, 7, tailDir * 0.3, 0, TAU);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // Body
  const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 4, 0, 0, r);
  bg.addColorStop(0, p.light);
  bg.addColorStop(0.65, p.col);
  bg.addColorStop(1, p.dark);
  ctx.fillStyle = bg;
  circle(0, 0, r); ctx.fill();
  ctx.strokeStyle = p.dark; ctx.lineWidth = 3; ctx.stroke();

  // Floppy ears
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * r * 0.7, -r * 0.4);
    ctx.rotate(s * 0.3 + (stingCount >= 3 ? Math.sin(time * 12) * 0.2 : 0));
    ctx.fillStyle = p.dark;
    ctx.beginPath();
    ctx.ellipse(0, 14, 10, 20, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffc2d9';
    ctx.beginPath();
    ctx.ellipse(0, 14, 5, 12, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // Collar with bell
  ctx.fillStyle = p.collar;
  rr(ctx, -r * 0.65, r * 0.6, r * 1.3, 10, 4);
  ctx.fill();
  ctx.fillStyle = '#ffd54f';
  circle(0, r * 0.65 + 5, 6); ctx.fill();
  ctx.strokeStyle = '#c67100'; ctx.lineWidth = 1.5; ctx.stroke();

  // Comical Balloon Cheeks (Save the Pets Style)
  const isBalloonFace = stingCount >= 3;
  if (stingCount >= 1) {
    // Left cheek swollen
    const sw = stingCount >= 2 ? 26 : 18;
    ctx.fillStyle = p.light;
    ctx.strokeStyle = p.dark; ctx.lineWidth = 2.5;
    circle(-r * 0.75, r * 0.2, sw); ctx.fill(); ctx.stroke();
    // Red sting mark & band-aid
    ctx.fillStyle = '#ff3366'; circle(-r * 0.75, r * 0.2, 5); ctx.fill();
    ctx.fillStyle = '#ffe082'; rr(ctx, -r * 0.75 - 8, r * 0.2 - 4, 16, 8, 2); ctx.fill();
  }
  if (stingCount >= 2) {
    // Right cheek swollen
    const sw = 26;
    ctx.fillStyle = p.light;
    ctx.strokeStyle = p.dark; ctx.lineWidth = 2.5;
    circle(r * 0.75, r * 0.2, sw); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff3366'; circle(r * 0.75, r * 0.2, 5); ctx.fill();
    ctx.fillStyle = '#ffe082'; rr(ctx, r * 0.75 - 8, r * 0.2 - 4, 16, 8, 2); ctx.fill();
  }

  // Giant balloon head on 3rd sting
  if (isBalloonFace) {
    ctx.fillStyle = 'rgba(255,230,160,0.5)';
    circle(0, 0, r * 1.35); ctx.fill();
    ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 3; ctx.stroke();
  }

  // Eyes
  for (const s of [-1, 1]) {
    const ex = s * r * 0.35, ey = -r * 0.12;
    if (isBalloonFace) {
      // Swirling dizzy eyes
      ctx.strokeStyle = '#1d2238'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let k = 0; k < 12; k++) {
        const a = k * 0.8 + time * 14 * s, d = k * 1.5;
        ctx.lineTo(ex + Math.cos(a) * d, ey + Math.sin(a) * d);
      }
      ctx.stroke();
    } else if (stingCount >= 1 && s === -1) {
      // Wincing closed eye
      ctx.strokeStyle = '#1d2238'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ex - 8, ey); ctx.lineTo(ex + 8, ey);
      ctx.stroke();
    } else {
      // Big shiny cute puppy eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(ex, ey, 9, 12, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1d2238';
      circle(ex, ey + 1, 6); ctx.fill();
      ctx.fillStyle = '#ffffff';
      circle(ex - 2, ey - 2, 2.8); ctx.fill();
    }
  }

  // Snout & Nose
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(0, r * 0.22, 14, 10, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1d2238';
  ctx.beginPath(); ctx.ellipse(0, r * 0.14, 6, 4, 0, 0, TAU); ctx.fill();

  // Tongue / Mouth
  if (stingCount === 0) {
    // Happy open mouth with pink tongue
    ctx.fillStyle = '#ff6b8b';
    ctx.beginPath();
    ctx.arc(0, r * 0.28, 7, 0, Math.PI);
    ctx.fill();
  } else if (!isBalloonFace) {
    // Worried wavy mouth
    ctx.strokeStyle = '#1d2238'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-8, r * 0.28);
    ctx.quadraticCurveTo(0, r * 0.35, 8, r * 0.28);
    ctx.stroke();
  }

  // Nervous sweat drop if bee is close
  let nearBee = false;
  for (const b of bees) {
    if (Math.hypot(b.x - (p.x + x), b.y - (p.y + y)) < 180) { nearBee = true; break; }
  }
  if (nearBee && stingCount < 3) {
    ctx.fillStyle = '#72d6ff';
    ctx.beginPath();
    const sx = r * 0.8, sy = -r * 0.55;
    ctx.moveTo(sx, sy - 8);
    ctx.quadraticCurveTo(sx + 6, sy, sx, sy + 6);
    ctx.quadraticCurveTo(sx - 6, sy, sx, sy - 8);
    ctx.fill();
  }

  ctx.restore();
}

/* ===================== SHIELD PADDLE ===================== */
function drawShield(s) {
  const isLeft = s.id === 0;
  const swingOffset = s.swinging ? (isLeft ? s.swing * 42 : -s.swing * 42) : 0;
  const x = s.x + swingOffset, y = s.y;

  ctx.save();
  ctx.translate(x, y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, s.h / 2 + 8, s.w, 10, 0, 0, TAU);
  ctx.fill();

  // Swing motion arc
  if (s.swinging) {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    const arcDir = isLeft ? 1 : -1;
    ctx.arc(0, 0, s.h * 0.65, arcDir * -Math.PI * 0.35, arcDir * Math.PI * 0.35);
    ctx.stroke();
  }

  // Wooden curved shield body
  const wg = ctx.createLinearGradient(-s.w / 2, 0, s.w / 2, 0);
  wg.addColorStop(0, '#8c593b');
  wg.addColorStop(0.5, '#b07850');
  wg.addColorStop(1, '#6b4025');
  ctx.fillStyle = wg;
  rr(ctx, -s.w / 2, -s.h / 2, s.w, s.h, s.r);
  ctx.fill();

  // Reinforced metal brackets
  ctx.fillStyle = isLeft ? '#50a5ff' : '#ff7eb3';
  rr(ctx, -s.w / 2 - 2, -s.h / 2 + 12, s.w + 4, 8, 3); ctx.fill();
  rr(ctx, -s.w / 2 - 2, s.h / 2 - 20, s.w + 4, 8, 3); ctx.fill();

  // Golden boss / center emblem
  ctx.fillStyle = '#ffd54f';
  circle(0, 0, 10); ctx.fill();
  ctx.strokeStyle = '#c67100'; ctx.lineWidth = 2; ctx.stroke();

  // Outer rim
  ctx.strokeStyle = '#422513';
  ctx.lineWidth = 2.5;
  rr(ctx, -s.w / 2, -s.h / 2, s.w, s.h, s.r);
  ctx.stroke();

  ctx.restore();
}

/* ===================== ANGRY BEES ===================== */
function drawBee(b) {
  const isHornet = b.type === 'hornet';
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.ang);

  // Fluttering wings
  const wingLift = Math.sin(b.wingT) * 12;
  ctx.fillStyle = isHornet ? 'rgba(255,200,200,0.85)' : 'rgba(255,255,255,0.75)';
  ctx.strokeStyle = isHornet ? 'rgba(255,100,100,0.9)' : 'rgba(180,220,255,0.8)';
  ctx.lineWidth = 1.5;

  // Upper wing
  ctx.beginPath();
  ctx.ellipse(-2, -b.r - wingLift * 0.5, 7, 13, -0.3, 0, TAU);
  ctx.fill(); ctx.stroke();

  // Lower wing
  ctx.beginPath();
  ctx.ellipse(-4, b.r + wingLift * 0.5, 7, 13, 0.3, 0, TAU);
  ctx.fill(); ctx.stroke();

  // Striped Bee Body
  const bg = ctx.createRadialGradient(-3, -3, 2, 0, 0, b.r);
  if (isHornet) {
    bg.addColorStop(0, '#ff6e40');
    bg.addColorStop(0.5, '#d50000');
    bg.addColorStop(1, '#4a000c');
  } else {
    bg.addColorStop(0, '#fff176');
    bg.addColorStop(0.5, '#ffd54f');
    bg.addColorStop(1, '#ff8f00');
  }
  ctx.fillStyle = bg;
  circle(0, 0, b.r); ctx.fill();

  // Stripes
  ctx.fillStyle = isHornet ? '#160205' : '#1d2238';
  ctx.save();
  circle(0, 0, b.r); ctx.clip();
  ctx.fillRect(-6, -b.r, 5, b.r * 2);
  ctx.fillRect(2, -b.r, 5, b.r * 2);
  ctx.restore();

  // Stinger on tail
  ctx.fillStyle = isHornet ? '#ff1744' : '#1d2238';
  ctx.beginPath();
  ctx.moveTo(-b.r, -3);
  ctx.lineTo(-b.r - (isHornet ? 11 : 7), 0);
  ctx.lineTo(-b.r, 3);
  ctx.closePath();
  ctx.fill();

  // Eye
  if (isHornet) {
    // Glowing sharp hornet eye
    ctx.fillStyle = '#ffea00';
    circle(b.r * 0.45, -3, 5.5); ctx.fill();
    ctx.fillStyle = '#110000';
    circle(b.r * 0.55, -3, 2.5); ctx.fill();
    ctx.fillStyle = '#ffffff';
    circle(b.r * 0.4, -4, 1.5); ctx.fill();

    // Sharp angled brow
    ctx.strokeStyle = '#3e0007'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.r * 0.15, -8);
    ctx.lineTo(b.r * 0.75, -5);
    ctx.stroke();
  } else {
    // Angry cartoon eye
    ctx.fillStyle = '#ffffff';
    circle(b.r * 0.45, -3, 5); ctx.fill();
    ctx.fillStyle = '#1d2238';
    circle(b.r * 0.55, -3, 2.5); ctx.fill();

    // Slanted angry eyebrow
    ctx.strokeStyle = '#1d2238'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.r * 0.2, -7);
    ctx.lineTo(b.r * 0.7, -5);
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    switch (p.type) {
      case 'dot':
        ctx.fillStyle = p.color;
        circle(p.x, p.y, p.size * (0.3 + 0.7 * a));
        ctx.fill();
        break;
      case 'spark':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(1, p.size * a);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04);
        ctx.stroke();
        break;
      case 'star':
        ctx.fillStyle = p.color;
        starPath(p.x, p.y, p.size, p.size * 0.45, 5, p.rot);
        ctx.fill();
        break;
      case 'bone':
        drawBone(p.x, p.y, p.size * 0.07, p.color);
        break;
    }
  }
  ctx.globalAlpha = 1;
}

/* ===================== HUD ===================== */
function drawHUD() {
  const isHard = difficulty === 'hard';

  for (let i = 0; i < 2; i++) {
    const left = i === 0, x0 = left ? 30 : W - 390;
    const pup = PUPPIES[i];

    // Score board plate
    rr(ctx, x0, 18, 360, 78, 24);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fill();
    ctx.strokeStyle = pup.col;
    ctx.lineWidth = 3.5;
    ctx.stroke();

    // Puppy mini icon
    const cx = left ? x0 + 48 : x0 + 312;
    circle(cx, 57, 24);
    ctx.fillStyle = pup.col; ctx.fill();
    ctx.strokeStyle = pup.dark; ctx.lineWidth = 2; ctx.stroke();
    // Ears
    for (const s of [-1, 1]) {
      circle(cx + s * 14, 42, 7);
      ctx.fillStyle = pup.dark; ctx.fill();
    }
    // Eyes
    ctx.fillStyle = '#fff';
    circle(cx - 6, 55, 3.5); ctx.fill(); circle(cx + 6, 55, 3.5); ctx.fill();
    ctx.fillStyle = '#000';
    circle(cx - 5, 55, 2); ctx.fill(); circle(cx + 7, 55, 2); ctx.fill();

    // 3 Golden Round-Win Bones
    for (let k = 0; k < WIN_ROUNDS; k++) {
      const bx = left ? x0 + 120 + k * 64 : x0 + 240 - k * 64;
      const lit = k < scores[i];
      const isNew = lit && k === scores[i] - 1 && scorePop[i] > 0;
      const sc = isNew ? 1 + Math.sin(scorePop[i] * Math.PI) * 0.5 : 1;

      ctx.save();
      ctx.translate(bx, 57);
      ctx.scale(sc, sc);
      if (lit) {
        drawBone(0, 0, 1.15, '#ffd54f');
      } else {
        drawBone(0, 0, 0.95, 'rgba(0,0,0,0.12)');
      }
      ctx.restore();
    }

    // 3 Hearts above each puppy in the arena
    const heartsRemaining = Math.max(0, MAX_STINGS - stings[i]);
    for (let h = 0; h < MAX_STINGS; h++) {
      const hx = pup.x - 34 + h * 34, hy = pup.y - pup.r - 28;
      drawHeart(hx, hy, 1.3, h < heartsRemaining);
    }
  }

  // TOP-CENTER DIFFICULTY BADGE (Interactive)
  const badgeW = 160, badgeH = 34, bx = W / 2, by = 40;
  rr(ctx, bx - badgeW / 2, by - badgeH / 2, badgeW, badgeH, 17);
  if (isHard) {
    const bg = ctx.createLinearGradient(bx - badgeW / 2, 0, bx + badgeW / 2, 0);
    bg.addColorStop(0, '#d50000');
    bg.addColorStop(1, '#ff6d00');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.font = `900 13px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('🔥 HARD MODE', bx, by);
  } else {
    const bg = ctx.createLinearGradient(bx - badgeW / 2, 0, bx + badgeW / 2, 0);
    bg.addColorStop(0, '#ffb300');
    bg.addColorStop(1, '#ffe082');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = '#b26a00';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.font = `900 13px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4e2800';
    ctx.fillText('🍯 NORMAL', bx, by);
  }
}

/* ===================== SCREENS ===================== */
function drawKey(x, y, w, h, label, down, col) {
  const d = down ? 4 : 0;
  rr(ctx, x - w / 2, y - h / 2 + 5, w, h, 8);
  ctx.fillStyle = '#1c5577'; ctx.fill();
  rr(ctx, x - w / 2, y - h / 2 + d, w, h, 8);
  ctx.fillStyle = down ? col : '#ffffff';
  ctx.fill();
  ctx.strokeStyle = down ? '#fff' : '#6bb4db';
  ctx.lineWidth = 2; ctx.stroke();
  if (label) {
    ctx.fillStyle = down ? '#fff' : '#1c5577';
    ctx.font = `900 ${Math.round(Math.min(w, h) * 0.48)}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y + d + 1);
  }
}

function drawCheck(x, y, r) {
  ctx.fillStyle = '#3fd27a'; circle(x, y, r); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.12; ctx.stroke();
  ctx.lineWidth = r * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.45, y + r * 0.02);
  ctx.lineTo(x - r * 0.1, y + r * 0.36);
  ctx.lineTo(x + r * 0.48, y - r * 0.32);
  ctx.stroke();
}

function drawTitle() {
  const words = [['PET', '#50a5ff'], ['SHIELD', '#ffd54f'], ['DEFENSE', '#ff7eb3']];
  ctx.font = `900 50px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const full = words.map(w => w[0]).join(' ');
  const tw = ctx.measureText(full).width;
  let x = W / 2 - tw / 2, idx = 0;
  for (const [wd, col] of words) {
    for (const ch of wd) {
      const y = 48 + Math.sin(time * 5 + idx * 0.5) * 5;
      const cw = ctx.measureText(ch).width;
      ctx.save();
      ctx.translate(x + cw / 2, y);
      ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff';
      ctx.strokeText(ch, -cw / 2, 0);
      ctx.fillStyle = col;
      ctx.fillText(ch, -cw / 2, 0);
      ctx.restore();
      x += cw; idx++;
    }
    x += ctx.measureText(' ').width;
  }
}

function drawDifficultyToggle(cx, cy) {
  const isHard = difficulty === 'hard';
  const pillW = 340, pillH = 38, r = 19;

  // Background pill container
  rr(ctx, cx - pillW / 2, cy - pillH / 2, pillW, pillH, r);
  ctx.fillStyle = 'rgba(15, 35, 60, 0.78)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Sliding selection indicator / active background
  const btnW = (pillW - 8) / 2;
  const activeX = isHard ? cx + 2 : cx - pillW / 2 + 4;

  ctx.save();
  rr(ctx, activeX, cy - pillH / 2 + 3, btnW, pillH - 6, r - 3);
  if (isHard) {
    const hg = ctx.createLinearGradient(activeX, 0, activeX + btnW, 0);
    hg.addColorStop(0, '#ff3b30');
    hg.addColorStop(1, '#ff9500');
    ctx.fillStyle = hg;
    ctx.shadowColor = 'rgba(255, 59, 48, 0.7)';
    ctx.shadowBlur = 14;
  } else {
    const ng = ctx.createLinearGradient(activeX, 0, activeX + btnW, 0);
    ng.addColorStop(0, '#ffb300');
    ng.addColorStop(1, '#ffd54f');
    ctx.fillStyle = ng;
    ctx.shadowColor = 'rgba(255, 179, 0, 0.6)';
    ctx.shadowBlur = 12;
  }
  ctx.fill();
  ctx.restore();

  // NORMAL Button text & icon
  ctx.font = `900 14px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const normX = cx - pillW / 4;
  ctx.fillStyle = !isHard ? '#1c3b10' : 'rgba(255, 255, 255, 0.7)';
  ctx.fillText('🍯 NORMAL', normX, cy + 1);

  // HARD Button text & icon
  const hardX = cx + pillW / 4;
  ctx.fillStyle = isHard ? '#ffffff' : 'rgba(255, 255, 255, 0.7)';
  ctx.fillText('🔥 HARD', hardX, cy + 1);

  // Small shortcut hint pill
  ctx.font = `700 11px ${FONT}`;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.textAlign = 'left';
  ctx.fillText('[TAB / CLICK]', cx + pillW / 2 + 12, cy + 1);
}

function drawTutorialPanel(cx, id) {
  const p = PUPPIES[id], rdy = ready[id];
  rr(ctx, cx - 180, 126, 360, 555, 30);
  const g = ctx.createLinearGradient(0, 126, 0, 680);
  g.addColorStop(0, 'rgba(255,255,255,0.92)');
  g.addColorStop(1, id === 0 ? 'rgba(80,165,255,0.35)' : 'rgba(255,126,179,0.35)');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = rdy ? '#3fd27a' : p.col;
  ctx.lineWidth = rdy ? 5 : 3.5;
  ctx.stroke();

  // Puppy preview
  const jump = rdy ? Math.abs(Math.sin(time * 8)) * 14 : 0;
  drawPuppy(id, cx, 205 - jump, 36, 0);
  if (rdy) drawCheck(cx + 60, 160, 20);

  // Key cluster
  const tt = Math.max(0, time + id * 0.3);
  const seq = ['up', 'right', 'down', 'left', 'act'];
  const period = 0.6;
  const si = ((Math.floor(tt / period) % seq.length) + seq.length) % seq.length;
  const u = (tt % period) / period, down = u > 0.12 && u < 0.7;
  const act = seq[si] || 'act';

  const keys = id === 0 ? ['W', 'A', 'S', 'D'] : ['▲', '◀', '▼', '▶'];
  const pos = [[cx, 310], [cx - 56, 366], [cx, 366], [cx + 56, 366]];
  pos.forEach(([kx, ky], k) => {
    drawKey(kx, ky, 50, 50, keys[k], down && act === ['up', 'left', 'down', 'right'][k], p.col);
  });

  // Action key for shield swing
  const actY = 460;
  if (id === 0) {
    drawKey(cx, actY, 170, 46, '', down && act === 'act', p.col);
  } else {
    drawKey(cx - 30, actY, 110, 46, '⏎', down && act === 'act', p.col);
    drawKey(cx + 48, actY, 56, 46, '⇧', false, p.col);
  }

  // Mini shield swing demonstration
  const shX = cx, shY = 530;
  drawShield({ id, x: shX, y: shY, w: 22, h: 64, r: 20, swinging: down && act === 'act', swing: 1 });

  // Ready indicator
  const ry = 620;
  if (rdy) {
    drawCheck(cx, ry, 32);
  } else {
    const pulse = 0.5 + 0.5 * Math.sin(time * 5);
    ctx.strokeStyle = p.col;
    ctx.lineWidth = 5;
    ctx.setLineDash([8, 6]);
    circle(cx, ry, 34 + pulse * 4);
    ctx.stroke();
    ctx.setLineDash([]);
    if (id === 0) drawKey(cx, ry, 70, 32, '', false, p.col);
    else drawKey(cx, ry, 48, 36, '⏎', false, p.col);
  }
}

function drawCenterDemo() {
  const cx = W / 2;
  const isHard = difficulty === 'hard';
  rr(ctx, cx - 210, 126, 420, 555, 30);
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
  ctx.strokeStyle = isHard ? '#ff6d00' : '#ffd54f';
  ctx.lineWidth = 3.5;
  ctx.stroke();

  // Mini game demonstration: Shield whacks Bee away from Puppy!
  const D = 3.4, u = (time % D) / D;

  // Mini arena box
  rr(ctx, cx - 180, 150, 360, 260, 18);
  ctx.fillStyle = isHard ? '#ffefe6' : '#b8efff';
  ctx.fill();
  ctx.strokeStyle = isHard ? '#ffab91' : '#7ce2ff';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Puppy on left
  const pupX = cx - 120, pupY = 280;
  const stung = u > 0.65;
  drawPuppy(0, pupX, pupY, 26, stung ? 2 : 0);

  // Shield
  const sX = cx - 35, sY = 280;
  const isSwinging = u > 0.45 && u < 0.6;
  drawShield({ id: 0, x: sX, y: sY, w: 18, h: 54, r: 16, swinging: isSwinging, swing: 1 });

  // Bee trajectory
  let beeX, beeY;
  if (u < 0.5) {
    const f = u / 0.5;
    beeX = lerp(cx + 120, sX + 16, f);
    beeY = lerp(185, sY, f);
  } else {
    const f = (u - 0.5) / 0.5;
    beeX = lerp(sX + 16, cx + 130, f);
    beeY = lerp(sY, 175, f);
  }
  drawBee({
    x: beeX, y: beeY, r: 12,
    ang: u < 0.5 ? Math.PI : 0,
    wingT: time * 35,
    type: isHard && (Math.floor(time * 0.5) % 2 === 0) ? 'hornet' : 'normal'
  });

  if (u > 0.48 && u < 0.65) {
    ctx.fillStyle = isHard ? '#ff3b30' : '#ffd54f';
    starPath(sX + 20, sY, 20, 8, 5);
    ctx.fill();
  }

  // Visual summary: 3 bones -> Trophy
  for (let k = 0; k < 3; k++) {
    const sx = cx - 100 + k * 44;
    drawBone(sx, 445, 0.9, '#ffd54f');
  }
  ctx.fillStyle = '#1c5577';
  ctx.beginPath();
  ctx.moveTo(cx + 30, 439); ctx.lineTo(cx + 54, 445); ctx.lineTo(cx + 30, 451); ctx.closePath();
  ctx.fill();

  // Trophy
  ctx.save();
  ctx.translate(cx + 100, 447 + Math.sin(time * 3) * 4);
  ctx.scale(0.65, 0.65);
  ctx.fillStyle = '#ffd54f';
  ctx.strokeStyle = '#c67100';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, -20, 24, 0, Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillRect(-6, 4, 12, 16); ctx.strokeRect(-6, 4, 12, 16);
  rr(ctx, -22, 20, 44, 14, 4); ctx.fill(); ctx.stroke();
  ctx.restore();

  // Mode description banner
  const descY = 515;
  rr(ctx, cx - 180, descY - 18, 360, 52, 14);
  ctx.fillStyle = isHard ? 'rgba(255, 59, 48, 0.12)' : 'rgba(255, 179, 0, 0.12)';
  ctx.fill();
  ctx.strokeStyle = isHard ? '#ff3b30' : '#ffb300';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 14px ${FONT}`;
  ctx.fillStyle = isHard ? '#d32f2f' : '#b26a00';
  const titleTxt = isHard ? '🔥 HARD / COMPETITIVE MODE' : '🍯 NORMAL / CASUAL MODE';
  ctx.fillText(titleTxt, cx, descY - 2);

  ctx.font = `700 11px ${FONT}`;
  ctx.fillStyle = '#1c5577';
  const subTxt = isHard ? '8 Bees Swarm • Crimson Hornets • High Velocity Slams' : '5 Bees • Relaxed Spawn Rate • Classic Honey Swarm';
  ctx.fillText(subTxt, cx, descY + 16);

  // START MATCH / READY PROMPT BUTTON
  const startY = 620;
  rr(ctx, cx - 140, startY - 26, 280, 52, 26);
  const sg = ctx.createLinearGradient(0, startY - 26, 0, startY + 26);
  sg.addColorStop(0, '#3fd27a');
  sg.addColorStop(1, '#2db060');
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.font = `900 16px ${FONT}`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('⚡ CLICK TO START', cx, startY);
}

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0, 0, W, H);
  drawParticles();
  drawTitle();
  drawDifficultyToggle(W / 2, 96);
  drawTutorialPanel(230, 0);
  drawTutorialPanel(1050, 1);
  drawCenterDemo();

  if (ready[0] && ready[1]) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, menuGo * 1.3)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawCountdown() {
  if (state === 'count') {
    const num = 3 - Math.floor(stateT / 0.65), u = (stateT % 0.65) / 0.65;
    const s = 0.4 + easeOutBack(Math.min(1, u * 2.5)) * 0.8;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.globalAlpha = 1 - Math.max(0, u - 0.7) * 3;
    ctx.fillStyle = ['#3fd27a', '#ffd54f', '#ff4d6d'][num - 1] || '#fff';
    circle(0, 0, 70); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.stroke();
    ctx.font = `900 96px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.fillText(num, 0, 6);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawRoundEnd() {
  if (stateT < 0.4) return;
  const u = Math.min(1, (stateT - 0.4) / 0.4), s = easeOutBack(u);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(s, s);
  if (roundWinner >= 0) {
    const pup = PUPPIES[roundWinner];
    ctx.fillStyle = '#ffffff';
    circle(0, 0, 80); ctx.fill();
    ctx.strokeStyle = pup.col; ctx.lineWidth = 8; ctx.stroke();
    drawPuppy(roundWinner, 0, 10 - Math.abs(Math.sin(time * 8)) * 10, 36, 0);
    drawCheck(56, -50, 20);
  }
  ctx.restore();
}

function drawWin() {
  const isHard = difficulty === 'hard';
  const winId = (winner === 0 || winner === 1) ? winner : (scores[0] >= scores[1] ? 0 : 1);
  const pup = PUPPIES[winId];
  ctx.fillStyle = `rgba(255,255,255,${Math.min(0.65, stateT * 0.8)})`;
  ctx.fillRect(0, 0, W, H);

  // Victory rays
  ctx.save();
  ctx.translate(W / 2, 340);
  ctx.rotate(time * 0.4);
  for (let k = 0; k < 16; k++) {
    ctx.rotate(TAU / 16);
    ctx.fillStyle = k % 2 ? (isHard ? 'rgba(255,59,48,0.28)' : 'rgba(255,213,79,0.35)') : 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-70, -800); ctx.lineTo(70, -800); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // Mode Banner at top
  ctx.save();
  ctx.font = `900 36px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (isHard) {
    ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff';
    ctx.strokeText('🔥 HARD MODE CHAMPION! 🔥', W / 2, 60);
    ctx.fillStyle = '#ff3b30';
    ctx.fillText('🔥 HARD MODE CHAMPION! 🔥', W / 2, 60);
  } else {
    ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff';
    ctx.strokeText('🍯 VICTORY! 🍯', W / 2, 60);
    ctx.fillStyle = '#f59e0b';
    ctx.fillText('🍯 VICTORY! 🍯', W / 2, 60);
  }
  ctx.restore();

  const enter = easeOutBack(Math.min(1, stateT * 1.4));
  const b = Math.abs(Math.sin(time * 5));

  ctx.save();
  ctx.translate(W / 2, 320);
  ctx.scale(enter, enter);

  // Winner Puppy
  drawPuppy(winId, 0, -b * 30, 70, 0);

  // Crown
  ctx.save();
  ctx.translate(0, -b * 30 - 105);
  ctx.scale(1.4, 1.4);
  ctx.fillStyle = '#ffd54f'; ctx.strokeStyle = '#c67100'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-28, 10); ctx.lineTo(-32, -18); ctx.lineTo(-14, -4); ctx.lineTo(0, -24); ctx.lineTo(14, -4); ctx.lineTo(32, -18); ctx.lineTo(28, 10); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  ctx.restore();

  // Loser Puppy Floating balloon in the corner
  const loserId = 1 - winId;
  const loserX = winId === 0 ? 1140 : 140;
  const loserY = 220 + Math.sin(time * 2) * 20;
  drawPuppy(loserId, loserX, loserY, 48, 3);

  // 3 Golden bones across center
  for (let k = 0; k < WIN_ROUNDS; k++) {
    drawBone(W / 2 - 80 + k * 80, 480, 1.3);
  }

  // Rematch difficulty toggle
  drawDifficultyToggle(W / 2, 555);

  drawParticles();

  // Replay prompt
  if (stateT > 2.0) {
    const tap = Math.floor(time * 2.5) % 2 === 0;
    const a = Math.min(1, (stateT - 2.0) * 2);
    ctx.globalAlpha = a;
    rr(ctx, W / 2 - 170, 626, 340, 68, 34);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = pup.col; ctx.lineWidth = 4; ctx.stroke();
    drawKey(W / 2 - 95, 660, 90, 36, '', tap, PUPPIES[0].col);
    drawKey(W / 2 + 95, 660, 56, 36, '⏎', !tap, PUPPIES[1].col);
    ctx.save();
    ctx.translate(W / 2, 660);
    ctx.rotate(time * 3);
    ctx.strokeStyle = '#3fd27a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 16, 0.3, TAU - 0.6); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ===================== RENDER LOOP ===================== */
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  drawBackground();

  if (state !== 'menu') {
    // 1. Draw Beehive
    drawBeehive();

    // 2. Draw Puppies on their wooden blocks
    drawPuppy(0, PUPPIES[0].x, PUPPIES[0].y, PUPPIES[0].r, stings[0]);
    drawPuppy(1, PUPPIES[1].x, PUPPIES[1].y, PUPPIES[1].r, stings[1]);

    // 3. Draw Shields
    for (const s of shields) drawShield(s);

    // 4. Draw Bees
    for (const b of bees) drawBee(b);

    if (state !== 'win') drawParticles();
  }
  ctx.restore();

  if (state !== 'menu') drawHUD();
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,77,109,${flash * 0.45})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'menu') drawMenu();
  if (state === 'count') drawCountdown();
  if (state === 'roundEnd') drawRoundEnd();
  if (state === 'win') drawWin();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
shields = [makeShield(0), makeShield(1)];
requestAnimationFrame(frame);
</script>
</body>
</html>

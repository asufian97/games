<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battleship: Naval Clash – 2-Player Tactical Battle</title>
<meta name="description" content="A dramatic, dark ocean 2-player keyboard Battleship game. Secretly deploy your naval fleet, pass the device, and fire torpedoes with radar sonar effects on one shared keyboard!">
<style>
  :root {
    --bg-dark: #030812;
    --navy-blue: #0b1a30;
    --p1-blue: #0ea5e9;
    --p1-light: #7dd3fc;
    --p2-red: #f43f5e;
    --p2-light: #fda4af;
    --radar-green: #10b981;
    --gold: #facc15;
    --font: "Segoe UI Black", "Arial Black", "Trebuchet MS", system-ui, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02060e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    color: #fff;
  }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1280px;
    max-height: 840px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: radial-gradient(ellipse at center, #091a32 0%, #040d1a 60%, #02060d 100%);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(14, 165, 233, 0.15);
    border-radius: 18px;
  }

  h1 {
    position: absolute;
    left: -9999px;
    top: 0;
  }

  .hud-btn {
    position: absolute;
    bottom: 24px;
    right: 28px;
    background: rgba(11, 26, 48, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 8px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    z-index: 10;
  }
  .hud-btn:hover {
    background: rgba(14, 165, 233, 0.3);
    border-color: #38bdf8;
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div id="game-container">
  <h1>Battleship: Naval Clash – 2-Player Tactical Battle</h1>
  <canvas id="gameCanvas" width="1280" height="820" aria-label="Battleship Canvas Game"></canvas>
  <button id="soundToggle" class="hud-btn" title="Toggle Sound (M)">
    <span id="soundIcon">🔊</span> SOUND
  </button>
</div>

<script>
'use strict';

/* ==========================================================================
   BATTLESHIP: NAVAL CLASH (2-PLAYER SPLIT-KEYBOARD BATTLE)
   Single self-contained vanilla HTML5 Canvas + Web Audio API game.
   ========================================================================== */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const soundBtn = document.getElementById('soundToggle');
const soundIcon = document.getElementById('soundIcon');

// Dimensions
const CW = 1280;
const CH = 820;
const GRID_SIZE = 10;

// Typography Constants
const FONT = '"Segoe UI Black", "Arial Black", "Trebuchet MS", system-ui, sans-serif';
const fFont = (size, weight = '900') => `${weight} ${size}px ${FONT}`;

// Game Phases
const PHASE_DEPLOY_P1 = 0;
const PHASE_PASS_TO_P2_DEPLOY = 1;
const PHASE_DEPLOY_P2 = 2;
const PHASE_PASS_TO_BATTLE = 3;
const PHASE_BATTLE_P1 = 4;
const PHASE_PASS_TO_P2 = 5;
const PHASE_BATTLE_P2 = 6;
const PHASE_PASS_TO_P1 = 7;
const PHASE_GAMEOVER = 8;

// Ship Types Definition (5 ships per player)
const SHIP_SPECS = [
  { id: 'carrier', name: 'Carrier', length: 5, icon: '✈️' },
  { id: 'battleship', name: 'Battleship', length: 4, icon: '🚢' },
  { id: 'cruiser', name: 'Cruiser', length: 3, icon: '🛳️' },
  { id: 'submarine', name: 'Submarine', length: 3, icon: '🐬' },
  { id: 'destroyer', name: 'Destroyer', length: 2, icon: '🚤' }
];

/* ==========================================================================
   AUDIO SYNTHESIZER (Web Audio API - 100% Procedural)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    soundIcon.textContent = this.muted ? '🔇' : '🔊';
    return this.muted;
  }

  // Sonar Ping on navigation
  playBeep() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.06);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.005, now + 0.06);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    } catch (e) {}
  }

  // Ship Placed Anchor Clank
  playPlace() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch (e) {}
  }

  // Torpedo Launch Fire Sound
  playLaunch() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      // High whoosh whistle
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.22);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    } catch (e) {}
  }

  // Torpedo HIT: Fiery Blast Boom
  playHit() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      // Low sub rumble
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.45);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.45);

      // Noise explosion crunch
      const bufferSize = this.ctx.sampleRate * 0.25;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.4, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      noise.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);
      noise.start(now);
    } catch (e) {}
  }

  // Torpedo MISS: Water Splash
  playMiss() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.22);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    } catch (e) {}
  }

  // Ship Sunk Alarm / Metal Groan
  playSunk() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [220, 185, 155, 110].forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, now + i * 0.14);
        gain.gain.setValueAtTime(0.3, now + i * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.14 + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.14);
        osc.stop(now + i * 0.14 + 0.4);
      });
    } catch (e) {}
  }

  // Victory Horn Fanfare
  playVictory() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const melody = [392, 523.25, 659.25, 783.99, 1046.50]; // G4, C5, E5, G5, C6
      melody.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.14);
        gain.gain.setValueAtTime(0.35, now + i * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.14 + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.14);
        osc.stop(now + i * 0.14 + 0.5);
      });
    } catch (e) {}
  }
}

const audio = new SoundEngine();
soundBtn.addEventListener('click', () => {
  audio.init();
  audio.toggleMute();
});

/* ==========================================================================
   GAME STATE & FLEET MODELS
   ========================================================================== */
let gamePhase = PHASE_DEPLOY_P1;
let winner = null;
let radarAngle = 0; // Sweeping radar rotation angle

// Visual FX
let particles = [];
let floatingTexts = [];
let firingAnimation = null; // Missile in-flight animation: { fromX, fromY, toX, toY, t, maxT, onLand }

// Player Models
const players = [
  {
    id: 0,
    name: 'BLUE FLEET',
    color: '#0ea5e9',
    light: '#7dd3fc',
    dark: '#0369a1',
    glow: 'rgba(14, 165, 233, 0.45)',
    icon: '🔷',
    grid: createEmptyGrid(),        // Cell: null or ship reference
    attacks: createEmptyGrid(),     // 0 = unattacked, 1 = miss (water), 2 = hit (fire)
    ships: [],                      // Placed ship objects
    cursorR: 0,
    cursorC: 0,
    deployShipIndex: 0,
    deployRot: 0                   // 0 = horizontal (left to right), 1 = vertical (top to bottom)
  },
  {
    id: 1,
    name: 'RED FLEET',
    color: '#f43f5e',
    light: '#fda4af',
    dark: '#be123c',
    glow: 'rgba(244, 63, 94, 0.45)',
    icon: '🔶',
    grid: createEmptyGrid(),
    attacks: createEmptyGrid(),
    ships: [],
    cursorR: 0,
    cursorC: 0,
    deployShipIndex: 0,
    deployRot: 0
  }
];

function createEmptyGrid() {
  const g = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    g.push(new Array(GRID_SIZE).fill(0));
  }
  return g;
}

/* ==========================================================================
   PARTICLE & FX SYSTEMS
   ========================================================================== */
class Particle {
  constructor(x, y, vx, vy, color, size, life, isSmoke = false) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.size = size;
    this.life = life;
    this.maxLife = life;
    this.isSmoke = isSmoke;
    this.rot = Math.random() * Math.PI * 2;
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.isSmoke) {
      this.size += dt * 8;
      this.vy -= dt * 20; // Smoke rises
    } else {
      this.vy += dt * 180; // Gravity
    }
    this.life -= dt;
  }

  draw(c) {
    const alpha = Math.max(0, this.life / this.maxLife);
    c.save();
    c.globalAlpha = alpha;
    c.translate(this.x, this.y);
    c.fillStyle = this.color;
    c.beginPath();
    c.arc(0, 0, this.size, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

class FloatingText {
  constructor(text, x, y, color, size = 26) {
    this.text = text;
    this.x = x;
    this.y = y;
    this.color = color;
    this.size = size;
    this.life = 1.2;
    this.maxLife = 1.2;
    this.vy = -45;
  }

  update(dt) {
    this.y += this.vy * dt;
    this.life -= dt;
  }

  draw(c) {
    const alpha = Math.max(0, this.life / this.maxLife);
    const scale = 1 + (1 - alpha) * 0.3;
    c.save();
    c.globalAlpha = alpha;
    c.translate(this.x, this.y);
    c.scale(scale, scale);
    c.font = fFont(this.size);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(0, 0, 0, 0.8)';
    c.fillText(this.text, 2, 2);
    c.fillStyle = this.color;
    c.fillText(this.text, 0, 0);
    c.restore();
  }
}

/* ==========================================================================
   SHIP PLACEMENT VALIDATION & LOGIC
   ========================================================================== */
function canPlaceShip(player, r, c, len, rot) {
  for (let i = 0; i < len; i++) {
    const checkR = rot === 1 ? r + i : r;
    const checkC = rot === 0 ? c + i : c;

    // Out of grid boundary
    if (checkR < 0 || checkR >= GRID_SIZE || checkC < 0 || checkC >= GRID_SIZE) {
      return false;
    }

    // Overlapping another ship
    if (player.grid[checkR][checkC] !== 0) {
      return false;
    }
  }
  return true;
}

function placeCurrentShip(player) {
  const spec = SHIP_SPECS[player.deployShipIndex];
  if (!spec) return false;

  const r = player.cursorR;
  const c = player.cursorC;
  const len = spec.length;
  const rot = player.deployRot;

  if (!canPlaceShip(player, r, c, len, rot)) {
    return false;
  }

  const cells = [];
  for (let i = 0; i < len; i++) {
    const cr = rot === 1 ? r + i : r;
    const cc = rot === 0 ? c + i : c;
    cells.push({ r: cr, c: cc, hit: false });
    player.grid[cr][cc] = spec.id;
  }

  const newShip = {
    id: spec.id,
    name: spec.name,
    length: len,
    rot: rot,
    startR: r,
    startC: c,
    cells: cells,
    sunk: false
  };

  player.ships.push(newShip);
  audio.playPlace();

  // Floating placement text
  floatingTexts.push(new FloatingText(`${spec.name} DEPLOYED! ⚓`, CW / 2, CH / 2 - 20, player.light, 26));

  player.deployShipIndex++;
  player.cursorR = 0;
  player.cursorC = 0;

  // Check if all 5 ships placed for this player
  if (player.deployShipIndex >= SHIP_SPECS.length) {
    if (player.id === 0) {
      gamePhase = PHASE_PASS_TO_P2_DEPLOY;
    } else {
      gamePhase = PHASE_PASS_TO_BATTLE;
    }
  }

  return true;
}

function autoRandomDeploy(player) {
  // Clear previous
  player.grid = createEmptyGrid();
  player.ships = [];

  for (let sIdx = 0; sIdx < SHIP_SPECS.length; sIdx++) {
    const spec = SHIP_SPECS[sIdx];
    let placed = false;
    let attempts = 0;

    while (!placed && attempts < 100) {
      attempts++;
      const rot = Math.random() < 0.5 ? 0 : 1;
      const maxR = rot === 1 ? GRID_SIZE - spec.length : GRID_SIZE - 1;
      const maxC = rot === 0 ? GRID_SIZE - spec.length : GRID_SIZE - 1;
      const r = Math.floor(Math.random() * (maxR + 1));
      const c = Math.floor(Math.random() * (maxC + 1));

      if (canPlaceShip(player, r, c, spec.length, rot)) {
        const cells = [];
        for (let i = 0; i < spec.length; i++) {
          const cr = rot === 1 ? r + i : r;
          const cc = rot === 0 ? c + i : c;
          cells.push({ r: cr, c: cc, hit: false });
          player.grid[cr][cc] = spec.id;
        }

        player.ships.push({
          id: spec.id,
          name: spec.name,
          length: spec.length,
          rot: rot,
          startR: r,
          startC: c,
          cells: cells,
          sunk: false
        });
        placed = true;
      }
    }
  }

  player.deployShipIndex = SHIP_SPECS.length;
  audio.playPlace();

  if (player.id === 0) {
    gamePhase = PHASE_PASS_TO_P2_DEPLOY;
  } else {
    gamePhase = PHASE_PASS_TO_BATTLE;
  }
}

/* ==========================================================================
   BATTLE TARGETING & FIRING LOGIC
   ========================================================================== */
function fireTorpedo(attackerIdx) {
  if (firingAnimation) return; // Wait for current shot to land

  const attacker = players[attackerIdx];
  const defender = players[1 - attackerIdx];

  const targetR = attacker.cursorR;
  const targetC = attacker.cursorC;

  // Cannot re-fire at already targeted cells
  if (attacker.attacks[targetR][targetC] !== 0) {
    audio.playBeep();
    floatingTexts.push(new FloatingText("SECTOR ALREADY TARGETED! ⚠️", CW / 2, CH / 2 - 20, '#facc15', 24));
    return;
  }

  // Calculate target screen position on primary radar
  const tilePos = getRadarTileCenter(targetR, targetC);
  const startPos = { x: attackerIdx === 0 ? 120 : CW - 120, y: CH - 80 };

  audio.playLaunch();

  firingAnimation = {
    startX: startPos.x,
    startY: startPos.y,
    targetX: tilePos.x,
    targetY: tilePos.y,
    t: 0,
    maxT: 0.38,
    targetR: targetR,
    targetC: targetC,
    attackerIdx: attackerIdx,
    defenderIdx: 1 - attackerIdx
  };
}

function resolveTorpedoImpact(anim) {
  const attacker = players[anim.attackerIdx];
  const defender = players[anim.defenderIdx];
  const r = anim.targetR;
  const c = anim.targetC;

  const hitShipId = defender.grid[r][c];

  if (hitShipId !== 0) {
    // 💥 HIT!
    attacker.attacks[r][c] = 2; // Hit marker
    audio.playHit();

    // Mark cell as hit in defender's ship model
    const hitShip = defender.ships.find(s => s.id === hitShipId);
    if (hitShip) {
      const cellObj = hitShip.cells.find(cell => cell.r === r && cell.c === c);
      if (cellObj) cellObj.hit = true;

      // Check if ship is SUNK!
      const isSunkNow = hitShip.cells.every(cell => cell.hit);
      if (isSunkNow && !hitShip.sunk) {
        hitShip.sunk = true;
        audio.playSunk();
        floatingTexts.push(new FloatingText(`💥 ENEMY ${hitShip.name.toUpperCase()} SUNK! ⚓`, CW / 2, 80, '#ef4444', 32));

        // Smoke & water explosion burst across all sunk ship tiles
        hitShip.cells.forEach(sc => {
          const scPos = getRadarTileCenter(sc.r, sc.c);
          for (let i = 0; i < 18; i++) {
            particles.push(new Particle(
              scPos.x, scPos.y,
              (Math.random() - 0.5) * 260,
              (Math.random() - 0.5) * 260,
              '#f97316', 4 + Math.random() * 5, 0.9, true
            ));
          }
        });
      } else {
        floatingTexts.push(new FloatingText("DIRECT HIT! 🔥", anim.targetX, anim.targetY - 25, '#f43f5e', 26));
      }
    }

    // Fiery Explosion Particles
    for (let i = 0; i < 28; i++) {
      particles.push(new Particle(
        anim.targetX, anim.targetY,
        (Math.random() - 0.5) * 320,
        (Math.random() - 0.5) * 320,
        ['#ef4444', '#f97316', '#facc15', '#ffffff'][Math.floor(Math.random() * 4)],
        3 + Math.random() * 5,
        0.7 + Math.random() * 0.4
      ));
    }
  } else {
    // 🌊 MISS!
    attacker.attacks[r][c] = 1; // Miss marker
    audio.playMiss();
    floatingTexts.push(new FloatingText("SPLASH! MISS 🌊", anim.targetX, anim.targetY - 25, '#38bdf8', 24));

    // Water Splash droplet particles
    for (let i = 0; i < 22; i++) {
      particles.push(new Particle(
        anim.targetX, anim.targetY,
        (Math.random() - 0.5) * 220,
        -(120 + Math.random() * 160),
        ['#38bdf8', '#7dd3fc', '#ffffff'][Math.floor(Math.random() * 3)],
        2 + Math.random() * 3,
        0.5 + Math.random() * 0.3
      ));
    }
  }

  // Check Game Over (Did defender lose all ships?)
  const allSunk = defender.ships.every(s => s.sunk);
  if (allSunk) {
    setTimeout(() => {
      endGame(anim.attackerIdx);
    }, 900);
    return;
  }

  // Switch Turn after brief dramatic pause
  setTimeout(() => {
    if (gamePhase === PHASE_BATTLE_P1) {
      gamePhase = PHASE_PASS_TO_P2;
    } else if (gamePhase === PHASE_BATTLE_P2) {
      gamePhase = PHASE_PASS_TO_P1;
    }
  }, 1100);
}

function endGame(winnerIdx) {
  gamePhase = PHASE_GAMEOVER;
  winner = winnerIdx;
  audio.playVictory();

  // Burst of 140 victory fireworks
  const winColor = players[winner].color;
  for (let i = 0; i < 140; i++) {
    particles.push(new Particle(
      CW / 2 + (Math.random() - 0.5) * 500,
      CH / 2 - 80 + (Math.random() - 0.5) * 200,
      (Math.random() - 0.5) * 600,
      (Math.random() - 0.9) * 650,
      [winColor, '#facc15', '#ffffff', '#38bdf8', '#fb7185'][Math.floor(Math.random() * 5)],
      5 + Math.random() * 6,
      2.5 + Math.random() * 1.5
    ));
  }
}

function startNewGame() {
  players[0].grid = createEmptyGrid();
  players[0].attacks = createEmptyGrid();
  players[0].ships = [];
  players[0].cursorR = 0;
  players[0].cursorC = 0;
  players[0].deployShipIndex = 0;
  players[0].deployRot = 0;

  players[1].grid = createEmptyGrid();
  players[1].attacks = createEmptyGrid();
  players[1].ships = [];
  players[1].cursorR = 0;
  players[1].cursorC = 0;
  players[1].deployShipIndex = 0;
  players[1].deployRot = 0;

  particles = [];
  floatingTexts = [];
  firingAnimation = null;
  winner = null;
  gamePhase = PHASE_DEPLOY_P1;
}

/* ==========================================================================
   INPUT EVENT LISTENERS
   ========================================================================== */
window.addEventListener('keydown', (e) => {
  audio.init();

  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'KeyX'].includes(e.code)) {
    e.preventDefault();
  }

  if (e.code === 'KeyM') {
    audio.toggleMute();
    return;
  }

  // --- 1. RESTART TRIGGER ---
  if (gamePhase === PHASE_GAMEOVER && (e.code === 'Space' || e.code === 'Enter')) {
    startNewGame();
    return;
  }

  // --- 2. PRIVACY PASS DEVICE SCREENS ---
  if ([PHASE_PASS_TO_P2_DEPLOY, PHASE_PASS_TO_BATTLE, PHASE_PASS_TO_P2, PHASE_PASS_TO_P1].includes(gamePhase)) {
    if (e.code === 'Enter' || e.code === 'Space') {
      audio.playPlace();
      if (gamePhase === PHASE_PASS_TO_P2_DEPLOY) gamePhase = PHASE_DEPLOY_P2;
      else if (gamePhase === PHASE_PASS_TO_BATTLE) gamePhase = PHASE_BATTLE_P1;
      else if (gamePhase === PHASE_PASS_TO_P2) gamePhase = PHASE_BATTLE_P2;
      else if (gamePhase === PHASE_PASS_TO_P1) gamePhase = PHASE_BATTLE_P1;
    }
    return;
  }

  // --- 3. DEPLOYMENT PHASE (P1 & P2) ---
  if (gamePhase === PHASE_DEPLOY_P1 || gamePhase === PHASE_DEPLOY_P2) {
    const curPlayer = gamePhase === PHASE_DEPLOY_P1 ? players[0] : players[1];

    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      curPlayer.cursorR = Math.max(0, curPlayer.cursorR - 1);
      audio.playBeep();
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      curPlayer.cursorR = Math.min(GRID_SIZE - 1, curPlayer.cursorR + 1);
      audio.playBeep();
    } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      curPlayer.cursorC = Math.max(0, curPlayer.cursorC - 1);
      audio.playBeep();
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      curPlayer.cursorC = Math.min(GRID_SIZE - 1, curPlayer.cursorC + 1);
      audio.playBeep();
    } else if (e.code === 'KeyR' || e.code === 'Space') {
      // Toggle rotation
      curPlayer.deployRot = curPlayer.deployRot === 0 ? 1 : 0;
      audio.playBeep();
    } else if (e.code === 'Enter') {
      // Place Ship
      placeCurrentShip(curPlayer);
    } else if (e.code === 'KeyX') {
      // Quick Auto-Deploy
      autoRandomDeploy(curPlayer);
    }
    return;
  }

  // --- 4. BATTLE TARGETING PHASE ---
  if (gamePhase === PHASE_BATTLE_P1 || gamePhase === PHASE_BATTLE_P2) {
    const attackerIdx = gamePhase === PHASE_BATTLE_P1 ? 0 : 1;
    const attacker = players[attackerIdx];

    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      attacker.cursorR = Math.max(0, attacker.cursorR - 1);
      audio.playBeep();
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      attacker.cursorR = Math.min(GRID_SIZE - 1, attacker.cursorR + 1);
      audio.playBeep();
    } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      attacker.cursorC = Math.max(0, attacker.cursorC - 1);
      audio.playBeep();
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      attacker.cursorC = Math.min(GRID_SIZE - 1, attacker.cursorC + 1);
      audio.playBeep();
    } else if (e.code === 'Enter' || e.code === 'Space') {
      fireTorpedo(attackerIdx);
    }
  }
});

/* ==========================================================================
   GRID COORDINATES & LAYOUT CALCULATIONS
   ========================================================================== */
// Deployment Full Grid Geometry (Centered)
const DEPLOY_GRID = {
  x0: CW / 2 - 250,
  y0: 170,
  tileSize: 50
};

// Battle Grids Layout:
// Left: Friendly Defense Grid (tileSize 30, w 300)
// Right: Targeting Radar Grid (tileSize 46, w 460)
const DEFENSE_GRID = {
  x0: 80,
  y0: 220,
  tileSize: 31
};

const RADAR_GRID = {
  x0: 520,
  y0: 160,
  tileSize: 48
};

function getRadarTileCenter(r, c) {
  return {
    x: RADAR_GRID.x0 + c * RADAR_GRID.tileSize + RADAR_GRID.tileSize / 2,
    y: RADAR_GRID.y0 + r * RADAR_GRID.tileSize + RADAR_GRID.tileSize / 2
  };
}

/* ==========================================================================
   UPDATE LOOP
   ========================================================================== */
let lastTime = performance.now();

function update(dt) {
  // Sweeping radar scan line
  radarAngle += dt * 2.2;

  // In-flight missile torpedo animation
  if (firingAnimation) {
    const f = firingAnimation;
    f.t += dt;
    if (f.t >= f.maxT) {
      resolveTorpedoImpact(f);
      firingAnimation = null;
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update(dt);
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update floating text indicators
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.update(dt);
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

/* ==========================================================================
   RENDERING ENGINE
   ========================================================================== */
function draw() {
  ctx.clearRect(0, 0, CW, CH);

  // 1. Ambient Ocean Waves & Grid Texture
  drawOceanBackground();

  // 2. Render Based on Phase
  if (gamePhase === PHASE_DEPLOY_P1 || gamePhase === PHASE_DEPLOY_P2) {
    drawDeploymentScreen(gamePhase === PHASE_DEPLOY_P1 ? players[0] : players[1]);
  } else if (gamePhase === PHASE_BATTLE_P1 || gamePhase === PHASE_BATTLE_P2) {
    drawBattleScreen(gamePhase === PHASE_BATTLE_P1 ? 0 : 1);
  }

  // 3. Torpedo missile in flight
  if (firingAnimation) {
    drawFiringMissile(firingAnimation);
  }

  // 4. Particles
  particles.forEach(p => p.draw(ctx));

  // 5. Floating texts
  floatingTexts.forEach(ft => ft.draw(ctx));

  // 6. Privacy Transition Curtains ("PASS DEVICE")
  if ([PHASE_PASS_TO_P2_DEPLOY, PHASE_PASS_TO_BATTLE, PHASE_PASS_TO_P2, PHASE_PASS_TO_P1].includes(gamePhase)) {
    drawPrivacyPassCurtain();
  }

  // 7. Victory Celebration Modal
  if (gamePhase === PHASE_GAMEOVER) {
    drawVictoryModal();
  }
}

/* --- Render Helpers --- */

function drawOceanBackground() {
  ctx.save();
  // Ambient Sonar Concentric Rings in center
  ctx.strokeStyle = 'rgba(14, 165, 233, 0.05)';
  ctx.lineWidth = 1.5;
  const cx = CW / 2;
  const cy = CH / 2;
  for (let rad = 100; rad <= 650; rad += 110) {
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Compass crosshair axes
  ctx.beginPath();
  ctx.moveTo(cx, 0); ctx.lineTo(cx, CH);
  ctx.moveTo(0, cy); ctx.lineTo(CW, cy);
  ctx.stroke();

  ctx.restore();
}

/* ==========================================================================
   DEPLOYMENT SCREEN RENDERING
   ========================================================================== */
function drawDeploymentScreen(player) {
  const g = DEPLOY_GRID;

  // Top Title Banner
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = fFont(32);
  ctx.fillStyle = player.light;
  ctx.shadowColor = player.color;
  ctx.shadowBlur = 16;
  ctx.fillText(`${player.icon} ${player.name}: FLEET DEPLOYMENT`, CW / 2, 60);

  ctx.font = fFont(16, '600');
  ctx.fillStyle = '#94a3b8';
  ctx.shadowBlur = 0;
  ctx.fillText('SECRETLY PLACE YOUR SHIPS ON THE GRID', CW / 2, 95);

  // Left Control Guide Card
  drawDeployControlsCard(player, 80, 170);

  // Right Fleet Queue Card
  drawFleetQueueCard(player, CW - 320, 170);

  // 10x10 Grid Board
  draw10x10Grid(g.x0, g.y0, g.tileSize, true);

  // Draw already placed ships
  player.ships.forEach(s => {
    drawShipGraphic(g.x0, g.y0, g.tileSize, s, player.color);
  });

  // Draw current ship placement ghost preview
  const currentSpec = SHIP_SPECS[player.deployShipIndex];
  if (currentSpec) {
    const isValid = canPlaceShip(player, player.cursorR, player.cursorC, currentSpec.length, player.deployRot);
    drawShipPreviewGhost(g.x0, g.y0, g.tileSize, player.cursorR, player.cursorC, currentSpec.length, player.deployRot, isValid);
  }

  ctx.restore();
}

function drawDeployControlsCard(player, x, y) {
  ctx.save();
  ctx.fillStyle = 'rgba(11, 26, 48, 0.85)';
  ctx.strokeStyle = player.color;
  ctx.lineWidth = 2;
  roundRect(ctx, x, y, 200, 360, 16);
  ctx.fill();
  ctx.stroke();

  ctx.font = fFont(18);
  ctx.fillStyle = player.light;
  ctx.textAlign = 'center';
  ctx.fillText('CONTROLS', x + 100, y + 36);

  const controls = [
    { key: 'ARROWS / WASD', desc: 'MOVE SHIP' },
    { key: 'R / SPACE', desc: 'ROTATE 🔄' },
    { key: 'ENTER', desc: 'DEPLOY ⚓' },
    { key: 'X', desc: 'RANDOM 🎲' }
  ];

  controls.forEach((c, idx) => {
    const cy = y + 80 + idx * 64;
    // Key pill
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 1;
    roundRect(ctx, x + 20, cy, 160, 26, 6);
    ctx.fill();
    ctx.stroke();

    ctx.font = fFont(12);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(c.key, x + 100, cy + 18);

    ctx.font = fFont(11, '700');
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(c.desc, x + 100, cy + 42);
  });

  ctx.restore();
}

function drawFleetQueueCard(player, x, y) {
  ctx.save();
  ctx.fillStyle = 'rgba(11, 26, 48, 0.85)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x, y, 240, 360, 16);
  ctx.fill();
  ctx.stroke();

  ctx.font = fFont(18);
  ctx.fillStyle = '#facc15';
  ctx.textAlign = 'center';
  ctx.fillText('FLEET SQUADRON', x + 120, y + 36);

  SHIP_SPECS.forEach((spec, idx) => {
    const sy = y + 65 + idx * 56;
    const isPlaced = idx < player.deployShipIndex;
    const isCurrent = idx === player.deployShipIndex;

    ctx.fillStyle = isCurrent ? 'rgba(14, 165, 233, 0.2)' : 'rgba(255, 255, 255, 0.05)';
    ctx.strokeStyle = isCurrent ? player.color : (isPlaced ? '#10b981' : 'rgba(255, 255, 255, 0.1)');
    ctx.lineWidth = isCurrent ? 2 : 1;
    roundRect(ctx, x + 15, sy, 210, 46, 8);
    ctx.fill();
    ctx.stroke();

    ctx.font = fFont(14);
    ctx.fillStyle = isCurrent ? '#ffffff' : (isPlaced ? '#10b981' : '#94a3b8');
    ctx.textAlign = 'left';
    ctx.fillText(`${spec.icon} ${spec.name}`, x + 25, sy + 28);

    // Ship length pips
    for (let p = 0; p < spec.length; p++) {
      ctx.fillStyle = isPlaced ? '#10b981' : (isCurrent ? player.light : '#475569');
      ctx.fillRect(x + 155 + p * 9, sy + 20, 7, 10);
    }
  });

  ctx.restore();
}

/* ==========================================================================
   BATTLE SCREEN RENDERING
   ========================================================================== */
function drawBattleScreen(activeIdx) {
  const attacker = players[activeIdx];
  const defender = players[1 - activeIdx];

  // Top Turn Banner
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = fFont(32);
  ctx.fillStyle = attacker.light;
  ctx.shadowColor = attacker.color;
  ctx.shadowBlur = 18;
  ctx.fillText(`${attacker.icon} ${attacker.name}'S TURN: TARGET ENEMY WATERS`, CW / 2, 54);

  // Status subtitle
  const enemyShipsAfloat = defender.ships.filter(s => !s.sunk).length;
  ctx.font = fFont(16, '600');
  ctx.fillStyle = '#facc15';
  ctx.shadowBlur = 0;
  ctx.fillText(`ENEMY FLEET DETECTED: ${enemyShipsAfloat} / 5 SHIPS AFLOAT 🚢`, CW / 2, 88);
  ctx.restore();

  // 1. Left: Friendly Defense Grid (tileSize 31, 310x310)
  drawFriendlyDefenseSection(attacker, DEFENSE_GRID.x0, DEFENSE_GRID.y0, DEFENSE_GRID.tileSize);

  // 2. Right: Primary Attack Radar (tileSize 48, 480x480)
  drawPrimaryRadarSection(attacker, defender, RADAR_GRID.x0, RADAR_GRID.y0, RADAR_GRID.tileSize);

  // 3. Bottom controls bar
  drawBattleControlsBar(attacker);
}

function drawFriendlyDefenseSection(player, x0, y0, tileSize) {
  ctx.save();

  // Header Title
  ctx.font = fFont(18);
  ctx.fillStyle = player.light;
  ctx.textAlign = 'left';
  ctx.fillText(`🛡️ HOME WATERS (YOUR FLEET)`, x0, y0 - 15);

  // 10x10 Defense Grid
  draw10x10Grid(x0, y0, tileSize, false);

  // Draw Player's Own Ships on Home Waters
  player.ships.forEach(s => {
    drawShipGraphic(x0, y0, tileSize, s, player.color);
  });

  // Draw Enemy's hits and misses on player's home grid
  const enemyAttacks = players[1 - player.id].attacks;
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const att = enemyAttacks[r][c];
      const cx = x0 + c * tileSize + tileSize / 2;
      const cy = y0 + r * tileSize + tileSize / 2;
      if (att === 2) {
        // Hit on friendly ship (Red Fire)
        drawHitMarker(cx, cy, tileSize * 0.35);
      } else if (att === 1) {
        // Miss in water (Blue Water Peg)
        drawMissMarker(cx, cy, tileSize * 0.28);
      }
    }
  }

  // Sunk status checklist underneath friendly defense grid
  let sy = y0 + GRID_SIZE * tileSize + 25;
  ctx.font = fFont(14);
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('STATUS: FLEET DAMAGE REPORT', x0, sy);
  sy += 20;

  player.ships.forEach(s => {
    ctx.font = fFont(12);
    ctx.fillStyle = s.sunk ? '#ef4444' : '#10b981';
    ctx.fillText(`${s.sunk ? '💥' : '⚓'} ${s.name}: ${s.sunk ? 'SUNK' : 'OPERATIONAL'}`, x0, sy);
    sy += 18;
  });

  ctx.restore();
}

function drawPrimaryRadarSection(attacker, defender, x0, y0, tileSize) {
  ctx.save();

  // Header Title
  ctx.font = fFont(22);
  ctx.fillStyle = '#f43f5e';
  ctx.textAlign = 'left';
  ctx.shadowColor = '#f43f5e';
  ctx.shadowBlur = 12;
  ctx.fillText(`🎯 TARGETING RADAR (ENEMY WATERS)`, x0, y0 - 18);
  ctx.shadowBlur = 0;

  // 10x10 Radar Grid
  draw10x10Grid(x0, y0, tileSize, true);

  // Sweeping Radar Line Beam (Circular Sonar Scan)
  const radarW = GRID_SIZE * tileSize;
  const radarCX = x0 + radarW / 2;
  const radarCY = y0 + radarW / 2;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, radarW, radarW);
  ctx.clip();

  ctx.beginPath();
  ctx.moveTo(radarCX, radarCY);
  ctx.arc(radarCX, radarCY, radarW * 0.75, radarAngle, radarAngle + 0.5);
  ctx.closePath();
  const sweepGrad = ctx.createRadialGradient(radarCX, radarCY, 0, radarCX, radarCY, radarW * 0.7);
  sweepGrad.addColorStop(0, 'rgba(16, 185, 129, 0)');
  sweepGrad.addColorStop(1, 'rgba(16, 185, 129, 0.18)');
  ctx.fillStyle = sweepGrad;
  ctx.fill();
  ctx.restore();

  // Draw Attacker's Hit and Miss markers
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const att = attacker.attacks[r][c];
      const cx = x0 + c * tileSize + tileSize / 2;
      const cy = y0 + r * tileSize + tileSize / 2;
      if (att === 2) {
        drawHitMarker(cx, cy, tileSize * 0.38);
      } else if (att === 1) {
        drawMissMarker(cx, cy, tileSize * 0.32);
      }
    }
  }

  // Draw Targeting Crosshair Reticle
  const curX = x0 + attacker.cursorC * tileSize;
  const curY = y0 + attacker.cursorR * tileSize;
  drawCrosshair(curX, curY, tileSize, attacker.color);

  ctx.restore();
}

function drawBattleControlsBar(attacker) {
  ctx.save();
  const barY = CH - 68;
  ctx.fillStyle = 'rgba(11, 26, 48, 0.85)';
  ctx.strokeStyle = attacker.color;
  ctx.lineWidth = 1.5;
  roundRect(ctx, RADAR_GRID.x0, barY, GRID_SIZE * RADAR_GRID.tileSize, 48, 12);
  ctx.fill();
  ctx.stroke();

  ctx.font = fFont(14);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`🎮 [ ARROWS / WASD ] AIM TARGET     •     [ ENTER / SPACE ] LAUNCH TORPEDO 🚀`, RADAR_GRID.x0 + (GRID_SIZE * RADAR_GRID.tileSize) / 2, barY + 24);

  ctx.restore();
}

/* ==========================================================================
   GRID & GRAPHICAL ASSET RENDERERS
   ========================================================================== */
function draw10x10Grid(x0, y0, tileSize, isRadar = false) {
  ctx.save();

  // Grid Backdrop
  ctx.fillStyle = isRadar ? '#071629' : '#050f1d';
  ctx.strokeStyle = isRadar ? 'rgba(14, 165, 233, 0.3)' : 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;

  ctx.fillRect(x0, y0, GRID_SIZE * tileSize, GRID_SIZE * tileSize);

  // Grid Lines & Tiles
  for (let r = 0; r <= GRID_SIZE; r++) {
    // Horizontal
    ctx.beginPath();
    ctx.moveTo(x0, y0 + r * tileSize);
    ctx.lineTo(x0 + GRID_SIZE * tileSize, y0 + r * tileSize);
    ctx.stroke();

    // Vertical
    ctx.beginPath();
    ctx.moveTo(x0 + r * tileSize, y0);
    ctx.lineTo(x0 + r * tileSize, y0 + GRID_SIZE * tileSize);
    ctx.stroke();
  }

  // Coordinate Labels (Letters A-J on left, Numbers 1-10 on top)
  const letters = ['A','B','C','D','E','F','G','H','I','J'];
  ctx.font = fFont(Math.max(10, Math.floor(tileSize * 0.32)), '700');
  ctx.fillStyle = '#64748b';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let i = 0; i < GRID_SIZE; i++) {
    // Numbers along top
    ctx.fillText(`${i + 1}`, x0 + i * tileSize + tileSize / 2, y0 - 10);
    // Letters along left
    ctx.fillText(letters[i], x0 - 12, y0 + i * tileSize + tileSize / 2);
  }

  ctx.restore();
}

function drawCrosshair(x, y, size, col) {
  ctx.save();
  ctx.translate(x, y);

  const pulse = Math.sin(performance.now() * 0.008) * 3;
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = col;
  ctx.shadowBlur = 12;

  // Four bracket corners
  const cornerLen = 12;
  const p = 4 - pulse * 0.5;

  // Top-Left
  ctx.beginPath();
  ctx.moveTo(p, p + cornerLen); ctx.lineTo(p, p); ctx.lineTo(p + cornerLen, p);
  ctx.stroke();
  // Top-Right
  ctx.beginPath();
  ctx.moveTo(size - p - cornerLen, p); ctx.lineTo(size - p, p); ctx.lineTo(size - p, p + cornerLen);
  ctx.stroke();
  // Bottom-Left
  ctx.beginPath();
  ctx.moveTo(p, size - p - cornerLen); ctx.lineTo(p, size - p); ctx.lineTo(p + cornerLen, size - p);
  ctx.stroke();
  // Bottom-Right
  ctx.beginPath();
  ctx.moveTo(size - p - cornerLen, size - p); ctx.lineTo(size - p, size - p); ctx.lineTo(size - p, size - p - cornerLen);
  ctx.stroke();

  // Center targeting dot
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawShipPreviewGhost(x0, y0, tileSize, r, c, len, rot, isValid) {
  ctx.save();
  const color = isValid ? 'rgba(16, 185, 129, 0.45)' : 'rgba(239, 68, 68, 0.5)';
  const borderCol = isValid ? '#10b981' : '#ef4444';

  ctx.fillStyle = color;
  ctx.strokeStyle = borderCol;
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);

  for (let i = 0; i < len; i++) {
    const cr = rot === 1 ? r + i : r;
    const cc = rot === 0 ? c + i : c;
    if (cr >= 0 && cr < GRID_SIZE && cc >= 0 && cc < GRID_SIZE) {
      const tx = x0 + cc * tileSize;
      const ty = y0 + cr * tileSize;
      ctx.fillRect(tx + 2, ty + 2, tileSize - 4, tileSize - 4);
      ctx.strokeRect(tx + 2, ty + 2, tileSize - 4, tileSize - 4);
    }
  }

  ctx.restore();
}

function drawShipGraphic(x0, y0, tileSize, ship, themeColor) {
  ctx.save();
  const r = ship.startR;
  const c = ship.startC;
  const len = ship.length;
  const rot = ship.rot;

  const sx = x0 + c * tileSize + 4;
  const sy = y0 + r * tileSize + 4;
  const sw = rot === 0 ? (len * tileSize - 8) : (tileSize - 8);
  const sh = rot === 1 ? (len * tileSize - 8) : (tileSize - 8);

  // Metallic Naval Hull
  const grad = ctx.createLinearGradient(sx, sy, sx + sw, sy + sh);
  grad.addColorStop(0, '#334155');
  grad.addColorStop(0.5, '#475569');
  grad.addColorStop(1, '#1e293b');
  ctx.fillStyle = grad;

  ctx.beginPath();
  roundRect(ctx, sx, sy, sw, sh, tileSize * 0.28);
  ctx.fill();

  // Ship Neon ID trim
  ctx.strokeStyle = ship.sunk ? '#ef4444' : themeColor;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Ship Deck Features (Turrets, runway strip)
  ctx.fillStyle = '#64748b';
  for (let i = 0; i < len; i++) {
    const cx = rot === 0 ? (sx + i * tileSize + tileSize / 2 - 4) : (sx + sw / 2);
    const cy = rot === 1 ? (sy + i * tileSize + tileSize / 2 - 4) : (sy + sh / 2);
    ctx.beginPath();
    ctx.arc(cx, cy, tileSize * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawHitMarker(cx, cy, rad) {
  ctx.save();
  // Fiery Explosion Hit Peg
  ctx.shadowColor = '#ef4444';
  ctx.shadowBlur = 14;

  const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, rad);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.4, '#facc15');
  grad.addColorStop(0.8, '#ef4444');
  grad.addColorStop(1, '#991b1b');
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.arc(cx, cy, rad, 0, Math.PI * 2);
  ctx.fill();

  // Flame spikes
  ctx.font = `${Math.floor(rad * 1.5)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔥', cx, cy - 2);

  ctx.restore();
}

function drawMissMarker(cx, cy, rad) {
  ctx.save();
  // Water Splash Marker Peg
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, rad * 1.2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#7dd3fc';
  ctx.beginPath();
  ctx.arc(cx, cy, rad * 0.65, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFiringMissile(anim) {
  const p = anim.t / anim.maxT;
  const curX = anim.startX + (anim.targetX - anim.startX) * p;
  const curY = anim.startY + (anim.targetY - anim.startY) * p - Math.sin(p * Math.PI) * 120; // Arc trajectory

  ctx.save();
  ctx.fillStyle = '#facc15';
  ctx.shadowColor = '#f97316';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(curX, curY, 6, 0, Math.PI * 2);
  ctx.fill();

  // Smoke trail particle
  if (Math.random() < 0.8) {
    particles.push(new Particle(curX, curY, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, '#94a3b8', 3, 0.4, true));
  }
  ctx.restore();
}

/* ==========================================================================
   PRIVACY TRANSITION CURTAINS ("PASS DEVICE TO PLAYER")
   ========================================================================== */
function drawPrivacyPassCurtain() {
  ctx.save();

  // Dark impenetrable curtain blocking screen
  ctx.fillStyle = 'rgba(2, 6, 14, 0.96)';
  ctx.fillRect(0, 0, CW, CH);

  const cx = CW / 2;
  const cy = CH / 2;

  let nextPlayerName = 'PLAYER 2';
  let nextPlayerCol = players[1].color;
  let nextPlayerIcon = players[1].icon;
  let purpose = 'SECRET FLEET DEPLOYMENT';

  if (gamePhase === PHASE_PASS_TO_BATTLE) {
    nextPlayerName = 'PLAYER 1';
    nextPlayerCol = players[0].color;
    nextPlayerIcon = players[0].icon;
    purpose = 'BATTLE STATIONS! FIRE FIRST SALVO';
  } else if (gamePhase === PHASE_PASS_TO_P2) {
    nextPlayerName = 'PLAYER 2';
    nextPlayerCol = players[1].color;
    nextPlayerIcon = players[1].icon;
    purpose = 'TARGETING RADAR ACTIVE';
  } else if (gamePhase === PHASE_PASS_TO_P1) {
    nextPlayerName = 'PLAYER 1';
    nextPlayerCol = players[0].color;
    nextPlayerIcon = players[0].icon;
    purpose = 'TARGETING RADAR ACTIVE';
  }

  // Center Privacy Warning Box
  ctx.fillStyle = 'rgba(11, 26, 48, 0.95)';
  ctx.strokeStyle = nextPlayerCol;
  ctx.lineWidth = 4;
  ctx.shadowColor = nextPlayerCol;
  ctx.shadowBlur = 32;

  roundRect(ctx, cx - 280, cy - 200, 560, 400, 24);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Security Padlock Icon
  ctx.font = '64px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔒', cx, cy - 110);

  // Main Announcement
  ctx.font = fFont(36);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(`PASS DEVICE TO`, cx, cy - 35);

  ctx.font = fFont(42);
  ctx.fillStyle = nextPlayerCol;
  ctx.shadowColor = nextPlayerCol;
  ctx.shadowBlur = 16;
  ctx.fillText(`${nextPlayerIcon} ${nextPlayerName} ${nextPlayerIcon}`, cx, cy + 18);
  ctx.shadowBlur = 0;

  ctx.font = fFont(16, '700');
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(purpose, cx, cy + 64);

  // Pulsing Start Button
  const pulse = 1 + Math.sin(performance.now() * 0.007) * 0.04;
  ctx.save();
  ctx.translate(cx, cy + 125);
  ctx.scale(pulse, pulse);

  ctx.fillStyle = nextPlayerCol;
  ctx.shadowColor = nextPlayerCol;
  ctx.shadowBlur = 18;
  roundRect(ctx, -140, -26, 280, 52, 14);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.font = fFont(20);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('PRESS [ ENTER ]', 0, 2);
  ctx.restore();

  ctx.restore();
}

/* ==========================================================================
   VICTORY / GAME OVER MODAL
   ========================================================================== */
function drawVictoryModal() {
  const pWin = players[winner];

  ctx.save();
  ctx.fillStyle = 'rgba(2, 6, 14, 0.9)';
  ctx.fillRect(0, 0, CW, CH);

  const cx = CW / 2;
  const cy = CH / 2;

  // Champion Box
  ctx.fillStyle = 'rgba(11, 26, 48, 0.96)';
  ctx.strokeStyle = pWin.color;
  ctx.lineWidth = 4;
  ctx.shadowColor = pWin.color;
  ctx.shadowBlur = 36;
  roundRect(ctx, cx - 290, cy - 210, 580, 420, 24);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Trophy Icon
  ctx.font = '68px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏆', cx, cy - 120);

  // Winner Announcement
  ctx.font = fFont(38);
  ctx.fillStyle = pWin.light;
  ctx.fillText(`${pWin.icon} ${pWin.name} WINS! ${pWin.icon}`, cx, cy - 40);

  // Subtitle
  ctx.font = fFont(18);
  ctx.fillStyle = '#facc15';

  ctx.font = fFont(16, '600');
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('NAVAL ADMIRAL SUPREME VICTORY', cx, cy + 34);

  // Restart Button
  const pulse = 1 + Math.sin(performance.now() * 0.007) * 0.03;
  ctx.save();
  ctx.translate(cx, cy + 105);
  ctx.scale(pulse, pulse);

  ctx.fillStyle = pWin.color;
  ctx.shadowColor = pWin.color;
  ctx.shadowBlur = 18;
  roundRect(ctx, -140, -28, 280, 56, 14);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.font = fFont(20);
  ctx.fillStyle = '#ffffff';

  ctx.restore();

/* Mouse click on buttons */
canvas.addEventListener('click', (e) => {
  audio.init();

  if ([PHASE_PASS_TO_P2_DEPLOY, PHASE_PASS_TO_BATTLE, PHASE_PASS_TO_P2, PHASE_PASS_TO_P1].includes(gamePhase)) {
    if (gamePhase === PHASE_PASS_TO_P2_DEPLOY) gamePhase = PHASE_DEPLOY_P2;
    else if (gamePhase === PHASE_PASS_TO_BATTLE) gamePhase = PHASE_BATTLE_P1;
    else if (gamePhase === PHASE_PASS_TO_P2) gamePhase = PHASE_BATTLE_P2;
    else if (gamePhase === PHASE_PASS_TO_P1) gamePhase = PHASE_BATTLE_P1;
    return;
  }

  if (gamePhase === PHASE_GAMEOVER) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = CW / rect.width;
    const scaleY = CH / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    const cx = CW / 2;
    const cy = CH / 2;
    if (mx >= cx - 140 && mx <= cx + 140 && my >= cy + 70 && my <= cy + 150) {
      startNewGame();
    }
  }
});

/* Helper: Canvas Rounded Rectangle */
function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

/* ==========================================================================
   MAIN GAME LOOP
   ========================================================================== */
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

// Start game
startNewGame();
requestAnimationFrame(gameLoop);

</script>
